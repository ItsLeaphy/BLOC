function renderHistorico(){
  let h=`<div class="sec">Histórico</div>`;
  if(!history.length)h+=`<div class="empty"><strong>Nenhum treino registrado</strong>Abra um bloco em Hoje e registre.</div>`;
  const byDate={};
  history.forEach((entry,hi)=>{
    if(!byDate[entry.date])byDate[entry.date]={date:entry.date,day:entry.day,entries:[],indices:[]};
    byDate[entry.date].entries.push(entry);byDate[entry.date].indices.push(hi);
  });
  Object.values(byDate).slice(0,20).forEach(group=>{
    const groupKey='g'+group.date.replace(/\//g,'');const isOpen=openHist[groupKey];
    let body='';
    if(isOpen){
      group.entries.forEach(entry=>{
        const blocks_to_render=Array.isArray(entry.exercises)
          ?[{label:entry.blockLabel,type:entry.blockType,exercises:entry.exercises}]
          :(entry.entries||[]);
        blocks_to_render.forEach(blk=>{
          body+=`<div style="margin-top:12px;padding-top:12px;border-top:0.5px solid var(--t4)">
            <div style="font-size:10px;font-weight:500;color:var(--t2);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">${blk.label||entry.blockLabel||''}</div>`;
          (blk.exercises||[]).forEach(e=>{
            let val;
            if(e.time&&e.time>0&&(!e.reps||e.reps===0)){val=`${e.sets}×${e.time}s`;}
            else if(e.weight&&e.weight>0){val=`${e.sets}×${e.reps} · ${e.weight}kg`;}
            else{val=`${e.sets}×${e.reps}`;}
            /* Renderiza badge de status se o exercício foi marcado como done ou skipped.
               O campo 'status' é gravado pelo saveLog() a partir de sessionExStatus.
               null/undefined = nenhuma marcação explícita (exercício neutro). */
            const statusBadge = e.status === 'done'
              ? `<span class="hist-ex-status done">feito</span>`
              : e.status === 'skipped'
              ? `<span class="hist-ex-status skipped">pulado</span>`
              : '';
            body+=`<div class="h-ex-row"><span class="h-ex-name">${e.name}</span>${statusBadge}<span class="h-ex-val">${val}</span></div>`;
          });
          body+=`</div>`;
        });
      });
    }
    const chevSvg=`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5L7 9L11 5"/></svg>`;
    h+=`<div class="hist-c">
      <div class="hist-h" onclick="openHist['${groupKey}']=!openHist['${groupKey}'];render()">
        <div>
          <div class="hist-day">${group.day}</div>
          <div class="hist-date">${group.date} · ${group.entries.length} bloco${group.entries.length!==1?'s':''}</div>
        </div>
        <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
      </div>
      ${isOpen?`<div class="hist-body">${body}</div>`:''}
    </div>`;
  });

  h+=`<div class="sec" style="margin-top:24px">Evolução</div>`;
  /* BUG-08: exMap reconstruído a cada render (toggle de item = render completo = 1800 iterações).
     Agora memoizado: só reconstrói quando history muda.
     Invalidação ocorre em _buildHistoryIndex() que é chamado por saveLog/import/danger. */
  const histCacheKey = history.length + '|' + (history[0]?.timestamp ?? '');
  if(_histCache.key !== histCacheKey){
    const freshMap = {};
    history.forEach(en=>{
      const exList=Array.isArray(en.exercises)?en.exercises:(en.entries||[]).flatMap(b=>b.exercises||[]);
      exList.forEach(e=>{
        if(!freshMap[e.name])freshMap[e.name]=[];
        freshMap[e.name].push({w:e.weight||0,r:e.reps||0,t:e.time||0,d:en.date});
      });
    });
    _histCache = { key: histCacheKey, exMap: freshMap };
  }
  const exMap = _histCache.exMap;
  const tracked=Object.entries(exMap).filter(([,v])=>v.length>=2);
  if(!tracked.length){
    h+=`<div class="empty"><strong>Sem dados de evolução</strong>Registre ao menos 2 blocos para ver progresso.</div>`;
  } else {
    tracked.forEach(([name,vals])=>{
      const curr=vals[0];const prev=vals[vals.length>4?vals.length-4:vals.length-1];
      const useW=curr.w>0;
      const cv=useW?curr.w:(curr.r||curr.t);
      const pv=useW?prev.w:(prev.r||prev.t);
      if(!cv&&!pv)return;
      const t=trend(cv,pv);
      h+=`<div class="ind-card">
        <div class="ind-ex">${name}</div>
        <div class="ind-cmp">
          <div class="ind-val"><div class="ind-num" style="color:var(--t2)">${pv}${useW?'kg':curr.t?'s':'rep'}</div><div class="ind-lbl">anterior</div></div>
          <div class="ind-arr ${t.cls}">${t.sym}</div>
          <div class="ind-val"><div class="ind-num">${cv}${useW?'kg':curr.t?'s':'rep'}</div><div class="ind-lbl">recente</div></div>
          <div style="flex:1;text-align:right"><span class="trnd ${t.cls}">${t.txt}</span></div>
        </div>
      </div>`;
    });
  }
  return h;
}


function renderStats(){
  /* P-02: memoização — stats envolve 12+ iterações sobre history.
     Cache key inclui statsPeriod e openPR (Fase 2): trocar filtro ou
     abrir/fechar um PR invalida o cache automaticamente. */
  const statsCacheKey = history.length + '|' + (history[0]?.timestamp ?? '') + '|' + statsPeriod + '|' + (openPR||'');
  if(_statsCache.key === statsCacheKey && _statsCache.html){
    return _statsCache.html;
  }

  /* ── Período filtrado — todos os cálculos de stats usam esta fatia ── */
  const hFiltered = _filterByPeriod(history, statsPeriod);

  const totalRegistros=hFiltered.length;
  const streak=calcStreak(); /* streak não filtra por período — é sempre global */
  const weekRate=calcWeekRate(); /* sempre semana atual */
  const volThis=calcWeeklyVolume(0);
  const volPrev=calcWeeklyVolume(1);
  const volDiff=volPrev>0?Math.round(((volThis-volPrev)/volPrev)*100):null;
  const skipped=getSkippedExercises(hFiltered).slice(0,5);
  const topEx=getTopExercisesEvolution(5);
  const topExCount=getTopExercisesByCount(8);  /* Item 3 · Fase 1 */
  const dowStats=calcDayOfWeekStats();
  const prs=getAllPRs(hFiltered).slice(0,6);
  const muscleFreq=calcMuscleFrequency();
  const adherence=calcBlockAdherence();
  const summary=calcWeeklySummary(1);

  const card=(content,extra)=>`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;${extra||''}">${content}</div>`;
  const lbl=(txt)=>`<div style="font-size:10px;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;font-weight:500">${txt}</div>`;

  let h=`<div class="sec">Stats</div>`;

  /* ── Fase 2 · Item 5: Seletor de período ────────────────────────────────
     Botões 7d / 30d / 90d / Tudo. Muda statsPeriod + invalida _statsCache.
     Posicionado antes de tudo — afeta todos os cards abaixo.
     ─────────────────────────────────────────────────────────────────────── */
  const _periods=[{k:'7d',l:'7d'},{k:'30d',l:'30d'},{k:'90d',l:'90d'},{k:'all',l:'Tudo'}];
  let _periodBtns='<div style="display:flex;gap:6px;margin-bottom:14px">';
  _periods.forEach(({k,l})=>{
    const _active=statsPeriod===k;
    _periodBtns+=`<button onclick="_setStatsPeriod('${k}')" style="flex:1;padding:6px 0;font-size:11px;font-weight:500;font-family:inherit;letter-spacing:.5px;border-radius:var(--r-sm);cursor:pointer;transition:all var(--dur-fast);background:${_active?'var(--s3)':'transparent'};border:0.5px solid ${_active?'var(--b2)':'var(--b1)'};color:${_active?'var(--tc)':'var(--t2)'}">${l}</button>`;
  });
  _periodBtns+='</div>';
  h+=_periodBtns;

  if(!totalRegistros){
    h+=`<div class="empty"><strong>Nenhum treino registrado</strong>Registre seu primeiro bloco para ver seus stats.</div>`;
    h+=`<button class="add-b" style="width:100%;justify-content:center;margin-top:8px" onclick="openModal({t:'addGoal'})">+ Nova meta</button>`;
    h+=renderGoals();
    return h;
  }

  /* ══════════════════════════════
     § 1  PULSO — 3 cards topo
     ══════════════════════════════ */
  const rateColor=weekRate>=80?'var(--green)':weekRate>=50?'var(--yellow)':'var(--t2)';
  const streakSub=streak.best>streak.current?`<div style="font-size:10px;color:var(--t2);margin-top:3px">recorde ${streak.best}d</div>`:'';
  const volDiffStr=volDiff!==null
    ?`<span style="color:${volDiff>=0?'var(--green)':'var(--red)'}">${volDiff>=0?'+':''}${volDiff}%</span>`
    :`<span style="color:var(--t2)">—</span>`;

  h+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">`;
  h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:14px 12px">
    ${lbl('Sequência')}
    <div style="font-size:26px;font-weight:500;color:var(--tc);line-height:1">${streak.current}<span style="font-size:12px;color:var(--t2);margin-left:2px">d</span></div>
    ${streakSub}
  </div>`;
  /* Item 2 — Fase 1: bolinhas de dias da semana no lugar do % seco.
     Lógica: percorre Dom→Sab, marca dia como "planejado" se há blocos
     naquele dia, e como "feito" se há registro em history para aquela data.
     Dias sem blocos planejados ficam apagados (ghost). */
  const _now2=new Date();
  const _dow2=_now2.getDay();
  const _wkStart2=new Date(_now2);_wkStart2.setDate(_now2.getDate()-_dow2);_wkStart2.setHours(0,0,0,0);
  const _doneSet2=new Set(history.map(h=>h.date));
  const _DLABELS=['D','S','T','Q','Q','S','S'];
  let _weekDots='<div style="display:flex;gap:3px;margin-top:6px">';
  for(let i=0;i<=6;i++){
    const _d=new Date(_wkStart2);_d.setDate(_wkStart2.getDate()+i);
    const _dk=DAYS[i];
    const _hasBlocks=blocks[_dk]&&blocks[_dk].length>0;
    const _dateStr=_d.toLocaleDateString('pt-BR');
    const _isDone=_doneSet2.has(_dateStr);
    const _isFuture=i>_dow2;
    let _dotColor,_dotBorder;
    if(!_hasBlocks){_dotColor='transparent';_dotBorder='var(--t4)';}
    else if(_isDone){_dotColor='var(--green)';_dotBorder='var(--green)';}
    else if(_isFuture){_dotColor='transparent';_dotBorder='var(--t2)';}
    else{_dotColor='var(--red)';_dotBorder='var(--red)';}
    _weekDots+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <div style="width:8px;height:8px;border-radius:50%;background:${_dotColor};border:1px solid ${_dotBorder};opacity:${_hasBlocks?1:0.25}"></div>
      <div style="font-size:8px;color:${_hasBlocks?'var(--t2)':'var(--t3)'};line-height:1">${_DLABELS[i]}</div>
    </div>`;
  }
  _weekDots+='</div>';
  h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:14px 12px">
    ${lbl('Semana')}
    <div style="font-size:22px;font-weight:500;color:${rateColor};line-height:1">${weekRate}<span style="font-size:12px;color:var(--t2);margin-left:2px">%</span></div>
    ${_weekDots}
  </div>`;
  h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:14px 12px">
    ${lbl('Volume')}
    <div style="font-size:22px;font-weight:500;color:var(--tc);line-height:1">${volThis}<span style="font-size:11px;color:var(--t2);margin-left:2px">kg</span></div>
    <div style="font-size:10px;color:var(--t2);margin-top:3px">${volDiffStr} vs ant.</div>
  </div>`;
  h+=`</div>`;

  /* ══════════════════════════════
     § 1.5  SEMANA PASSADA — Item 1 · Fase 1
     Card de destaque reposicionado: logo após o pulso, antes dos insights.
     Usa calcWeeklySummary(1) já calculado acima. Bolinhas de dias mostram
     quais dias da semana passada tinham blocos e quais foram concluídos.
     ══════════════════════════════ */
  if(summary){
    /* Bolinhas de dias da semana passada */
    const _prevWkStart=new Date();
    const _pdow=_prevWkStart.getDay();
    _prevWkStart.setDate(_prevWkStart.getDate()-_pdow-7);
    _prevWkStart.setHours(0,0,0,0);
    const _prevDoneSet=new Set(history.map(h=>h.date));
    const _DLABELS2=['D','S','T','Q','Q','S','S'];
    let _prevDots='<div style="display:flex;gap:3px;margin-bottom:12px">';
    for(let i=0;i<=6;i++){
      const _pd=new Date(_prevWkStart);_pd.setDate(_prevWkStart.getDate()+i);
      const _pdk=DAYS[i];
      const _pHasBlocks=blocks[_pdk]&&blocks[_pdk].length>0;
      const _pDateStr=_pd.toLocaleDateString('pt-BR');
      const _pDone=_prevDoneSet.has(_pDateStr);
      let _pdotColor,_pdotBorder;
      if(!_pHasBlocks){_pdotColor='transparent';_pdotBorder='var(--t4)';}
      else if(_pDone){_pdotColor='var(--green)';_pdotBorder='var(--green)';}
      else{_pdotColor='var(--red)';_pdotBorder='var(--red)';}
      _prevDots+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="width:8px;height:8px;border-radius:50%;background:${_pdotColor};border:1px solid ${_pdotBorder};opacity:${_pHasBlocks?1:0.3}"></div>
        <div style="font-size:8px;color:${_pHasBlocks?'var(--t2)':'var(--t3)'};line-height:1">${_DLABELS2[i]}</div>
      </div>`;
    }
    _prevDots+='</div>';

    const _volC=calcWeeklySummary(0);
    const _dc=_volC&&summary.vol>0?(()=>{const d=Math.round(((_volC.vol-summary.vol)/summary.vol)*100);return`<span style="color:${d>=0?'var(--green)':'var(--red)'};font-weight:500">${d>=0?'+':''}${d}%</span>`;})():'—';
    const _prBadges=summary.prs.length?summary.prs.map(p=>`<span style="font-size:10px;background:rgba(255,255,255,0.04);border:0.5px solid var(--b2);border-radius:6px;padding:2px 8px;color:var(--ac)">${p.name} ${p.weight}kg</span>`).join(''):'';
    const _skipBadges=summary.topSkipped.length?summary.topSkipped.map(([n,c])=>`<span style="font-size:10px;background:rgba(245,158,11,0.06);border:0.5px solid rgba(245,158,11,0.25);border-radius:6px;padding:2px 8px;color:var(--yellow)">${n} (${c}×)</span>`).join(''):'';

    h+=card(`${lbl('Semana passada — '+summary.label)}
      ${_prevDots}
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:0.5px solid var(--t4);padding-top:10px;margin-bottom:${summary.prs.length||summary.topSkipped.length?10:0}px">
        <div style="text-align:center;padding:0 4px">
          <div style="font-size:20px;font-weight:500;color:var(--tc);line-height:1">${summary.days}</div>
          <div style="font-size:9px;color:var(--t2);margin-top:3px;letter-spacing:.5px;text-transform:uppercase">dias</div>
        </div>
        <div style="text-align:center;padding:0 4px;border-left:0.5px solid var(--t4)">
          <div style="font-size:20px;font-weight:500;color:var(--tc);line-height:1">${summary.blocks}</div>
          <div style="font-size:9px;color:var(--t2);margin-top:3px;letter-spacing:.5px;text-transform:uppercase">blocos</div>
        </div>
        <div style="text-align:center;padding:0 4px;border-left:0.5px solid var(--t4)">
          <div style="font-size:20px;font-weight:500;color:var(--tc);line-height:1">${summary.exercises}</div>
          <div style="font-size:9px;color:var(--t2);margin-top:3px;letter-spacing:.5px;text-transform:uppercase">exerc.</div>
        </div>
        <div style="text-align:center;padding:0 4px;border-left:0.5px solid var(--t4)">
          <div style="font-size:16px;font-weight:500;color:var(--tc);line-height:1;margin-top:2px">${summary.vol}<span style="font-size:10px;color:var(--t2);margin-left:1px">kg</span></div>
          <div style="font-size:9px;color:var(--t2);margin-top:3px;letter-spacing:.5px">${_dc} vs esta</div>
        </div>
      </div>
      ${_prBadges?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">${_prBadges}</div>`:''}
      ${_skipBadges?`<div style="display:flex;flex-wrap:wrap;gap:5px">${_skipBadges}</div>`:''}`);
  }

  /* ══════════════════════════════
     § 1.7  TOP EXERCÍCIOS — Item 3 · Fase 1
     Lista dos exercícios com mais aparições no histórico.
     Usa getTopExercisesByCount() que lê _historyIndex em O(1).
     Exibe: nome, contagem de sessões, última data treinado.
     ══════════════════════════════ */
  if(topExCount.length){
    let _topRows='';
    const _maxCount=topExCount[0].count;
    topExCount.forEach(({name,count,lastDate},_ti)=>{
      const _bw=Math.round((count/_maxCount)*100);
      const _fill=_ti===0?'var(--ac)':_bw>=70?'var(--t2)':'var(--t3)';
      _topRows+=`<div style="display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:8px">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
            <div style="font-size:12px;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">${name}</div>
            <div style="font-size:10px;color:var(--t2);flex-shrink:0;margin-left:8px">${lastDate}</div>
          </div>
          <div style="height:3px;background:var(--s3);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${_bw}%;background:${_fill};border-radius:2px;opacity:${_ti===0?1:0.7}"></div>
          </div>
        </div>
        <div style="font-size:11px;font-weight:500;color:var(--t2);text-align:right;flex-shrink:0;min-width:28px">${count}×</div>
      </div>`;
    });
    h+=card(`${lbl('Mais treinados — total de sessões')}${_topRows}`);
  }

  /* ══════════════════════════════
     § 1.8  INSIGHTS AUTOMÁTICOS
     ══════════════════════════════ */
  const insights=generateInsights();
  if(insights.length){
    const iconMap={positive:'var(--green)',warning:'var(--yellow)',neutral:'var(--t2)'};
    let cards='';
    insights.forEach(({type,icon,text,sub})=>{
      const accent=iconMap[type]||'var(--t2)';
      cards+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-left:2px solid ${accent};border-radius:var(--r-md);padding:10px 12px;display:flex;align-items:flex-start;gap:10px">
        <div style="font-size:16px;flex-shrink:0;margin-top:1px">${icon}</div>
        <div>
          <div style="font-size:13px;color:var(--tc);font-weight:500;line-height:1.3">${text}</div>
          <div style="font-size:11px;color:var(--t2);margin-top:2px;line-height:1.4">${sub}</div>
        </div>
      </div>`;
    });
    h+=`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px">${cards}</div>`;
  }

  /* ══════════════════════════════
     § 2  HEATMAP
     ══════════════════════════════ */
  h+=card(`${lbl('Frequência — últimas 12 semanas')}${renderHeatmap()}`);

  /* ══════════════════════════════
     § 3  DONUT de consistência + barras DOW lado a lado
     ══════════════════════════════ */
  if(dowStats.length){
    /* Donut SVG */
    const pct=weekRate;
    const r=28,cx=38,cy=38,circ=2*Math.PI*r;
    const arc=circ*(pct/100);
    const arcColor=pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)';
    const donut=`<svg width="76" height="76" viewBox="0 0 76 76" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--s3)" stroke-width="7"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${arcColor}" stroke-width="7"
        stroke-dasharray="${arc} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/>
      <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="500" fill="var(--tc)">${pct}%</text>
    </svg>`;

    /* Barras por dia */
    const maxRate=Math.max(...dowStats.map(d=>d.rate),1);
    let bars='<div style="flex:1;display:flex;flex-direction:column;gap:5px">';
    dowStats.forEach(d=>{
      const bw=Math.round((d.rate/maxRate)*100);
      const bc=d.rate>=80?'var(--green)':d.rate>=50?'var(--yellow)':'var(--red)';
      bars+=`<div style="display:grid;grid-template-columns:22px 1fr 30px;align-items:center;gap:6px">
        <div style="font-size:10px;color:var(--t2)">${d.label}</div>
        <div style="height:4px;background:var(--s3);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${bw}%;background:${bc};border-radius:2px"></div>
        </div>
        <div style="font-size:10px;color:var(--t2);text-align:right">${d.rate}%</div>
      </div>`;
    });
    bars+='</div>';

    h+=card(`${lbl('Consistência por dia')}<div style="display:flex;align-items:center;gap:14px">${donut}${bars}</div>`);
  }

  /* ══════════════════════════════
     § 4  GRÁFICO DE LINHA — evolução de carga
     ══════════════════════════════ */
  if(topEx.length){
    /* Renderiza um gráfico de linha SVG para cada exercício */
    const renderLineChart=(vals,useW)=>{
      const series=vals.map(v=>useW?v.w:(v.r||v.t||0)).filter(v=>v>0);
      if(series.length<2)return'';
      const minV=Math.min(...series),maxV=Math.max(...series);
      const range=Math.max(maxV-minV,1);
      const W=120,H=36,PAD=4;
      const pts=series.map((v,i)=>{
        const x=PAD+((W-PAD*2)/(series.length-1))*i;
        const y=H-PAD-((v-minV)/range)*(H-PAD*2);
        return`${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const last=series[series.length-1],first=series[0];
      const lineColor=last>first?'var(--green)':last<first?'var(--red)':'var(--t2)';
      /* Área preenchida */
      const areaEnd=`${(PAD+((W-PAD*2)/(series.length-1))*(series.length-1)).toFixed(1)},${H-PAD} ${PAD},${H-PAD}`;
      return`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;flex-shrink:0">
        <polyline points="${pts} ${areaEnd}" fill="${lineColor}" opacity=".08"/>
        <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="2.5" fill="${lineColor}"/>
      </svg>`;
    };

    let rows='';
    topEx.forEach(({name,vals})=>{
      const useW=vals.some(v=>v.w>0);
      const series=vals.map(v=>useW?v.w:(v.r||v.t||0)).filter(v=>v>0);
      if(!series.length)return;
      const last=series[series.length-1],first=series[0];
      const unit=useW?'kg':vals[vals.length-1]?.t?'s':'rep';
      const diff=last-first;
      const dc=diff>0?'var(--green)':diff<0?'var(--red)':'var(--t2)';
      const ds=diff>0?`+${diff}`:diff===0?'=':String(diff);
      const chart=renderLineChart(vals,useW);
      rows+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--t4)">
        <div style="flex:1;min-width:0;margin-right:10px">
          <div style="font-size:13px;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
          <div style="font-size:10px;color:var(--t2);margin-top:2px">${first}${unit} → <strong style="color:var(--tc)">${last}${unit}</strong> <span style="color:${dc}">(${ds}${unit})</span></div>
        </div>
        ${chart}
      </div>`;
    });
    if(rows)h+=card(`${lbl('Evolução de carga')}${rows}`);
  }

  /* ══════════════════════════════
     § 5  BARRAS DE VOLUME SEMANAL (últimas 8 semanas)
     ══════════════════════════════ */
  {
    const NUM_WEEKS=8;
    const weekVols=[];
    for(let i=NUM_WEEKS-1;i>=0;i--){weekVols.push({offset:i,vol:calcWeeklyVolume(i)});}
    const maxVol=Math.max(...weekVols.map(w=>w.vol),1);
    if(weekVols.some(w=>w.vol>0)){
      const BAR_W=28,GAP=6,H=60,PAD_B=16;
      const chartW=(BAR_W+GAP)*NUM_WEEKS-GAP;
      let bars2='';
      weekVols.forEach(({offset,vol},i)=>{
        const bh=Math.max(2,Math.round((vol/maxVol)*(H-PAD_B)));
        const x=i*(BAR_W+GAP);
        const y=H-PAD_B-bh;
        const isThis=offset===0;
        const fill=isThis?'var(--ac)':'var(--s3)';
        const fillOp=isThis?1:0.7;
        bars2+=`<rect x="${x}" y="${y}" width="${BAR_W}" height="${bh}" rx="3" fill="${fill}" opacity="${fillOp}"/>`;
        if(isThis||i===0||i===NUM_WEEKS-1){
          bars2+=`<text x="${x+BAR_W/2}" y="${H}" text-anchor="middle" font-size="9" fill="var(--t2)">${isThis?'agora':`-${offset}s`}</text>`;
        }
        if(vol>0&&isThis){
          bars2+=`<text x="${x+BAR_W/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--tc)" font-weight="500">${vol}</text>`;
        }
      });
      h+=card(`${lbl('Volume semanal — kg/semana')}<svg width="100%" viewBox="0 0 ${chartW} ${H+4}" style="display:block;overflow:visible">${bars2}</svg>`);
    }
  }

  /* ══════════════════════════════
     § 5.5  COMPARATIVO MÊS A MÊS — Fase 2 · Item 6
     Gráfico de barras dos últimos 6 meses usando calcMonthlyVolume().
     Perspectiva de longo prazo complementar ao volume semanal.
     ══════════════════════════════ */
  {
    const NUM_MONTHS=6;
    const _monthNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const _now6=new Date();
    const _monthVols=[];
    for(let i=NUM_MONTHS-1;i>=0;i--){
      const _d=new Date(_now6.getFullYear(),_now6.getMonth()-i,1);
      _monthVols.push({
        offset:i,
        vol:calcMonthlyVolume(i),
        label:_monthNames[_d.getMonth()]
      });
    }
    const _maxMonthVol=Math.max(..._monthVols.map(m=>m.vol),1);
    if(_monthVols.some(m=>m.vol>0)){
      const _MB_W=36,_MB_GAP=6,_MH=60,_MPAD_B=16;
      const _mChartW=(_MB_W+_MB_GAP)*NUM_MONTHS-_MB_GAP;
      let _mBars='';
      _monthVols.forEach(({offset,vol,label},i)=>{
        const _bh=Math.max(2,Math.round((vol/_maxMonthVol)*(_MH-_MPAD_B)));
        const _x=i*(_MB_W+_MB_GAP);
        const _y=_MH-_MPAD_B-_bh;
        const _isCurrent=offset===0;
        const _fill=_isCurrent?'var(--ac)':'var(--s3)';
        _mBars+=`<rect x="${_x}" y="${_y}" width="${_MB_W}" height="${_bh}" rx="3" fill="${_fill}" opacity="${_isCurrent?1:0.7}"/>`;
        _mBars+=`<text x="${_x+_MB_W/2}" y="${_MH}" text-anchor="middle" font-size="9" fill="var(--t2)">${label}</text>`;
        if(vol>0&&_isCurrent){
          _mBars+=`<text x="${_x+_MB_W/2}" y="${_y-4}" text-anchor="middle" font-size="9" fill="var(--tc)" font-weight="500">${vol}</text>`;
        }
      });
      h+=card(`${lbl('Volume mensal — últimos 6 meses')}<svg width="100%" viewBox="0 0 ${_mChartW} ${_MH+4}" style="display:block;overflow:visible">${_mBars}</svg>`);
    }
  }

  /* ══════════════════════════════
     § 6  PRs — grid de cards clicáveis + view expandida
     Fase 2 · Item 7: ao tocar num PR, abre view com linha do
     tempo completa + gráfico de linha usando _historyIndex.
     Estado: openPR (string com nome do exercício | null).
     ══════════════════════════════ */
  if(prs.length){
    /* Se há um PR aberto, renderiza a view expandida no lugar do grid */
    if(openPR && _historyIndex[openPR]){
      const _prEntries=_historyIndex[openPR].filter(e=>e.w>0).slice().reverse(); /* ordem cronológica */
      const _prName=openPR;
      const _prBest=Math.max(..._prEntries.map(e=>e.w));

      /* Gráfico de linha SVG */
      let _prChart='';
      if(_prEntries.length>=2){
        const _W=280,_H=60,_PAD=8;
        const _vals=_prEntries.map(e=>e.w);
        const _mn=Math.min(..._vals),_mx=Math.max(..._vals);
        const _range=Math.max(_mx-_mn,1);
        const _pts=_vals.map((v,i)=>{
          const _x=_PAD+((_W-_PAD*2)/(_vals.length-1))*i;
          const _y=_H-_PAD-(v-_mn)/_range*(_H-_PAD*2);
          return`${_x.toFixed(1)},${_y.toFixed(1)}`;
        });
        /* Área preenchida */
        const _lastX=_PAD+((_W-_PAD*2)/(_vals.length-1))*(_vals.length-1);
        const _areaPath=`M${_pts[0]} L${_pts.join(' L')} L${_lastX},${_H-_PAD} L${_PAD},${_H-_PAD} Z`;
        const _linePath=`M${_pts.join(' L')}`;
        const _lastVal=_vals[_vals.length-1];
        const _firstVal=_vals[0];
        const _lc=_lastVal>_firstVal?'var(--green)':_lastVal<_firstVal?'var(--red)':'var(--t2)';
        _prChart=`<svg viewBox="0 0 ${_W} ${_H+4}" width="100%" style="display:block;margin-bottom:12px;overflow:visible">
          <path d="${_areaPath}" fill="${_lc}" opacity="0.06"/>
          <path d="${_linePath}" fill="none" stroke="${_lc}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${_pts[_pts.length-1].split(',')[0]}" cy="${_pts[_pts.length-1].split(',')[1]}" r="3" fill="${_lc}"/>
        </svg>`;
      }

      /* Linha do tempo */
      let _timeline='';
      const _tl=[..._prEntries].reverse(); /* mais recente primeiro para display */
      _tl.forEach((e,ti)=>{
        const _isPR2=e.w===_prBest;
        _timeline+=`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--t4)${ti===_tl.length-1?';border-bottom:none':''}">
          <div style="font-size:10px;color:var(--t2);min-width:52px;flex-shrink:0">${e.date}</div>
          <div style="flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${Math.round((e.w/_prBest)*100)}%;background:${_isPR2?'var(--green)':'var(--t2)'};border-radius:2px;opacity:${_isPR2?1:0.5}"></div>
          </div>
          <div style="font-size:12px;font-weight:500;color:${_isPR2?'var(--green)':'var(--tc)'};min-width:48px;text-align:right;flex-shrink:0">${e.w}kg${_isPR2?' 🏆':''}</div>
        </div>`;
      });

      h+=card(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:10px;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;font-weight:500">Record pessoal</div>
          <div style="font-size:15px;color:var(--tc);font-weight:500;margin-top:2px">${_prName}</div>
        </div>
        <button onclick="_togglePR(null)" style="font-size:11px;color:var(--t2);background:var(--s2);border:0.5px solid var(--b1);border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;font-family:inherit">← voltar</button>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:10px 12px;background:var(--s2);border-radius:var(--r-md);border:0.5px solid var(--b1)">
        <div style="text-align:center">
          <div style="font-size:26px;font-weight:500;color:var(--green);line-height:1">${_prBest}<span style="font-size:13px;color:var(--t2);margin-left:2px">kg</span></div>
          <div style="font-size:9px;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px">máximo</div>
        </div>
        <div style="width:0.5px;background:var(--t4);align-self:stretch"></div>
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:500;color:var(--tc);line-height:1">${_prEntries.length}</div>
          <div style="font-size:9px;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px">sessões</div>
        </div>
        <div style="width:0.5px;background:var(--t4);align-self:stretch"></div>
        <div style="text-align:center">
          <div style="font-size:14px;font-weight:500;color:var(--tc);line-height:1;margin-top:4px">${_prEntries[_prEntries.length-1]?.date||'—'}</div>
          <div style="font-size:9px;color:var(--t2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px">início</div>
        </div>
      </div>
      ${_prChart}
      ${lbl('Histórico de cargas')}
      ${_timeline}`);
    } else {
      /* Grid padrão de PRs — clicável para abrir a view */
      let prCards='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
      prs.forEach(({name,weight,date})=>{
        const _hasHistory=(_historyIndex[name]||[]).filter(e=>e.w>0).length>=2;
        prCards+=`<div onclick="${_hasHistory?`_togglePR('${name.replace(/'/g,"\\'")}')`:''}" style="background:var(--s2);border:0.5px solid var(--b1);border-radius:var(--r-md);padding:10px 12px;${_hasHistory?'cursor:pointer;':''}transition:border-color var(--dur-fast)">
          <div style="font-size:10px;color:var(--t2);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
          <div style="font-size:18px;font-weight:500;color:var(--ac)">${weight}<span style="font-size:11px;color:var(--t2);margin-left:2px">kg</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
            <div style="font-size:10px;color:var(--t2)">${date}</div>
            ${_hasHistory?`<div style="font-size:9px;color:var(--t3);letter-spacing:.3px">ver →</div>`:''}
          </div>
        </div>`;
      });
      prCards+='</div>';
      h+=card(`${lbl('Records pessoais')}${prCards}`);
    }
  }

  /* ══════════════════════════════
     § 7  FREQUÊNCIA MUSCULAR — barras horizontais graduadas
     ══════════════════════════════ */
  if(muscleFreq.length){
    const MLABELS={peito:'Peito',costas:'Costas',ombro:'Ombro',bíceps:'Bíceps',tríceps:'Tríceps',
      perna:'Perna',glúteo:'Glúteo',posterior:'Post.',core:'Core',lombar:'Lombar',
      pescoço:'Pescoço',antebraço:'Antebraço',cardio:'Cardio'};
    const maxS=Math.max(...muscleFreq.map(g=>g.sessions),1);
    let rows='';
    muscleFreq.forEach(g=>{
      const bw=Math.round((g.sessions/maxS)*100);
      const fill=bw>=80?'var(--green)':bw>=50?'var(--ac)':'var(--t2)';
      rows+=`<div style="display:grid;grid-template-columns:62px 1fr 28px;align-items:center;gap:8px;margin-bottom:7px">
        <div style="font-size:11px;color:var(--t2)">${MLABELS[g.group]||g.group}</div>
        <div style="height:6px;background:var(--s3);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${bw}%;background:${fill};border-radius:3px;opacity:.8"></div>
        </div>
        <div style="font-size:10px;color:var(--t2);text-align:right">${g.sessions}×</div>
      </div>`;
    });
    h+=card(`${lbl('Frequência muscular')}${rows}`);
  }

  /* ══════════════════════════════
     § 8  EXERCÍCIOS MAIS EVITADOS
     ══════════════════════════════ */
  if(skipped.length){
    let rows='';
    skipped.forEach(({name,count,total})=>{
      const pct=total>0?Math.round((count/total)*100):0;
      rows+=`<div style="padding:8px 0;border-bottom:0.5px solid var(--t4)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="font-size:13px;color:var(--tc)">${name}</div>
          <div style="font-size:10px;color:var(--yellow)">pulado ${count}× <span style="color:var(--t2)">(${pct}%)</span></div>
        </div>
        <div style="height:3px;background:var(--s3);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--yellow);border-radius:2px"></div>
        </div>
      </div>`;
    });
    h+=card(`${lbl('Mais evitados')}${rows}`);
  }

  /* ══════════════════════════════
     § 9  ADERÊNCIA AO PLANO
     ══════════════════════════════ */
  if(adherence.length){
    const worst=adherence.slice(0,5);
    let rows='';
    worst.forEach(({label,type,done,planned,rate})=>{
      const icon=BTYPE_ICONS[type]||BTYPE_ICONS.custom;
      const bc=rate>=80?'var(--green)':rate>=50?'var(--yellow)':'var(--red)';
      rows+=`<div style="padding:8px 0;border-bottom:0.5px solid var(--t4)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:13px">${icon}</span>
            <span style="font-size:13px;color:var(--tc)">${label}</span>
          </div>
          <div style="font-size:10px;color:var(--t2)">${done}/${planned} <span style="color:${bc};font-weight:500">${rate}%</span></div>
        </div>
        <div style="height:3px;background:var(--s3);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${rate}%;background:${bc};border-radius:2px"></div>
        </div>
      </div>`;
    });
    h+=card(`${lbl('Aderência ao plano — piores blocos')}${rows}`);
  }

  /* § 10  RESUMO SEMANA PASSADA — movido para logo após §1 (ver abaixo) */

  /* ══════════════════════════════
     § 11  METAS
     ══════════════════════════════ */
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px">
    <div style="font-size:10px;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;font-weight:500">Metas</div>
    <button style="font-size:11px;color:var(--tc);background:var(--s2);border:0.5px solid var(--b2);border-radius:var(--r-sm);padding:4px 10px;cursor:pointer" onclick="openModal({t:'addGoal'})">+ nova</button>
  </div>`;
  h+=renderGoals();

  /* rodapé */
  h+=`<div style="text-align:center;padding:10px 0 4px"><div style="font-size:11px;color:var(--t2)">${totalRegistros} registro${totalRegistros!==1?'s':''} no histórico</div></div>`;
  /* P-02: salva no cache antes de retornar */
  _statsCache = { key: statsCacheKey, html: h };
  return h;
}

function renderGoals(){
  if(!goals.length){
    return`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;text-align:center">
      <div style="font-size:12px;color:var(--t2)">Nenhuma meta ainda.</div>
    </div>`;
  }
  let h='';
  goals.forEach((g,i)=>{
    const pct=Math.max(0,Math.min(100,g.progress||0));
    const barColor=pct>=100?'var(--green)':pct>=60?'var(--ac)':'var(--t2)';
    h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
        <div>
          <div style="font-size:14px;color:var(--tc);font-weight:500">${g.name}</div>
          ${g.note?`<div style="font-size:11px;color:var(--t2);margin-top:2px">${g.note}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div style="font-size:13px;font-weight:500;color:${barColor}">${pct}%</div>
          <button style="font-size:11px;color:var(--t2);background:none;border:none;cursor:pointer;padding:2px 4px" onclick="delGoal(${i})" title="Remover">✕</button>
        </div>
      </div>
      <div style="height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-bottom:8px">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .3s"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button style="flex:1;padding:5px 0;font-size:12px;background:var(--s2);border:0.5px solid var(--b1);border-radius:var(--r-sm);color:var(--t2);cursor:pointer" onclick="updGoal(${i},-5)">−5%</button>
        <button style="flex:1;padding:5px 0;font-size:12px;background:var(--s2);border:0.5px solid var(--b1);border-radius:var(--r-sm);color:var(--t2);cursor:pointer" onclick="updGoal(${i},-1)">−1%</button>
        <button style="flex:1;padding:5px 0;font-size:12px;background:var(--s2);border:0.5px solid var(--b2);border-radius:var(--r-sm);color:var(--tc);cursor:pointer" onclick="updGoal(${i},+1)">+1%</button>
        <button style="flex:1;padding:5px 0;font-size:12px;background:var(--s2);border:0.5px solid var(--b2);border-radius:var(--r-sm);color:var(--tc);cursor:pointer" onclick="updGoal(${i},+5)">+5%</button>
      </div>
    </div>`;
  });
  return h;
}

/* ── Painel de configurações ── */
function renderConfig(){
  let h=`<div class="sec">Configurações</div>`;
  h+=`<div class="cfg-tabs">`;
  [{id:'blocos',label:'Blocos'},{id:'aparencia',label:'Aparência'},{id:'dados',label:'Dados'}].forEach(tab=>{
    h+=`<button class="cfg-tab${configTab===tab.id?' active':''}" onclick="setConfigTab('${tab.id}')">${tab.label}</button>`;
  });
  h+=`</div>`;
  if(configTab==='blocos')h+=renderConfigBlocos();
  else if(configTab==='aparencia')h+=renderConfigAparencia();
  else h+=renderConfigDados();
  return h;
}

function setConfigTab(t){configTab=t;render()}

function renderConfigBlocos(){
  let h='';
  DAYS.forEach(dk=>{
    const db=blocks[dk]||[];
    h+=`<div class="prog-c">
      <div class="prog-n">${dk}</div>
      <div class="prog-sub">${db.length?db.map(b=>b.label).join(' · '):'Sem blocos'}</div>
      <div style="margin-top:8px">
        ${db.map((b,bi)=>`<div class="cfg-row">
          <div><div class="cfg-row-label">${b.label}</div><div class="cfg-row-sub">${BTYPES[b.type]?.l||'Custom'} · ${b.exercises.length} ex.</div></div>
          <button class="cfg-del" onclick="openModal({t:'editBlock',dk:'${dk}',bi:${bi}})">editar</button>
        </div>`).join('')}
        <button class="add-b" style="margin-top:8px" onclick="openModal({t:'addBlock',dk:'${dk}'})">
          <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
          + bloco em ${dk}

      </div>
    </div>`;
  });
  return h;
}

function renderConfigAparencia(){
  const a=appearance;
  let h=`<div class="ap-section">`;
  h+=`<div class="ap-title">Tema</div>`;
  const darkThemes=['dark','obsidian','forest','ember','steel','midnight','carbon'];
  const lightThemes=['leninha','paper','frost','sage'];
  const renderGroup=(ids)=>{
    let g='<div class="theme-swatch-grid">';
    ids.forEach(id=>{
      const t=THEMES[id]; if(!t)return;
      const active=a.theme===id;
      const label=id.charAt(0).toUpperCase()+id.slice(1);
      /* Swatch: quadrado com gradiente bg→s2 + dot de acento no canto */
      g+=`<button class="theme-swatch${active?' theme-swatch-active':''}" onclick="setTheme('${id}')" title="${label}" style="--sw-bg:${t.bg};--sw-s1:${t.s1};--sw-s2:${t.s2};--sw-ac:${t.ac};--sw-tc:${t.tc};--sw-t2:${t.t2}">
        <div class="sw-preview">
          <div class="sw-bg" style="background:${t.bg}">
            <div class="sw-card" style="background:${t.s1};border-color:${t.t3}"></div>
            <div class="sw-card sw-card2" style="background:${t.s2};border-color:${t.t3}"></div>
          </div>
          <div class="sw-dot" style="background:${t.ac}"></div>
        </div>
        <div class="sw-name" style="color:${t.tc};background:${t.s1}">${active?'✓ ':''} ${label}</div>
      </button>`;
    });
    return g+'</div>';
  };
  h+=`<div class="preset-group-label">Escuros</div>`;
  h+=renderGroup(darkThemes);
  h+=`<div class="preset-group-label">Claros</div>`;
  h+=renderGroup(lightThemes);
  h+=`<div class="ap-row">
    <div><div class="ap-label">Cor de destaque</div><div class="ap-sub">Barras, botão principal</div></div>
    <div class="ap-control"><div class="color-swatch-wrap" style="background:${a.accentColor}"><input type="color" value="${a.accentColor}" oninput="setAccentColor(this.value)" onchange="setAccentColor(this.value)"></div></div>
  </div>`;
  h+=`<div class="ap-row">
    <div><div class="ap-label">Fonte</div></div>
    <div class="ap-control"><select class="ap-select" onchange="setFont(this.value)">${FONT_OPTIONS.map(f=>`<option value="${f.id}"${a.font===f.id?' selected':''}>${f.name}</option>`).join('')}</select></div>
  </div>`;
  h+=`<div class="ap-row">
    <div><div class="ap-label">Bordas arredondadas</div><div class="ap-sub">${a.borderRadius}px</div></div>
    <div class="ap-control"><input type="range" class="ap-slider" min="0" max="20" value="${a.borderRadius}" oninput="setBorderRadius(this.value)"></div>
  </div>`;
  h+=`<div class="ap-row">

/* ── Setters de aparência — chamados pelos inputs de renderConfigAparencia() ── */
function setTheme(id){
  appearance.theme=id;

  const isLight=t.bg>'#888';
  appearance.accentColor=isLight?'#000000':'#ffffff';

}
/* P-07: debounce para setAccentColor.
   Chamada em oninput do color picker — dispara a cada pixel de movimento.
   Cada chamada sem debounce executava ~15 setProperty() em :root (style recalc
   em todos os elementos com var(--ac)) + um render() completo.
   Debounce de 16ms para applyAppearance() (1 frame) e de 200ms para render()
   — o usuário vê a cor mudar instantaneamente mas o DOM só é recriado ao parar. */
let _accentRenderTimer = null;
function setAccentColor(v){
  appearance.accentColor=v;
  saveStore();
  applyAppearance(); /* atualiza CSS vars imediatamente — visual instantâneo */
  clearTimeout(_accentRenderTimer);
  _accentRenderTimer = setTimeout(()=>{ render(); }, 200);
}
function setFont(id){appearance.font=id;saveStore();applyAppearance();render()}
function setBorderRadius(v){appearance.borderRadius=parseInt(v);saveStore();applyAppearance();render()}
function setCompact(v){appearance.compactMode=v;saveStore();applyAppearance()}
function setAnimSpeed(v){
  appearance.animSpeed=v;saveStore();
  const speeds={fast:'0.15s',normal:'0.22s',slow:'0.38s'};
  document.documentElement.style.setProperty('--dur-base',speeds[v]||'0.22s');
  render();
}
function resetAppearance(){
  appearance={theme:'dark',accentColor:'#ffffff',font:'helvetica',borderRadius:14,compactMode:false,animSpeed:'normal'};
  saveStore();applyAppearance();render();toast('Aparência resetada');
}

/* ── Templates do GitHub — carregamento de planos prontos ── */
function loadTemplate(id, url){
  toast('Buscando template...');
  fetch(url)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data=>{
      // O JSON é {DIA: [...blocos]} — substitui só os blocks
      if(typeof data!=='object'||Array.isArray(data)) throw new Error('Formato inválido');
      /* R6: valida se o objeto tem ao menos uma chave reconhecida de DAYS.
         Protege o usuário de templates com chaves erradas (ex: "Segunda" em vez de "SEG")
         que sobrescreveriam blocks com dados inválidos, zerando o plano silenciosamente. */
      const hasValidKey = DAYS.some(d => Array.isArray(data[d]));
      if(!hasValidKey) throw new Error('Template sem dias válidos — esperado SEG, TER, QUA...');
      /* Sanitiza: garante que só chaves de DAYS entram em blocks (descarta chaves estranhas) */
      const sanitized = {};
      DAYS.forEach(d=>{ if(Array.isArray(data[d])) sanitized[d]=data[d]; });
      blocks = sanitized;
      resetTodaySession(); /* garante que todaySession reflete o novo template */
      saveStore();
      render();
      toast('Template carregado');
    })
    .catch(err=>{
      console.error(err);
      toast('Erro ao buscar template — ' + err.message);
    });
}

/* ── Importação e exportação de dados ── */
function exportData(){
  // Exporta o store completo incluindo versão — compatível com importData
  const d=JSON.stringify({version:DATA_VERSION,blocks,history,goals,appearance},null,2);
  const b=new Blob([d],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='bloc-backup-v'+DATA_VERSION+'-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Backup exportado');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      // Monta store temporário para rodar migrações
      let v=data.version||0;
      const tempStore={
        version:v,
        blocks:data.blocks||JSON.parse(JSON.stringify(DEFAULT_BLOCKS)),
        history:data.history||[],
        goals:data.goals||JSON.parse(JSON.stringify(DEFAULT_GOALS)),
        appearance:data.appearance||JSON.parse(JSON.stringify(DEFAULT_APPEARANCE)),
      };
      let s=tempStore;
      while(v<DATA_VERSION){if(MIGRATIONS[v])s=MIGRATIONS[v](s);v++;}
      // Atualiza todas as variáveis globais — incluindo appearance
      blocks=s.blocks;history=s.history;goals=s.goals;appearance=s.appearance;
      _buildHistoryIndex(); /* P-03/P-04: reconstrói índice após history importado */
      saveStore();
      localStorage.removeItem(TODAY_CACHE_STORE); /* reseta cache de sessão */
      applyAppearance();
      toast('Dados importados');render();
    }catch(err){toast('Erro ao importar — arquivo inválido');}
  };
  reader.readAsText(file);input.value='';
}

/* Input de importação persistente — fora do ciclo de render para não ser destruído */
(function(){
  if(document.getElementById('import-file-persistent')) return;
  const inp=document.createElement('input');
  inp.type='file';inp.id='import-file-persistent';inp.accept='.json';
  inp.style.display='none';
  inp.addEventListener('change',function(){importData(this);});
  document.body.appendChild(inp);
})();

/* ── Danger zone — ações destrutivas com confirmação em 2 passos ── */
function initDangerAction(action){dangerConfirmStep[action]=true;render();setTimeout(()=>{const el=document.getElementById('danger-confirm-'+action);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100)}
function cancelDanger(action){delete dangerConfirmStep[action];render()}
function confirmDanger(action){
  const inp=document.getElementById('danger-input-'+action);if(!inp)return;
  const val=inp.value.trim().toUpperCase();
  if(action==='history'&&val!=='APAGAR'){toast('Digite APAGAR para confirmar');return;}
  if(action==='reset'&&val!=='RESETAR'){toast('Digite RESETAR para confirmar');return;}
