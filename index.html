   Persistido via saveTodayCache() com validade de 1 dia.
   ─────────────────────────────────────────────────────────────────────────── */
let sessionExStatus = {};

/* Retorna a chave de status para um exercício */
function exStatusKey(dk, bi, exName) {
  return `${dk}-${bi}-${exName}`;
}

/* Alterna o status de um exercício. Se clicar no mesmo status ativo, remove-o (toggle).
   Aceita: 'done' | 'skipped' */
function toggleExStatus(dk, bi, exName, newStatus) {
  const k = exStatusKey(dk, bi, exName);
  if (sessionExStatus[k] === newStatus) {
    delete sessionExStatus[k]; /* toggle off */
  } else {
    sessionExStatus[k] = newStatus;
  }
  saveTodayCache(); /* persiste status imediatamente */
  render();
  /* Micro-animação no botão clicado — dispara após render */
  setTimeout(() => {
    const safeName = (dk+bi+exName).replace(/[^a-zA-Z0-9]/g,'_');
    const btnId = `exs-${newStatus.slice(0,4)}-${safeName}`;
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      setTimeout(() => btn.classList.remove('pop'), 400);
    }
  }, 20);
}

/* Atualiza todaySession diretamente, sem tocar blocks nem o store principal.
   Chamada exclusivamente pelos inputs da guia Hoje.
   Persiste via saveTodayCache() para sobreviver ao fechamento do app. */
function updExToday(dk, bi, exName, field, val) {
  const ex = todaySession[bi]?.exercises.find(e => e.name === exName);
  if (ex) {
    ex[field] = parseFloat(val) || 0;
    todaySessionDirty = true;
    saveTodayCache(); /* persiste a sessão imediatamente */
  }
}


/* ════════════════════════════════════════════════════════════════════════════
   § 5 · ANALYTICS — Cálculos puros sobre history
   ────────────────────────────────────────────────────────────────────────────
   Funções puras: sem efeito colateral, sem acesso ao DOM, sem mutação de estado.
   Entrada: history[] (array global) + índice pré-computado (_historyIndex).
   Saída: objetos de dados consumidos por renderStats() e renderHistorico().

   CONTEÚDO:
   · calcStreak()            — dias consecutivos de treino (current + best).
   · isPR_before()           — verifica se um peso é PR antes de salvar.
   · isPR()                  — verifica PR após registro (usa _historyIndexPrMap).
   · getLastRegistered()     — último registro de um exercício (O(1) via índice).
   · trend()                 — direção da carga (up/down/eq) para badge de tendência.
   · getExHistory()          — histórico completo de um exercício (O(1) via índice).
   · calcMuscleFrequency()   — frequência por grupo muscular (últimas 4 semanas).
   · calcBlockAdherence()    — aderência ao plano (dias planejados vs executados).
   · calcWeeklySummary()     — resumo semanal: volume, PRs, séries.
   · generateInsights()      — insights automáticos em linguagem natural.
   ════════════════════════════════════════════════════════════════════════════ */

/* Retorna {current, best} de dias consecutivos com ao menos 1 registro */
/* ════════════════════════════════════════════════════════════════════════════
   P-03 / P-04 — ÍNDICE DE HISTÓRICO POR EXERCÍCIO
   ────────────────────────────────────────────────────────────────────────────
   Problema: getExHistory(), getLastRegistered() e isPR() iteravam history[]
   inteiro a cada chamada — O(n × m) onde n = entradas e m = exercícios/entrada.
   Com 180 entradas × 10 exercícios = 1800 objetos percorridos por chamada.
   Renderizar 3 blocos abertos × 5 exercícios = 27.000 operações por render.

   Solução: manter um índice pré-computado { [exName]: Entry[] } com custo de
   construção único. Lookups passam a ser O(1).

   O índice é reconstruído após toda mutação de history:
     • saveLog()         — novo registro adicionado
     • importData()      — history inteiro substituído
     • confirmDanger()   — history zerado
   ════════════════════════════════════════════════════════════════════════════ */

/* P-02: cache de renderStats() — invalidado quando history muda.
   Chave: history.length + timestamp do registro mais recente.
   Enquanto o usuário navega na aba Stats sem treinar, o HTML é retornado
   do cache sem recomputar as 12+ iterações sobre history. */
let _statsCache = { key: null, html: '' };

/* BUG-08: cache do exMap de evolução em renderHistorico().
   Mesma estratégia de invalidação: chave = history.length + timestamp.
   Cada expand/collapse de um item no histórico hoje reconstrói esse mapa
   do zero (~1.800 iterações). Com o cache, reconstrução só ocorre quando
   history muda de fato. */
let _histCache = { key: null, exMap: null };

/* { [exName]: [ {date, w, r, t, weight} ] } — entries em ordem de history[] (mais recente primeiro) */
let _historyIndex = {};
let _historyIndexPrMap = {}; /* { [exName]: maxWeight } — para isPR() em O(1) */

function _buildHistoryIndex(){
  _historyIndex = {};
  _historyIndexPrMap = {};
  _statsCache = { key: null, html: '' }; /* P-02: invalida cache de stats junto com o índice */
  _histCache  = { key: null, exMap: null }; /* BUG-08: invalida cache de exMap */
  history.forEach(entry=>{
    const exList = Array.isArray(entry.exercises)
      ? entry.exercises
      : (entry.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(!_historyIndex[e.name]) _historyIndex[e.name] = [];
      _historyIndex[e.name].push({
        date:  entry.date,
        w:     e.weight||0,
        r:     e.reps||0,
        t:     e.time||0,
        weight:e.weight||0   /* alias para isPR compat */
      });
      /* mantém o máximo de peso para cada exercício */
      if((e.weight||0) > (_historyIndexPrMap[e.name]||0)){
        _historyIndexPrMap[e.name] = e.weight||0;
      }
    });
  });
}

/* Constrói o índice na inicialização (history já foi carregado de loadStore()) */
_buildHistoryIndex();

/* ── Item 3 · Fase 1: Top exercícios mais treinados ──────────────────────────
   Usa _historyIndex (já O(1)) para contar aparições de cada exercício.
   Retorna array de {name, count, lastDate} ordenado por count desc.
   Pertence à camada STATS — leitura pura, sem efeitos colaterais.
   ──────────────────────────────────────────────────────────────────────────── */
function getTopExercisesByCount(n){
  return Object.entries(_historyIndex)
    .map(([name, entries])=>({
      name,
      count: entries.length,
      lastDate: entries[0]?.date || '—'   /* _historyIndex é mais-recente-primeiro */
    }))
    .sort((a,b)=>b.count-a.count)
    .slice(0,n);
}
function calcStreak(){
  if(!history.length)return{current:0,best:0};
  /* Coleta datas únicas em ordem decrescente */
  const dates=[...new Set(history.map(h=>h.date))];
  /* Converte "DD/MM/YYYY" → timestamp normalizado p/ meia-noite local */
  function toMs(d){const[dd,mm,yy]=d.split('/');return new Date(yy,mm-1,dd).getTime();}
  const ms=dates.map(toMs).sort((a,b)=>b-a);
  const DAY=86400000;
  let cur=1,best=1,run=1;
  for(let i=1;i<ms.length;i++){
    /* BUG-06: usar Math.round em vez de === DAY.
       A comparação exata falha em timezones com DST (horário de verão):
       dias consecutivos podem diferir por 82800000ms (23h) ou 90000000ms (25h)
       na transição, quebrando o streak. Math.round absorve essa variação. */
    if(Math.round((ms[i-1]-ms[i])/DAY)===1){run++;if(run>best)best=run;}
    else run=1;
  }
  /* Streak atual: começa em 1 se hoje ou ontem tem registro, senão 0 */
  const now=Date.now();
  const firstGap=now-ms[0];
  cur=(firstGap<DAY*2)?run:0;
  /* best considera a sequência mais longa completa */
  if(cur>best)best=cur;
  return{current:cur,best};
}

/* Taxa de conclusão da semana atual (dom→sab) em % */
function calcWeekRate(){
  const now=new Date();
  const dow=now.getDay(); /* 0=dom */
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-dow);weekStart.setHours(0,0,0,0);
  const weekDates=[];
  for(let i=0;i<=dow;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    weekDates.push(d.toLocaleDateString('pt-BR'));
  }
  /* Dias da semana que têm blocos planejados */
  const plannedDays=weekDates.filter(d=>{
    const[dd,mm,yy]=d.split('/');
    const dayIdx=new Date(yy,mm-1,dd).getDay();
    const dk=DAYS[dayIdx];
    return blocks[dk]&&blocks[dk].length>0;
  });
  if(!plannedDays.length)return 0;
  const doneSet=new Set(history.map(h=>h.date));
  const doneDays=plannedDays.filter(d=>doneSet.has(d));
  return Math.round((doneDays.length/plannedDays.length)*100);
}

/* Volume total (kg) de uma semana relativa. weekOffset=0=esta semana, 1=anterior */
function calcWeeklyVolume(weekOffset){
  const now=new Date();
  const dow=now.getDay();
  const start=new Date(now);start.setDate(now.getDate()-dow-(weekOffset*7));start.setHours(0,0,0,0);
  const end=new Date(start);end.setDate(start.getDate()+7);
  return history.reduce((total,entry)=>{
    const[dd,mm,yy]=entry.date.split('/');
    const d=new Date(yy,mm-1,dd);
    if(d>=start&&d<end){
      const exList=Array.isArray(entry.exercises)?entry.exercises:(entry.entries||[]).flatMap(b=>b.exercises||[]);
      total+=exList.reduce((s,e)=>s+(e.sets*(e.weight||0)),0);
    }
    return total;
  },0);
}

/* ── Fase 2 · Item 5: helper de filtro por período ──────────────────────────
   Retorna o subconjunto de history[] dentro do período selecionado em statsPeriod.
   Centraliza a lógica de filtro para não duplicar em cada cálculo.
   'all' retorna history[] inteiro (sem cópia desnecessária — só referência).
   ─────────────────────────────────────────────────────────────────────────── */
function _filterByPeriod(entries, period){
  if(!period||period==='all') return entries;
  const days=period==='7d'?7:period==='30d'?30:90;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);cutoff.setHours(0,0,0,0);
  return entries.filter(e=>{
    const[dd,mm,yy]=e.date.split('/');
    return new Date(yy,mm-1,dd)>=cutoff;
  });
}

/* ── Fase 2 · Item 6: volume mensal ─────────────────────────────────────────
   Espelha calcWeeklyVolume(). monthOffset=0=este mês, 1=anterior, etc.
   Retorna volume total (kg) de um mês relativo ao mês atual.
   ─────────────────────────────────────────────────────────────────────────── */
function calcMonthlyVolume(monthOffset){
  const now=new Date();
  const y=now.getFullYear();
  const m=now.getMonth()-monthOffset;
  /* Normaliza: JS ajusta automaticamente quando m<0 (ano anterior) */
  const start=new Date(y,m,1);start.setHours(0,0,0,0);
  const end=new Date(y,m+1,1);end.setHours(0,0,0,0);
  return history.reduce((total,entry)=>{
    const[dd,mm2,yy]=entry.date.split('/');
    const d=new Date(yy,mm2-1,dd);
    if(d>=start&&d<end){
      const exList=Array.isArray(entry.exercises)?entry.exercises:(entry.entries||[]).flatMap(b=>b.exercises||[]);
      total+=exList.reduce((s,e)=>s+(e.sets*(e.weight||0)),0);
    }
    return total;
  },0);
}
/* Aceita entries opcional para filtro de período (Fase 2 · Item 5).
   Chamadas sem argumento continuam funcionando com history[] completo. */
function getSkippedExercises(entries){
  const src=entries||history;
  const map={};
  src.forEach(entry=>{
    const exList=Array.isArray(entry.exercises)?entry.exercises:(entry.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(!map[e.name])map[e.name]={name:e.name,count:0,total:0};
      map[e.name].total++;
      if(e.status==='skipped')map[e.name].count++;
    });
  });
  return Object.values(map).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
}

/* Heatmap SVG — últimas 12 semanas, retorna string HTML */
function renderHeatmap(){
  /* Grade: Segunda(0)→Domingo(6), 12 semanas para trás */
  const WEEKS=12;
  const now=new Date();now.setHours(0,0,0,0);
  const todayDow=now.getDay(); /* 0=dom */
  const daysFromMon=todayDow===0?6:todayDow-1;
  /* gridStart = segunda-feira de 12 semanas atrás */
  const gridStart=new Date(now);gridStart.setDate(now.getDate()-daysFromMon-(WEEKS-1)*7);
  const doneSet=new Set(history.map(h=>h.date));

  /* Conta treinos por semana para intensidade */
  const weekCount=[];
  for(let w=0;w<WEEKS;w++){
    let c=0;
    for(let d=0;d<7;d++){
      const day=new Date(gridStart);day.setDate(gridStart.getDate()+(w*7+d));
      if(doneSet.has(day.toLocaleDateString('pt-BR')))c++;
    }
    weekCount.push(c);
  }
  const maxCount=Math.max(...weekCount,1);

  const LABEL_W=16,CELL=13,GAP=3,STEP=CELL+GAP;
  const DAYS_LABEL=['S','T','Q','Q','S','S','D']; /* seg→dom */
  const gridW=WEEKS*STEP-GAP;
  const W=LABEL_W+gridW+2,H=20+7*STEP+14;

  /* Labels de meses no topo */
  let monthLabels='',lastMonth=-1;
  const MS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  for(let w=0;w<WEEKS;w++){
    const day=new Date(gridStart);day.setDate(gridStart.getDate()+(w*7));
    const m=day.getMonth();
    if(m!==lastMonth){
      monthLabels+=`<text x="${LABEL_W+w*STEP}" y="12" font-size="9" fill="var(--t2)">${MS[m]}</text>`;
      lastMonth=m;
    }
  }

  /* Células */
  let cells='';
  for(let w=0;w<WEEKS;w++){
    for(let d=0;d<7;d++){
      const day=new Date(gridStart);day.setDate(gridStart.getDate()+(w*7+d));
      if(day>now)continue;
      const dateStr=day.toLocaleDateString('pt-BR');
      const done=doneSet.has(dateStr);
      const isToday=day.getTime()===now.getTime();
      const x=LABEL_W+w*STEP, y=20+d*STEP;
      const intensity=done?(0.35+0.65*(weekCount[w]/maxCount)):1;
      const fill=done?'var(--ac)':'var(--s3)';
      const opacity=done?intensity:0.6;
      const stroke=isToday?'var(--ac)':'none';
      const strokeW=isToday&&!done?1.5:0;
      cells+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2.5" fill="${fill}" opacity="${opacity}" stroke="${stroke}" stroke-width="${strokeW}"/>`;
    }
  }

  /* Labels dos dias à ESQUERDA — todos os 7 dias */
  let dayLabels='';
  DAYS_LABEL.forEach((label,d)=>{
    dayLabels+=`<text x="${LABEL_W-4}" y="${20+d*STEP+CELL/2+1}" font-size="9" fill="var(--t2)" text-anchor="end" dominant-baseline="middle">${label}</text>`;
  });

  /* Legenda inferior */
  const totalDays=history.length;
  const legendY=20+7*STEP+10;
  const legend=`<text x="${LABEL_W}" y="${legendY}" font-size="9" fill="var(--t2)">${totalDays} dia${totalDays!==1?'s':''} treinado${totalDays!==1?'s':''}</text>`;

  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">${monthLabels}${dayLabels}${cells}${legend}</svg>`;
}
/* Retorna [{name, vals:[{date,w,r,t}]}] dos exercícios com mais histórico de carga */
function getTopExercisesEvolution(limit){
  const map={};
  history.forEach(entry=>{
    const exList=Array.isArray(entry.exercises)?entry.exercises:(entry.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(!e.weight&&!e.reps&&!e.time)return;
      if(!map[e.name])map[e.name]=[];
      map[e.name].push({date:entry.date,w:e.weight||0,r:e.reps||0,t:e.time||0});
    });
  });
  /* Só exercícios com peso registrado e ao menos 3 entradas */
  return Object.entries(map)
    .filter(([,v])=>v.length>=3&&v.some(x=>x.w>0))
    .sort((a,b)=>b[1].length-a[1].length)
    .slice(0,limit)
    .map(([name,vals])=>({name,vals:[...vals].reverse()})); /* cronológico */
}

/* Análise por dia da semana: retorna [{dow, label, total, done, rate}] */
function calcDayOfWeekStats(){
  const map={};
  DAYS.forEach((dk,i)=>{
    map[dk]={dow:i,label:dk,planned:0,done:0};
  });
  /* Conta planejados: cada bloco em cada dia = 1 planejado por semana no período */
  const doneByDate={};
  history.forEach(entry=>{
    if(!doneByDate[entry.date])doneByDate[entry.date]=new Set();
    doneByDate[entry.date].add(entry.dayKey);
  });
  /* Conta registros por dayKey */
  history.forEach(entry=>{
    if(map[entry.dayKey])map[entry.dayKey].done++;
  });
  /* Planejado = semanas no histórico × blocos por dia */
  const allDates=Object.keys(doneByDate);
  if(!allDates.length)return[];
  const parseDate=d=>{const[dd,mm,yy]=d.split('/');return new Date(yy,mm-1,dd);};
  const sorted=allDates.map(parseDate).sort((a,b)=>a-b);
  const firstDate=sorted[0],lastDate=sorted[sorted.length-1];
  const totalWeeks=Math.max(1,Math.ceil((lastDate-firstDate)/86400000/7)+1);
  DAYS.forEach(dk=>{
    const blockCount=(blocks[dk]||[]).length;
    map[dk].planned=totalWeeks*blockCount;
  });
  return Object.values(map)
    .filter(d=>d.planned>0||d.done>0)
    .map(d=>({...d,rate:d.planned>0?Math.round((d.done/d.planned)*100):0}));
}

/* PR por exercício: retorna [{name, weight, date}] dos melhores pesos */
/* Aceita entries opcional para filtro de período (Fase 2 · Item 5). */
function getAllPRs(entries){
  const src=entries||history;
  const map={};
  src.forEach(entry=>{
    const exList=Array.isArray(entry.exercises)?entry.exercises:(entry.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(!e.weight||e.weight<=0)return;
      if(!map[e.name]||e.weight>map[e.name].weight)
        map[e.name]={name:e.name,weight:e.weight,date:entry.date};
    });
  });
  return Object.values(map).sort((a,b)=>b.weight-a.weight);
}

/* Renderiza mini sparkline SVG de evolução de carga para um exercício */
function renderSparkline(vals,useWeight){
  const points=vals.filter(v=>useWeight?v.w>0:v.r>0||v.t>0).slice(-12);
  if(points.length<2)return'';
  const series=points.map(v=>useWeight?v.w:(v.r||v.t));
  const mn=Math.min(...series),mx=Math.max(...series);
  const range=mx-mn||1;
  const W=80,H=28,PAD=2;
  const xs=series.map((_,i)=>PAD+i*(W-PAD*2)/(series.length-1));
  const ys=series.map(v=>H-PAD-(v-mn)/range*(H-PAD*2));
  const path='M'+xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join('L');
  const last=series[series.length-1];
  const prev=series[series.length-2];
  const color=last>prev?'var(--green)':last<prev?'var(--red)':'var(--t2)';
  return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${xs[xs.length-1].toFixed(1)}" cy="${ys[ys.length-1].toFixed(1)}" r="2" fill="${color}"/>
  </svg>`;
}

/* ── isPR_before(): verifica PR antes de salvar (sem índice, por data) ── */
function isPR(exName, newWeight){
  if(!newWeight||newWeight<=0)return false;
  /* P-04: antes iterava history[] inteiro (O(n×m)). Agora O(1) via _historyIndexPrMap. */
  const best = _historyIndexPrMap[exName] || 0;
  return newWeight > best;
}

/* Helper: verifica se um peso é PR considerando apenas registros ANTES de uma data */
function isPR_before(exName,weight,beforeDate){
  const prev=history
    .filter(h=>{
      const[dd,mm,yy]=h.date.split('/');
      return new Date(yy,mm-1,dd)<beforeDate;
    })
    .flatMap(h=>Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]))
    .filter(e=>e.name===exName&&e.weight>0);
  if(!prev.length)return false;
  return weight>Math.max(...prev.map(e=>e.weight));
}
/* Retorna o último peso/rep/tempo registrado de um exercício (QUICK WIN #2) */
function getLastRegistered(exName){
  /* P-03: antes percorria history[] inteiro. Agora O(1) via _historyIndex. */
  const entries = _historyIndex[exName];
  if(!entries||!entries.length) return null;
  /* _historyIndex preserva a ordem de history[] (mais recente primeiro) */
  return entries[0];
}

function trend(curr,prev){
  if(prev===0||curr===0)return{cls:'eq',sym:'→',txt:'—'};
  const d=curr-prev,p=Math.round(Math.abs(d/prev)*100);
  if(d>0)return{cls:'up',sym:'↑',txt:'+'+p+'%'};
  if(d<0)return{cls:'dn',sym:'↓',txt:'-'+p+'%'};
  return{cls:'eq',sym:'→',txt:'='};
}

function getExHistory(exName){
  /* P-03: antes percorria history[] inteiro (O(n×m)). Agora O(1) via _historyIndex.
     Filtra entradas sem valor relevante (w=0 e r=0) para manter paridade com o
     comportamento anterior que só incluía e.weight>0 || e.reps>0. */
  const entries = _historyIndex[exName];
  if(!entries) return [];
  return entries.filter(e=>e.w>0||e.r>0);
}

/* Frequência por grupo muscular — retorna [{group, sessions, lastDate}]
   Cada registro de bloco contribui com os grupos do seu blockType.
   'full_body' é expandido para todos os grupos conhecidos. */
function calcMuscleFrequency(){
  const ALL_GROUPS=['peito','costas','ombro','bíceps','tríceps','perna','glúteo',
                    'posterior','core','lombar','pescoço','antebraço','cardio'];
  const map={};
  ALL_GROUPS.forEach(g=>{map[g]={group:g,sessions:0,lastDate:null};});

  history.forEach(entry=>{
    const groups=MUSCLE_GROUPS[entry.blockType]||[];
    const expanded=groups.includes('full_body')?ALL_GROUPS:groups;
    expanded.forEach(g=>{
      if(!map[g])return;
      map[g].sessions++;
      if(!map[g].lastDate||entry.date>map[g].lastDate)map[g].lastDate=entry.date;
    });
  });

  return Object.values(map)
    .filter(g=>g.sessions>0)
    .sort((a,b)=>b.sessions-a.sessions);
}

/* Comparação plano vs realidade por bloco —
   retorna [{dk, label, type, planned, done, rate}] ordenado por rate asc */
function calcBlockAdherence(){
  /* Conta semanas no período histórico */
  const dates=history.map(h=>{
    const[dd,mm,yy]=h.date.split('/');return new Date(yy,mm-1,dd);
  });
  if(!dates.length)return[];
  const minDate=new Date(Math.min(...dates));
  const maxDate=new Date(Math.max(...dates));
  const totalWeeks=Math.max(1,Math.ceil((maxDate-minDate)/86400000/7)+1);

  /* Conta registros por dk+label */
  const doneMap={};
  history.forEach(h=>{
    const k=`${h.dayKey}||${h.blockLabel}`;
    doneMap[k]=(doneMap[k]||0)+1;
  });

  const result=[];
  DAYS.forEach(dk=>{
    (blocks[dk]||[]).forEach(b=>{
      const k=`${dk}||${b.label}`;
      const done=doneMap[k]||0;
      const planned=totalWeeks;
      const rate=planned>0?Math.round((done/planned)*100):0;
      result.push({dk,label:b.label,type:b.type,planned,done,rate});
    });
  });

  return result.sort((a,b)=>a.rate-b.rate);
}

/* Resumo semanal — dados da semana que acabou de fechar (offset=1) ou atual (0) */
function calcWeeklySummary(weekOffset){
  const now=new Date();
  const dow=now.getDay();
  const start=new Date(now);
  start.setDate(now.getDate()-dow-(weekOffset*7));
  start.setHours(0,0,0,0);
  const end=new Date(start);end.setDate(start.getDate()+7);

  const entries=history.filter(h=>{
    const[dd,mm,yy]=h.date.split('/');
    const d=new Date(yy,mm-1,dd);
    return d>=start&&d<end;
  });

  if(!entries.length)return null;

  const vol=entries.reduce((s,h)=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    return s+exList.reduce((a,e)=>a+(e.sets*(e.weight||0)),0);
  },0);

  const days=new Set(entries.map(h=>h.date)).size;

  /* Exercícios únicos treinados */
  const exSet=new Set();
  entries.forEach(h=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>exSet.add(e.name));
  });

  /* PRs da semana */
  const weekPRs=[];
  entries.forEach(h=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(e.weight>0&&isPR_before(e.name,e.weight,start))
        weekPRs.push({name:e.name,weight:e.weight});
    });
  });

  /* Blocos mais pulados na semana */
  const skipMap={};
  entries.forEach(h=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(e.status==='skipped'){skipMap[e.name]=(skipMap[e.name]||0)+1;}
    });
  });
  const topSkipped=Object.entries(skipMap).sort((a,b)=>b[1]-a[1]).slice(0,2);

  /* Label da semana */
  const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const label=`${fmt(start)} – ${fmt(new Date(end.getTime()-86400000))}`;

  return{label,days,vol,exercises:exSet.size,prs:weekPRs,topSkipped,blocks:entries.length};
}


/* ══════════════════════════════════════════════════════════
   FASE 4 — INSIGHTS AUTOMÁTICOS
   Analisa o histórico e retorna array de {type, icon, text, sub}
   type: 'positive' | 'warning' | 'neutral'
   ══════════════════════════════════════════════════════════ */
function generateInsights(){
  const insights=[];
  if(history.length<3)return insights; /* mínimo para análise */

  const now=new Date();

  /* Helper: converte data pt-BR para Date */
  const toDate=s=>{const[dd,mm,yy]=s.split('/');return new Date(yy,mm-1,dd);};

  /* Helper: dias desde a data mais recente de um filtro */
  const daysSince=entries=>{
    if(!entries.length)return null;
    const last=new Date(Math.max(...entries.map(e=>toDate(e.date))));
    return Math.floor((now-last)/86400000);
  };

  /* ── 1. Streak em alta ── */
  const streak=calcStreak();
  if(streak.current>=7){
    insights.push({type:'positive',icon:'🔥',
      text:`${streak.current} dias consecutivos`,
      sub:'Você está numa sequência sólida. Não quebre agora.'});
  } else if(streak.current===0&&streak.best>=5){
    insights.push({type:'warning',icon:'⚠️',
      text:'Sequência zerada',
      sub:`Seu recorde é ${streak.best} dias. Hora de reconstruir.`});
  }

  /* ── 2. Volume caindo por 2 semanas seguidas ── */
  const v0=calcWeeklyVolume(0),v1=calcWeeklyVolume(1),v2=calcWeeklyVolume(2);
  if(v2>0&&v1>0&&v0>0&&v1<v2&&v0<v1){
    const queda=Math.round(((v0-v2)/v2)*100);
    insights.push({type:'warning',icon:'📉',
      text:`Volume caindo há 2 semanas`,
      sub:`${queda}% abaixo de 2 semanas atrás. Vale revisar intensidade.`});
  } else if(v1>0&&v0>v1*1.2){
    insights.push({type:'positive',icon:'📈',
      text:`Volume +${Math.round(((v0-v1)/v1)*100)}% vs semana passada`,
      sub:'Semana mais intensa que a anterior.'});
  }

  /* ── 3. Blocos nunca registrados (existem no plano mas zero no histórico) ── */
  const doneBlocks=new Set(history.map(h=>`${h.dayKey}||${h.blockLabel}`));
  const neverDone=[];
  DAYS.forEach(dk=>{
    (blocks[dk]||[]).forEach(b=>{
      if(!doneBlocks.has(`${dk}||${b.label}`))neverDone.push(b.label);
    });
  });
  if(neverDone.length){
    insights.push({type:'warning',icon:'👻',
      text:`${neverDone.length} bloco${neverDone.length>1?'s':''} nunca registrado${neverDone.length>1?'s':''}`,
      sub:neverDone.slice(0,2).join(', ')+(neverDone.length>2?` +${neverDone.length-2}`:'')});
  }

  /* ── 4. Exercício mais pulado com taxa alta ── */
  const skipped=getSkippedExercises();
  if(skipped.length){
    const worst=skipped[0];
    const pct=worst.total>0?Math.round((worst.count/worst.total)*100):0;
    if(pct>=50){
      insights.push({type:'warning',icon:'🚫',
        text:`"${worst.name}" pulado ${pct}% das vezes`,
        sub:`${worst.count} de ${worst.total} aparições ignoradas.`});
    }
  }

  /* ── 5. Grupo muscular negligenciado (não treinado há 2+ semanas) ── */
  const muscleFreq=calcMuscleFrequency();
  if(muscleFreq.length){
    const neglected=muscleFreq.filter(g=>{
      if(!g.lastDate)return false;
      const days=Math.floor((now-toDate(g.lastDate))/86400000);
      return days>=14;
    });
    if(neglected.length){
      const MLABELS={peito:'Peito',costas:'Costas',ombro:'Ombro',bíceps:'Bíceps',
        tríceps:'Tríceps',perna:'Perna',glúteo:'Glúteo',posterior:'Posterior',
        core:'Core',lombar:'Lombar',pescoço:'Pescoço',antebraço:'Antebraço',cardio:'Cardio'};
      const g=neglected[0];
      const days=Math.floor((now-toDate(g.lastDate))/86400000);
      insights.push({type:'warning',icon:'💤',
        text:`${MLABELS[g.group]||g.group} parado há ${days} dias`,
        sub:`Último registro: ${g.lastDate}.`});
    }
  }

  /* ── 6. PR recente (últimos 7 dias) ── */
  const recentPRs=[];
  const cutoff=new Date(now);cutoff.setDate(now.getDate()-7);
  history.filter(h=>toDate(h.date)>=cutoff).forEach(h=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(e.weight>0&&isPR(e.name,e.weight))recentPRs.push(e.name);
    });
  });
  if(recentPRs.length){
    insights.push({type:'positive',icon:'🏆',
      text:`PR${recentPRs.length>1?'s':''} esta semana`,
      sub:recentPRs.slice(0,2).join(', ')+(recentPRs.length>2?` +${recentPRs.length-2}`:'')});
  }

  /* ── 7. Dia da semana com pior consistência ── */
  const dowStats=calcDayOfWeekStats();
  if(dowStats.length){
    const worst=dowStats.reduce((a,b)=>b.rate<a.rate?b:a);
    if(worst.rate<40&&worst.planned>2){
      insights.push({type:'neutral',icon:'📅',
        text:`${worst.label} é seu dia mais fraco`,
        sub:`${worst.rate}% de conclusão — ${worst.done} de ${worst.planned} planejados.`});
    }
  }

  /* ── 8. Consistência alta essa semana ── */
  const weekRate=calcWeekRate();
  if(weekRate===100){
    insights.push({type:'positive',icon:'✅',
      text:'Semana 100% concluída',
      sub:'Todos os blocos desta semana foram registrados.'});
  }

  return insights;
}

/* ════════════════════════════════════════════════════════════════════════════
   § 6 · APPEARANCE — Tema, fontes e variáveis de CSS
   ────────────────────────────────────────────────────────────────────────────
   Tudo que toca CSS custom properties via JS. Chamada no boot e toda vez que
   o usuário altera tema, fonte, border-radius, compact mode ou velocidade de
   animação. Os setters (setTheme, setAccentColor, etc.) vivem em § 9 RENDER ENGINE
   pois são chamados diretamente pelos inputs do renderConfigAparencia().

   CONTEÚDO:
   · applyAppearance() — aplica o objeto appearance completo nos CSS vars.
                          Chamada no boot e após toda alteração de aparência.
   ════════════════════════════════════════════════════════════════════════════ */
function applyAppearance(){
  const a=appearance;
  const root=document.documentElement;
  const t=THEMES[a.theme]||THEMES.dark;
  root.style.setProperty('--bg',t.bg);
  root.style.setProperty('--s1',t.s1);
  root.style.setProperty('--s2',t.s2);
  root.style.setProperty('--s3',t.s3);
  root.style.setProperty('--s4',t.s4);
  root.style.setProperty('--tc',t.tc);
  root.style.setProperty('--t2',t.t2);
  root.style.setProperty('--t3',t.t3);
  root.style.setProperty('--ac',a.accentColor);
  /* Bordas e divisores adaptados ao tema claro/escuro */
  const isLight=t.bg>'#888';
  root.style.setProperty('--b1',isLight?'rgba(0,0,0,0.09)':'rgba(255,255,255,0.06)');
  root.style.setProperty('--b2',isLight?'rgba(0,0,0,0.18)':'rgba(255,255,255,0.10)');
  root.style.setProperty('--t4',isLight?'rgba(0,0,0,0.08)':'#1e1e1e');
  /* t3 já vem do tema, mas garantimos que não some em temas claros */
  if(t.t3)root.style.setProperty('--t3',t.t3);
  /* Marca o app com atributo de tema para overrides CSS (QUICK WIN #5) */
  const appEl=document.getElementById('app');
  if(isLight){appEl.setAttribute('data-theme-light','');} else {appEl.removeAttribute('data-theme-light');}
  const f=FONT_OPTIONS.find(x=>x.id===a.font)||FONT_OPTIONS[0];
  root.style.setProperty('--font-family',f.val);
  document.getElementById('app').style.fontFamily=f.val;
  root.style.setProperty('--radius-global',a.borderRadius+'px');
  root.style.setProperty('--r-lg',a.borderRadius+'px');
  const ct=document.getElementById('content');
  /* R7: guard contra execução antes do DOM estar pronto (ex: script movido para <head>) */
  if(!ct) return;
  const p=a.compactMode?'12px':'16px';
  ct.style.paddingTop=p;
  ct.style.paddingLeft=p;
  ct.style.paddingRight=p;
  ct.style.paddingBottom='96px';
  /* Ajusta o top do sticky journal-hdr para compensar o padding correto */
  root.style.setProperty('--journal-hdr-top', a.compactMode?'-12px':'-16px');
  const speeds={fast:'0.15s',normal:'0.22s',slow:'0.38s'};
  /* R3: --anim-speed removido — variável sem referência no CSS. Apenas --dur-base é usado. */
  root.style.setProperty('--dur-base',speeds[a.animSpeed||'normal']||'0.22s');
}

/* ════════════════════════════════════════════════════════════════════════════
   § 7 · UI HELPERS — Utilitários de interface sem responsabilidade de render
   ────────────────────────────────────────────────────────────────────────────
   Funções de suporte à UI: feedback visual, parsing de URLs, estado de scroll,
   captura de inputs e controle de peso. Sem lógica de negócio, sem acesso a
   blocks/history/goals. Podem ser chamadas de qualquer ponto do app.

   CONTEÚDO:
   · toast()             — notificação temporária (variantes: padrão, 'pr-toast').
   · ytId()              — extrai ID de vídeo de URLs YouTube.
   · isImg()             — detecta se URL é imagem (extensão ou domínio conhecido).
   · openLink()          — abre URL em nova aba.
   · looksLikeMedia()    — alias: retorna true se URL é imagem ou YouTube.
   · updExBase()         — atualiza campo de exercício em blocks (via guia Semana).
   · addMedia()/delMedia() — adiciona/remove mídia de um exercício.
   · renderMediaSection()  — HTML da seção de mídia dentro de um exercício.
   · blockIcon()         — retorna HTML do ícone de um bloco (emoji ou tipo).
   · renderExRow()       — HTML completo de uma linha de exercício (expandível).
   · openLightbox()      — abre lightbox de imagem em fullscreen.
   · persistOpenBlk()    — persiste estado de blocos abertos no sessionStorage (decl. em §3).
   · saveScroll()/restoreScroll() — estado de scroll por aba.
   · captureInputs()/getInputVal() — preserva valores de inputs entre re-renders.
   · stepWeight()        — stepper de kg em ±2.5 sem abrir teclado.
   ════════════════════════════════════════════════════════════════════════════ */


/* ── Estado de scroll por aba — salvo antes de cada re-render ── */
const scrollPos={};
function saveScroll(){
  const ct=document.getElementById('content');
  if(ct)scrollPos[configOpen?'config':page]=ct.scrollTop;
}
function restoreScroll(){
  const ct=document.getElementById('content');
  if(!ct)return;
  const k=configOpen?'config':page;
  if(scrollPos[k]!=null)ct.scrollTop=scrollPos[k];
}

/* ── Cache de inputs em memória — evita perda de valores ao re-render ── */
const inputState={};
function captureInputs(){
  document.querySelectorAll('.inp-g input').forEach(el=>{
    if(el.id)inputState[el.id]=el.value;
  });
}
function getInputVal(id,fallback){
  return inputState[id]!=null?parseFloat(inputState[id])||fallback:fallback;
}

/* ── Stepper de kg — ajusta ±2.5 sem abrir teclado virtual ── */
function stepWeight(id,delta){
  const el=document.getElementById(id);
  if(!el)return;
  const cur=parseFloat(el.value)||0;
  const nv=Math.max(0,Math.round((cur+delta)*4)/4);
  el.value=nv;
  el.dispatchEvent(new Event('change'));
  /* feedback visual imediato */
  el.style.transition='color 0.1s';
  el.style.color=delta>0?'var(--green)':'var(--red)';
  setTimeout(()=>{el.style.color='';},300);
}
function toast(m,variant){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.className='toast'; /* reset classes */
  if(variant)t.classList.add(variant);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show','pr-toast'),2400);
}
function ytId(url){const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function isImg(url){return/\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i.test(url)||url.startsWith('data:image')||/imgur\.com|i\.ibb\.co|imgbb\.com|postimg\.cc|pbs\.twimg\.com|media\.discordapp|cdn\.discordapp|gyazo\.com|prnt\.sc/.test(url)}
function openLink(u){window.open(u,'_blank')}
function looksLikeMedia(url){return isImg(url)||!!ytId(url)} /* compat alias */

function updExBase(dk,bi,en,field,val){
  const ex=blocks[dk][bi].exercises.find(e=>e.name===en);
  if(ex){ex[field]=parseFloat(val)||0;saveStore();if(dk===todayKey)resetTodaySession();toast('Base atualizada');}
}

function addMedia(dk,bi,ei){
  const inp=document.getElementById('mi-'+dk+bi+ei);
  if(!inp)return;const url=inp.value.trim();if(!url)return;
  if(!blocks[dk][bi].exercises[ei].media)blocks[dk][bi].exercises[ei].media=[];
  blocks[dk][bi].exercises[ei].media.push(url);saveStore();inp.value='';if(dk===todayKey)resetTodaySession();render();
}
function delMedia(dk,bi,ei,mi){
  blocks[dk][bi].exercises[ei].media.splice(mi,1);saveStore();if(dk===todayKey)resetTodaySession();render();
}

function renderMediaSection(e,dk,bi,ei){
  const mid='mi-'+dk+bi+ei;
  let h=`<div class="ex-media"><div class="media-title">Mídia</div>`;
  (e.media||[]).forEach((url,mi)=>{
    const ytid=ytId(url);const imgLike=isImg(url);
    const typeLabel=ytid?'YT':imgLike?'IMG':'URL';
    h+=`<div class="media-item"><span class="media-type">${typeLabel}</span>`;
    h+=`<span class="media-url" onclick="openLink('${url}')">${url.length>40?url.slice(0,37)+'...':url}</span>`;
    h+=`<span class="media-del" onclick="delMedia('${dk}',${bi},${ei},${mi})">✕</span></div>`;
    if(ytid){
      h+=`<iframe class="media-yt" src="https://www.youtube.com/embed/${ytid}" allowfullscreen loading="lazy"></iframe>`;
    } else {
      h+=`<div class="media-img-wrap"><img class="media-img" src="${url}" onclick="openLightbox('${url}')" onerror="this.parentElement.style.display='none'" loading="lazy"><div class="img-expand-btn" onclick="openLightbox('${url}')">⤢</div></div>`;
    }
  });
  h+=`<div class="media-inp"><input type="text" id="${mid}" placeholder="URL imagem ou YouTube..."><button class="media-add" onclick="addMedia('${dk}',${bi},${ei})">+ Add</button></div></div>`;
  return h;
}

/* ── Ícone de bloco ── */

     Ele também é enviado ao histórico via saveLog() (campo 'status' no snapshot).

    <button id="exs-done-${safeName}"
      class="ex-status-btn done-btn${exStatus==='done'?' active':''}"

    >${checkSvg}</button>

    /* MUDANÇA 3 — Guia Hoje: lê direto de e (que vem de todaySession), sem fallback em blocks.
       Guia Semana: lê de e (que vem de blocks), comportamento inalterado. */
    const lastReg=!fromSemana?getLastRegistered(e.name):null;

    const dispTime  =e.time||0;
    const dispWeight=e.weight||0;
    /* Label contextual: se há histórico, mostra comparação de carga */
    let contextHint='';
    if(lastReg&&!fromSemana){
      const prevW=lastReg.weight||0;
      const prevR=lastReg.reps||0;
      const prevT=lastReg.time||0;
      const valStr=prevW>0?`${prevW}kg`:(prevT>0?`${prevT}s`:`${prevR}rep`);
      contextHint=`<div style="padding:5px 16px 8px;font-size:9px;color:var(--t2);letter-spacing:0.4px;display:flex;align-items:center;gap:5px;border-top:0.5px solid var(--t4)"><span style="opacity:0.5;font-size:8px">↑</span>última: ${valStr}</div>`;
    }
    /* UX-03: oninput em vez de onchange nos inputs de exercício.
       onchange só dispara ao tirar foco. Em touch, o usuário pode digitar
       e fechar o bloco sem tirar foco (tocando no header), perdendo o dado
       silenciosamente. oninput dispara a cada caractere, garantindo que
       updExToday() sempre persiste o valor atual. */
    const wId=`w${pfx}-${dk+bi+e.name}`;
    exD+=`<div class="ex-inputs-row">
      <div class="inp-g"><input id="s${pfx}-${dk+bi+e.name}" type="number" value="${dispSets}" min="1" oninput="${updFn}('${dk}',${bi},'${e.name}','sets',this.value)"><div class="inp-lbl">séries</div></div>
      ${hasTime
        ?`<div class="inp-g"><input id="t${pfx}-${dk+bi+e.name}" type="number" value="${dispTime}" min="0" oninput="${updFn}('${dk}',${bi},'${e.name}','time',this.value)"><div class="inp-lbl">seg</div></div>`
        :`<div class="inp-g"><input id="r${pfx}-${dk+bi+e.name}" type="number" value="${dispReps}" min="0" oninput="${updFn}('${dk}',${bi},'${e.name}','reps',this.value)"><div class="inp-lbl">reps</div></div>`}
      <div class="inp-g kg-g">
        <div class="kg-stepper">
          <button class="kg-step" onclick="stepWeight('${wId}',-2.5)" ontouchstart="event.preventDefault();stepWeight('${wId}',-2.5)">−</button>
          <input id="${wId}" type="number" value="${dispWeight}" min="0" step="2.5" oninput="${updFn}('${dk}',${bi},'${e.name}','weight',this.value)">
          <button class="kg-step" onclick="stepWeight('${wId}',2.5)" ontouchstart="event.preventDefault();stepWeight('${wId}',2.5)">+</button>
        </div>
        <div class="inp-lbl">kg</div>
      </div>
    </div>${contextHint}`;
    if(fromSemana){
      exD+=`<div style="padding:8px 16px;font-size:10px;color:var(--t2);border-top:0.5px solid var(--t4);letter-spacing:0.3px">Alterações salvas como padrão</div>`;
    }
    exD+=renderMediaSection(e,dk,bi,ei);
  }
  const toggleFn=fromSemana?`toggleExSem('${xkey}','${dk}')`:`toggleEx('${xkey}')`;
  const chevSvg=`<svg viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return`<div class="ex-row${statusClass}">
    <div class="ex-top" onclick="${toggleFn}">
      <div class="ex-name">${e.name}</div>
      <div class="ex-meta">
        ${trndHtml}
        <span class="ex-tag">${e.sets}×${hasTime?(e.time+'s'):(e.reps+' reps')}</span>
        ${e.weight?`<span class="ex-tag">${e.weight}kg</span>`:''}
        ${statusBtns}
        <div class="ex-expand-btn${isOpen?' open-btn':''}">${chevSvg}</div>
      </div>
    </div>
    ${isOpen?`<div class="ex-detail">${exD}</div>`:''}
  </div>`;
}

/* ── renderBlockCard(): HTML do card de um bloco (colapsado/expandido) ── */
function renderBlockCard(b,dk,bi,prefix){
  const key=(prefix||dk)+bi;
  const isOpen=openBlk[key];
  const today=new Date().toLocaleDateString('pt-BR');
  const hasDone=history.some(h=>h.dayKey===dk&&h.date===today&&h.blockLabel===b.label);
  const colorAttr=b.accentColor?` data-color="${b.accentColor}"`:'';
  const fromSemanaCtx = (prefix === 'sem');
  const addExFn=fromSemanaCtx
    ?`openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:true});setTimeout(()=>reopenDay('${dk}'),10)`
    :`openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:false})`;

  let body='';
  if(isOpen){
    b.exercises.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,ei,prefix==='sem');});
    /* Exercícios extras adicionados só para a sessão de hoje */
    if(prefix !== 'sem'){
      const extraEx=sessionExtraExercises[dk+'-'+bi]||[];
      extraEx.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,b.exercises.length+ei,false);});
    }
    body+=`<button class="add-b" onclick="${addExFn}">
      <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
      exercício
    </button>`;
    /* Sumário inline quando bloco já foi registrado hoje (FASE 2) */
    if(hasDone){
      const lastEntry=history.find(h=>h.dayKey===dk&&h.date===new Date().toLocaleDateString('pt-BR')&&h.blockLabel===b.label);
      if(lastEntry){
        const vol=lastEntry.exercises.reduce((a,e)=>a+(e.sets*(e.weight||0)),0);
        const exCount=lastEntry.exercises.length;
        const volStr=vol>0?` · ${vol}kg`:'';
        body+=`<div class="session-summary">${exCount} ex${volStr}</div>`;
      }
    }
    body+=`<button class="sreg btn-ripple${hasDone?' done':''}" onclick="saveLog('${dk}',${bi})">
      ${hasDone?'✓ Registrado — atualizar':'Registrar bloco'}
    </button>`;
    /* Botão Journal — sempre presente quando bloco está aberto */
    const hasJournal=journalHasEntry(dk,bi,new Date().toLocaleDateString('pt-BR'));
    body+=`<button class="journal-btn${hasJournal?' has-entry':''}" onclick="openJournal('${dk}',${bi})">
      <svg viewBox="0 0 16 16"><path d="M3 13V4.5L7 2l4 2.5V13" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 2v11" stroke-width="1.3"/><path d="M3 8h4M11 8h2" stroke-width="1.2" stroke-linecap="round"/></svg>
      ${hasJournal?'Ver journal de hoje':'Escrever no journal'}
    </button>`;
    /* Botão "Promover para Semana" — só aparece em blocos criados apenas para hoje */
    if(b._sessionOnly){
      body+=`<button class="add-b" style="border-style:solid;color:var(--blue);border-color:rgba(96,165,250,0.25)" onclick="promoteBlockToWeek(${bi})">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V1M2 4l4-4 4 4"/></svg>
        Salvar na Semana também
      </button>`;
    }
  }

  const chevSvg=`<svg viewBox="0 0 14 14"><path d="M3 5L7 9L11 5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  /* Subtítulo contextual: quando done mostra volume do dia */
  let subtitle=`${b.exercises.length} exercício${b.exercises.length!==1?'s':''}`;
  if(hasDone){
    const lastEntry=history.find(h=>h.dayKey===dk&&h.date===new Date().toLocaleDateString('pt-BR')&&h.blockLabel===b.label);
    if(lastEntry){
      const vol=lastEntry.exercises.reduce((a,e)=>a+(e.sets*(e.weight||0)),0);
      subtitle=vol>0?`${vol}kg registrado`:'registrado';
    }
  }

  return`<div class="bc${isOpen?' open':''}${hasDone?' done-block':''}${colorAttr}">
    <div class="bh" onclick="toggleBlk('${key}')">
      <div class="bl-icon">${blockIcon(b)}</div>
      <div class="bh-info">
        <div class="bn">${b.label}</div>
        <div class="bs">${subtitle}</div>
      </div>
      <div class="bh-right">
        ${hasDone?'<div class="done-dot"></div>':''}
        <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
      </div>
    </div>
    ${isOpen?`<div class="bbody">${body}</div>`:''}
  </div>`;
}

/* ── Helpers de toggle — abrir/fechar blocos, exercícios, histórico ── */
function toggleEx(k){openEx[k]=!openEx[k];render()}
function toggleBlk(k){
  openBlk[k]=!openBlk[k];
  persistOpenBlk();
  /* Grava hora de abertura do bloco para calcular duration em saveLog().
     Só grava na abertura (isOpen false → true) e se ainda não há start gravado. */
  if(openBlk[k]){
    /* k = dk+bi (ex: "SEG0"). Extrai partes para chave do sessionStorage */
    const startKey=`bloc_start_${k}`;
    if(!sessionStorage.getItem(startKey))sessionStorage.setItem(startKey,new Date().toISOString());
  }
  render();
}
function toggleHist(k){openHist[k]=!openHist[k];render()}
function toggleExSem(k,dk){openEx[k]=!openEx[k];if(_lastDayDetail)openDayDetail(_lastDayDetail)}
function toggleBlkSem(k,dk){openBlk[k]=!openBlk[k];persistOpenBlk();openDayDetail(dk)}

/* ── Ações de confirmação via modal ── */
function confAddEx(){
  const n=document.getElementById('m-en').value.trim();if(!n)return;
  const tp=document.getElementById('m-et').value;
  const s=parseInt(document.getElementById('m-es').value)||3;
  const v=parseInt(document.getElementById('m-ev').value)||10;
  /* BUG-01: sempre inicializar time:0, independente do tipo.
     Sem isso, exercícios de reps ficam sem o campo `time`, gerando objetos
     com estrutura incompleta que código futuro (analytics, 'time' in ex) encontra. */
  const ex={name:n,sets:s,reps:tp==='reps'?v:0,time:tp==='time'?v:0,weight:0,media:[]};
  /* Se chamado da guia Semana (modal.fromSemana), salva no template.
     Caso contrário, salva apenas na sessão de hoje. */
  if(modal.fromSemana){
    blocks[modal.dk][modal.bi].exercises.push(ex);
    saveStore();
    if(modal.dk===todayKey)resetTodaySession();
  } else {
    const k=modal.dk+'-'+modal.bi;
    if(!sessionExtraExercises[k])sessionExtraExercises[k]=[];
    sessionExtraExercises[k].push(ex);
    saveTodayCache(); /* persiste exercícios extras da sessão */
  }
  closeModal();
}
function confAddBlock(dk,type){
  const bt=BTYPES[type];
  if(!blocks[dk])blocks[dk]=[];
  blocks[dk].push({type,label:bt.l,notes:'',exercises:[]});
  saveStore();if(dk===todayKey)resetTodaySession();closeModal();toast('Bloco criado');
}

/* Adiciona bloco SOMENTE à sessão de hoje — não toca blocks/template */
function confAddBlockToday(dk,type){
  const bt=BTYPES[type];
  const newBlock={type,label:bt.l,notes:'',exercises:[],_sessionOnly:true};
  todaySession.push(newBlock);
  todaySessionDirty=true;
  saveTodayCache();
  closeModal();
  toast('Bloco adicionado para hoje');
}

/* Promove um bloco de todaySession para o template da Semana */
function promoteBlockToWeek(bi){
  const b=todaySession[bi];
  if(!b)return;
  const clone=JSON.parse(JSON.stringify(b));
  delete clone._sessionOnly;
  if(!blocks[todayKey])blocks[todayKey]=[];
  blocks[todayKey].push(clone);
  saveStore();
  /* Marca como promovido na sessão (remove flag) */
  delete todaySession[bi]._sessionOnly;
  saveTodayCache();
  toast('Bloco salvo na Semana');
  render();
}
function confEditBlock(){
  const b=blocks[modal.dk][modal.bi];
  b.label=document.getElementById('m-bl').value.trim()||b.label;
  b.notes=document.getElementById('m-bn').value.trim();
  saveStore();if(modal.dk===todayKey)resetTodaySession();closeModal();toast('Bloco atualizado');
}
/* Lê e persiste o estado atual dos inputs do modal editBlock antes de chamar render().
   BUG-05: qualquer clique em cor/tipo/ícone descartava texto que o usuário estava editando
   em #m-bl (label) e #m-bn (notas), pois render() recriava o modal lendo os valores
   salvos em blocks[], não o que estava no input no momento. */
function _captureEditBlockModal(dk,bi){
  const lbl=document.getElementById('m-bl');
  const notes=document.getElementById('m-bn');
  if(lbl&&lbl.value.trim())blocks[dk][bi].label=lbl.value.trim();
  if(notes)blocks[dk][bi].notes=notes.value;
}
function setBlockColor(dk,bi,color){
  _captureEditBlockModal(dk,bi);
  blocks[dk][bi].accentColor=color;saveStore();if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
  if(_lastDayDetail)setTimeout(()=>openDayDetail(_lastDayDetail),0);
}
function setBlockType(dk,bi,type){
  _captureEditBlockModal(dk,bi);
  blocks[dk][bi].type=type;saveStore();if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
}
function setBlockIcon(dk,bi,icon){
  _captureEditBlockModal(dk,bi);
  blocks[dk][bi].customIcon=icon;saveStore();if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
}

/* ── Lightbox de imagem ── */
function openLightbox(url){
  const lb=document.createElement('div');lb.className='img-lightbox';
  lb.innerHTML=`<img src="${url}" alt=""><div class="img-lightbox-close" onclick="this.parentElement.remove()">✕</div>`;
  lb.onclick=function(e){if(e.target===lb)lb.remove();};
  document.getElementById('app').appendChild(lb);
}


/* ════════════════════════════════════════════════════════════════════════════
   § 8 · CRUD — Mutações de dados (blocks, goals, history)
   ────────────────────────────────────────────────────────────────────────────
   Todas as funções que mutam o estado persistido do app. Toda função aqui
   chama saveStore() (ou saveTodayCache()) ao final. Nenhuma faz render()
   exceto quando necessário para atualização visual imediata.

   CONTEÚDO:
   · delEx()             — remove exercício de um bloco.
   · delBlock()          — remove bloco + limpa chaves fantasmas em openBlk.
   · confAddGoal()       — confirma adição de nova meta (via modal).
   · updGoal()           — incrementa/decrementa progresso de meta.
   · delGoal()           — remove meta por índice.
   · saveLog()           — salva snapshot de treino em history[] (gera PR toast).
   · confAddEx()         — confirma adição de exercício via modal.
   · confAddBlock()      — confirma criação de bloco em um dia da semana.
   · confAddBlockToday() — confirma criação de bloco só para hoje.
   · promoteBlockToWeek()— promove bloco de hoje para o template da semana.
   · confEditBlock()     — salva edição de label/cor/ícone/tipo de bloco.
   · setBlockColor()/setBlockType()/setBlockIcon() — setters de propriedades.
   · importData()        — importa JSON completo (substitui todos os dados).
   · exportData()        — exporta JSON para download.
   · confirmDanger()     — executa ação destrutiva (clear history, reset tudo).
   ════════════════════════════════════════════════════════════════════════════ */

function saveLog(dk,bi){
  const now=new Date();
  const today=now.toLocaleDateString('pt-BR');
  const timestamp=now.toISOString(); /* hora exata do registro — fundação de analytics */
  /* Calcula duration se há sessionStart gravado para este bloco */
  const startKey=`bloc_start_${dk}${bi}`;
  const startTs=sessionStorage.getItem(startKey);
  const duration=startTs?Math.round((now-new Date(startTs))/1000):null; /* segundos */
  sessionStorage.removeItem(startKey);
  /* MUDANÇA 4 — lê de todaySession, sem fallback em blocks */
  const b=todaySession[bi];
  if(!b)return;
  const prs=[];
  /* Combina exercícios de todaySession com extras da sessão */
  const extraEx=sessionExtraExercises[dk+'-'+bi]||[];
  const allExercises=[...b.exercises,...extraEx];
  const exArr=allExercises.map(e=>{
    /* todaySession já contém os valores editados pelo usuário via updExToday.
       Não há fallback em blocks — o que está aqui é o que o usuário treinou. */
    if(isPR(e.name,e.weight||0))prs.push({name:e.name,weight:e.weight||0});
    /* Captura o status individual do exercício (done/skipped/undefined).
       O status pertence à sessionExStatus (memória de sessão) e é gravado
       no snapshot do histórico para analytics futuros.
       NUNCA altera blocks nem todaySession — é append-only no histórico. */
    const exStatus = sessionExStatus[exStatusKey(dk, bi, e.name)];
    const entry = {name:e.name,sets:e.sets,reps:e.reps||0,weight:e.weight||0,time:e.time||0};
    if (exStatus) entry.status = exStatus; /* só inclui se houver marcação explícita */
    return entry;
  });
  history.unshift({date:today,timestamp,duration,dayKey:dk,day:DAYFULL[DAYS.indexOf(dk)],blockLabel:b.label,blockType:b.type,exercises:exArr});
  if(history.length>180)history=history.slice(0,180);
  _buildHistoryIndex(); /* P-03/P-04: recstrói índice após mutação de history */
  saveStore();
  /* R2: sessão registrada com sucesso — reseta dirty flag para que mudanças futuras
     no template (via guia Semana) sejam refletidas corretamente via resetTodaySession().
     Mantemos todaySession intacto (pode registrar outros blocos hoje), mas permitimos
     re-clone parcial em caso de mutação do template. */
  todaySessionDirty = false;
  /* Limpa extras da sessão — todaySession permanece (pode registrar outro bloco hoje) */
  delete sessionExtraExercises[dk+'-'+bi];
  saveTodayCache(); /* persiste estado pós-registro */
  /* Feedback contextual rico */
  const totalVol=exArr.reduce((acc,e)=>acc+(e.sets*(e.weight||0)),0);
  if(prs.length>0){
    const prNames=prs.map(p=>`${p.name} ${p.weight}kg`).join(', ');
    toast(`PR — ${prNames}`,'pr-toast');
  } else if(totalVol>0){
    toast(`${b.label} · ${totalVol}kg`);
  } else {
    toast(`${b.label} registrado`);
  }
  render();
  setTimeout(()=>{
    const dots=document.querySelectorAll('.done-dot');
    dots.forEach(d=>{d.style.animation='none';void d.offsetWidth;d.style.animation='donePulse 0.6s var(--ease-spring)';});
  },60);
}

function delEx(dk,bi,ei){blocks[dk][bi].exercises.splice(ei,1);saveStore();if(dk===todayKey)resetTodaySession();render()}
function delBlock(dk,bi){
  blocks[dk].splice(bi,1);
  saveStore();
  if(dk===todayKey)resetTodaySession();
  /* BUG-03: limpar chaves fantasmas de openBlk ao deletar bloco.
     Sem isso, um novo bloco criado no mesmo índice herda o estado de expansão
     do bloco deletado, e openBlk acumula chaves mortas indefinidamente.
     Estratégia: remover as chaves do bloco deletado e re-indexar os blocos
     com índice maior (que foram deslocados pelo splice). */
  /* R4: prefixos de openBlk usados de fato.
     '' = guia Semana (key = dk+bi)
     'sem' = detalhe do dia em Semana (key = 'sem'+dk+bi)
     Prefixo 'hoje' removido: renderBlockCard na guia Hoje usa prefix='hoje' mas gera
     key = 'hoje'+bi (sem dk), nunca 'hoje'+dk+bi — portanto a limpeza com dk era ineficaz. */
  const prefixes=['','sem'];
  prefixes.forEach(pfx=>{
    /* Remove a chave do bloco deletado */
    delete openBlk[pfx+dk+bi];
    /* Re-indexa blocos posteriores: chave bi+1 → bi */
    const remaining=blocks[dk]||[];
    for(let i=bi;i<remaining.length;i++){
      const oldKey=pfx+dk+(i+1);
      const newKey=pfx+dk+i;
      if(openBlk[oldKey]!==undefined){
        openBlk[newKey]=openBlk[oldKey];
        delete openBlk[oldKey];
      }
    }
  });
  persistOpenBlk();
  closeModal();
  toast('Bloco removido');
}

function confAddGoal(){
  const n=document.getElementById('m-gn').value.trim();if(!n)return;
  const s=document.getElementById('m-gs').value.trim();
  goals.push({name:n,progress:0,note:s});
  _statsCache={key:null,html:''}; /* R1: invalida cache de stats — goals mudaram */
  saveStore();closeModal();
}
function updGoal(i,d){
  goals[i].progress=Math.max(0,Math.min(100,goals[i].progress+d));
  _statsCache={key:null,html:''}; /* R1: invalida cache de stats — goals mudaram */
  saveStore();render();
}
function delGoal(i){
  goals.splice(i,1);
  _statsCache={key:null,html:''}; /* R1: invalida cache de stats — goals mudaram */
  saveStore();render();
}

/* ── Navegação entre abas ── */
function nav(p){
  saveScroll();   /* salva scroll da aba atual antes de trocar */
  /* Sai do modo reorganização ao trocar de aba — previne estado órfão */
  if(reorderState.active){reorderState.active=false;reorderState.dk=null;saveStore();}
  /* Fecha journal se estiver aberto */
  if(journalOpen){stopRecording(false);journalOpen=false;journalState=null;}
  page=p;configOpen=false;
  document.getElementById('gear-btn').classList.remove('active');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const nbEl=document.getElementById('nb-'+p);
  if(nbEl)nbEl.classList.add('active');
  render();
}
function toggleConfig(){
  /* Fecha journal se estiver aberto antes de abrir config */
  if(journalOpen){stopRecording(false);journalOpen=false;journalState=null;}
  configOpen=!configOpen;
  document.getElementById('gear-btn').classList.toggle('active',configOpen);
  render();
}

/* ════════════════════════════════════════════════════════════════════════════
   § 9 · RENDER ENGINE — render(), renderHoje(), renderSemana() e derivados
   ────────────────────────────────────────────────────────────────────────────
   Todas as funções que produzem HTML e o injetam no DOM. Funções puras de
   dados chamam as de §5 ANALYTICS; mutações chamam as de §8 CRUD.
   render() é o ponto de entrada único — chama a sub-função correta conforme
   page/configOpen/journalOpen. Sempre chamado após mutação de estado.

   CONTEÚDO:
   · nav()                   — muda aba ativa (salva scroll antes, restaura depois).
   · toggleConfig()          — abre/fecha o painel de configurações.
   · renderHoje()            — HTML da guia Hoje (blocos do dia corrente).
   · renderSemana()          — HTML da guia Semana (todos os dias da semana).
   · openDayDetail()         — abre detalhe de um dia (modal de blocos).
   · renderReorderItem()     — HTML de um item no modo de reordenação.
   · renderHistorico()       — HTML da guia Histórico (lista de registros).
   · renderStats()           — HTML da guia Stats (gráficos, PRs, insights).
   · renderGoals()           — HTML da guia Metas.
   · renderConfig()          — HTML do painel Config (abas: Blocos, Aparência, Dados).
   · renderConfigBlocos()    — sub-render da aba Blocos.
   · renderConfigAparencia() — sub-render da aba Aparência.
   · renderConfigDados()     — sub-render da aba Dados.
   · setConfigTab()          — muda aba ativa do config.
   · APPEARANCE SETTERS      — setTheme(), setAccentColor(), setFont(), etc.
   · render()                — dispatcher principal: decide qual sub-render chamar.
   ════════════════════════════════════════════════════════════════════════════ */

function renderHoje(){
  /* MUDANÇA 2 — usa todaySession (clone independente), nunca blocks[todayKey].
     Isso garante que edições na guia Hoje não mutam o template permanente. */
  const db=todaySession;
  let h=`<div class="sec">${DAYFULL[todayI]}</div>`;

  /* ── Item 4 · Fase 1: Banner de resumo do dia ────────────────────────────
     Lê todaySession (dados do dia) + history (para calcWeekRate).
     Render puro: sem novo estado, sem efeitos colaterais.
     Só aparece quando há blocos no dia. Métricas:
     · Blocos concluídos (via history de hoje) / total em todaySession
     · Volume estimado (sets × weight dos exercícios da sessão)
     · % da semana atual (calcWeekRate já existente)
     ─────────────────────────────────────────────────────────────────────── */
  if(db.length){
    const _todayStr=new Date().toLocaleDateString('pt-BR');
    const _doneTodayCount=history.filter(h=>h.date===_todayStr).length;
    const _totalBlocks=db.length;
    const _allDone=_doneTodayCount>=_totalBlocks;

    /* Volume estimado da sessão de hoje (sets × weight de cada exercício) */
    const _estVol=db.reduce((sum,b)=>{
      const exList=b.exercises||[];
      return sum+exList.reduce((s,e)=>s+(e.sets*(e.weight||0)),0);
    },0);

    /* % da semana */
    const _wr=calcWeekRate();
    const _wrColor=_wr>=80?'var(--green)':_wr>=50?'var(--yellow)':'var(--t2)';

    /* Cor do indicador de blocos do dia */
    const _doneColor=_allDone?'var(--green)':_doneTodayCount>0?'var(--yellow)':'var(--t2)';

    h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0">
      <div style="text-align:center;padding:0 4px">
        <div style="font-size:20px;font-weight:500;color:${_doneColor};line-height:1">${_doneTodayCount}<span style="font-size:12px;color:var(--t2)">/${_totalBlocks}</span></div>
        <div style="font-size:9px;color:var(--t2);margin-top:4px;letter-spacing:.5px;text-transform:uppercase">blocos</div>
      </div>
      <div style="text-align:center;padding:0 4px;border-left:0.5px solid var(--t4)">
        <div style="font-size:20px;font-weight:500;color:var(--tc);line-height:1">${_estVol}<span style="font-size:11px;color:var(--t2);margin-left:1px">kg</span></div>
        <div style="font-size:9px;color:var(--t2);margin-top:4px;letter-spacing:.5px;text-transform:uppercase">vol. est.</div>
      </div>
      <div style="text-align:center;padding:0 4px;border-left:0.5px solid var(--t4)">
        <div style="font-size:20px;font-weight:500;color:${_wrColor};line-height:1">${_wr}<span style="font-size:11px;color:var(--t2);margin-left:1px">%</span></div>
        <div style="font-size:9px;color:var(--t2);margin-top:4px;letter-spacing:.5px;text-transform:uppercase">semana</div>
      </div>
    </div>`;
  }

  if(!db.length)h+=`<div class="empty"><strong>Sem blocos hoje</strong>Vá em Semana para montar o dia.</div>`;

  /* ── Fase 2 · Item 8: card compacto de metas ativas ─────────────────────
     Aparece entre o banner e os blocos, quando há metas incompletas.
     Render puro: lê goals[] (global) sem efeito colateral.
     Só exibe metas com progress < 100 para não poluir quando tudo concluído.
     ─────────────────────────────────────────────────────────────────────── */
  const _activeGoals=(goals||[]).filter(g=>(g.progress||0)<100);
  if(_activeGoals.length){
    let _goalsHtml='';
    _activeGoals.slice(0,3).forEach((g,i)=>{
      const _gi=goals.indexOf(g); /* índice real para updGoal/delGoal */
      const _pct=Math.max(0,Math.min(100,g.progress||0));
      const _bc=_pct>=80?'var(--green)':_pct>=50?'var(--ac)':'var(--t2)';
      _goalsHtml+=`<div style="margin-bottom:${i<Math.min(_activeGoals.length,3)-1?8:0}px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <div style="font-size:12px;color:var(--tc);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g.name}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:8px">
            <div style="font-size:11px;font-weight:500;color:${_bc}">${_pct}%</div>
            <button onclick="updGoal(${_gi},+10)" style="font-size:10px;color:var(--t2);background:var(--s3);border:0.5px solid var(--b1);border-radius:var(--r-sm);padding:2px 7px;cursor:pointer;font-family:inherit">+10</button>
          </div>
        </div>
        <div style="height:3px;background:var(--s3);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${_pct}%;background:${_bc};border-radius:2px;transition:width .3s"></div>
        </div>
      </div>`;
    });
    const _moreCount=_activeGoals.length>3?_activeGoals.length-3:0;
    h+=`<div style="background:var(--s1);border:0.5px solid var(--b1);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:10px;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;font-weight:500">Metas ativas</div>
        <button onclick="page='stats';render()" style="font-size:10px;color:var(--t2);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;letter-spacing:.3px">ver todas →</button>
      </div>
      ${_goalsHtml}
      ${_moreCount?`<div style="font-size:10px;color:var(--t2);margin-top:6px">+${_moreCount} outras metas</div>`:''}
    </div>`;
  }

  db.forEach((b,i)=>h+=renderBlockCard(b,todayKey,i,'hoje'));
  h+=`<button class="add-b" onclick="openModal({t:'addBlockToday',dk:'${todayKey}'})">
    <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
    Novo bloco
  </button>`;
  return h;
}

function renderSemana(){
  let h=`<div class="sec">Semana</div><div class="wk-grid">`;
  DAYS.forEach((d,i)=>{
    const db=blocks[d]||[];const isT=i===todayI;
    const blist=db.length?db.map(b=>`<span class="dc-dot"></span>${b.label}`).join('<br>'):`<span style="color:var(--t3)">—</span>`;
    h+=`<div class="dc${isT?' today':''}" onclick="openDayDetail('${d}')">
      <div class="dc-day">${d}${isT?` <span style="width:4px;height:4px;border-radius:50%;background:var(--ac);display:inline-block;margin-left:2px"></span>`:''}</div>
      <div class="dc-blocks">${blist}</div>
    </div>`;
  });
  h+=`</div><div id="dd"></div>`;
  return h;
}

function openDayDetail(dk){
  const db=blocks[dk]||[];const i=DAYS.indexOf(dk);
  const inReorder=reorderState.active&&reorderState.dk===dk;

  let h=`<div class="sep"></div><div class="sec">${DAYFULL[i]}</div>`;

  /* ── Banner de modo reorganização ── */
  if(inReorder){
    h+=`<div class="reorder-banner">
      <div class="reorder-banner-dot"></div>
      <div class="reorder-banner-label">Arraste os blocos para reorganizar</div>
      <button class="reorder-done-btn" onclick="exitReorderMode()">Concluir</button>
    </div>`;
  }

  /* ── Lista de blocos ── */
  h+=`<div id="reorder-list-${dk}">`;
  db.forEach((b,bi)=>{
    if(inReorder){
      /* Modo reorganização: cada bloco vira um item arrastável com handle */
      h+=renderReorderItem(b,bi,dk);
    } else {
      /* Modo normal: comportamento original preservado */
      const key='sem'+dk+bi;
      const isOpen=openBlk[key];
      const colorAttr=b.accentColor?` data-color="${b.accentColor}"`:'';
      let body='';
      if(isOpen){
        b.exercises.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,ei,true);});
        body+=`<button class="add-b" onclick="openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:true});setTimeout(()=>reopenDay('${dk}'),10)">
          <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
          exercício
        </button>`;
        body+=`<button class="sreg" onclick="openModal({t:'editBlock',dk:'${dk}',bi:${bi}})">Editar bloco</button>`;
      }
      const chevSvg=`<svg viewBox="0 0 14 14"><path d="M3 5L7 9L11 5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      h+=`<div class="bc${isOpen?' open':''}${colorAttr}">
        <div class="bh" onclick="toggleBlkSem('${key}','${dk}')">
          <div class="bl-icon">${blockIcon(b)}</div>
          <div class="bh-info"><div class="bn">${b.label}</div><div class="bs">${b.exercises.length} exercício${b.exercises.length!==1?'s':''}</div></div>
          <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
        </div>
        ${isOpen?`<div class="bbody">${body}</div>`:''}
      </div>`;
    }
  });
  h+=`</div>`;

  /* ── Botões de ação abaixo da lista ── */
  if(!inReorder){
    h+=`<button class="add-b" onclick="openModal({t:'addBlock',dk:'${dk}'})">
      <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
      Novo bloco em ${dk}
    </button>`;
    /* Botão de reorganizar — só aparece quando há mais de 1 bloco */
    if(db.length>1){
      h+=`<button class="reorder-btn" onclick="enterReorderMode('${dk}')">
        <svg viewBox="0 0 16 16" style="stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round">
          <path d="M2 5h12M2 8h12M2 11h12"/>
        </svg>
        Reorganizar blocos
      </button>`;
    }
  }

  const dd=document.getElementById('dd');
  if(dd){
    dd.innerHTML=h;
    /* Scroll automático ao abrir o detalhe do dia */
    setTimeout(()=>{
      const ct=document.getElementById('content');
      if(ct&&dd)ct.scrollTop=dd.offsetTop-16;
    },80);
    /* Se estiver em modo reorder, ativa os listeners de drag */
    if(inReorder){
      setTimeout(()=>attachReorderListeners(dk),30);
    }
  }
  _lastDayDetail=dk;
}
