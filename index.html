}

/* ── render() — dispatcher principal: decide qual sub-render executar ── */
function render(){
  /* BUG-04: Cancelar drag ativo antes de destruir o DOM.
     Sem isso, render() durante um drag destrói referências DOM que o
     drag engine ainda segura → ghost fica preso, listeners nunca removidos,
     app trava até reload. */
  if(_drag.active)_dragCancel();
  if(_exDrag.active)_exDragCancel();
  captureInputs();   /* captura estado dos inputs ANTES de destruir o DOM */
  saveScroll();      /* salva posição de scroll por aba */
  let h='';
  if(journalOpen)h=renderJournalScreen();
  else if(configOpen)h=renderConfig();
  else if(page==='hoje')h=renderHoje();
  else if(page==='semana')h=renderSemana();
  else if(page==='historico')h=renderHistorico();
  else if(page==='stats')h=renderStats();
  else if(page==='journals')h=renderJournals();
  const content=document.getElementById('content');
  content.innerHTML=`<div class="page-anim">${h}</div>`;
  /* Modal vai para #modal-root (fora do scroll container) */
  const modalRoot=document.getElementById('modal-root');
  if(modalRoot)modalRoot.innerHTML=renderModal();
  restoreScroll();   /* restaura scroll depois de inserir o conteúdo */
}

/* ════════════════════════════════════════════════════════════════════════════
   § 10 · DRAG ENGINE — Reordenação de blocos e exercícios (touch + mouse)
   ────────────────────────────────────────────────────────────────────────────
   Engine de drag-and-drop v2 com estratégia de placeholder: o elemento original
   some, um clone visual (ghost) flutua com o toque, e um placeholder marca o
   slot de destino. Dados só mudam no drop — sem mutações durante o drag.

   HISTÓRICO DE BUGS CORRIGIDOS (v1 → v2):
   1. Ghost deslocado: v1 usava left/top absolutos ignorando scroll e max-width
      do #app. v2 usa transform:translate (relativo ao viewport).
   2. DOM corrompido: v1 mutava blocks[dk] em tempo real e recriava o DOM durante
      o drag, perdendo referências. v2 usa placeholder estático.
   3. Índice acumulado: fromIndex era reincrementado a cada frame. Agora é fixo.
   4. Conflito iOS: touch-action:none no CSS + preventDefault resolve o conflito
      entre scroll e drag no Safari.

   CONTEÚDO:
   · _drag / _exDrag       — estado interno (resetado a cada drag).
   · enterReorderMode()    — ativa modo reordenação para blocos do dia.
   · exitReorderMode()     — encerra modo, re-renderiza.
   · attachExReorderListeners() — liga drag nos exercícios dentro de um bloco.
   · attachReorderListeners()   — liga drag nos blocos de um dia.
   · _onStart/_onMove/_onEnd    — handlers de blocos (touch + mouse).
   · _exOnStart/_exOnMove/_exOnEnd — handlers de exercícios.
   · _calcDropIndex()      — calcula índice de destino pela posição Y do cursor.
   · _startAutoScroll()/_stopAutoScroll() — scroll automático nas bordas.
   · reopenDay()           — reabre o detalhe de dia após exit de reorder.
   ════════════════════════════════════════════════════════════════════════════ */

/* Estado interno — resetado a cada drag */
const _drag = {
  active: false,
  el: null,          /* elemento original (some durante drag) */
  ghost: null,       /* clone visual flutuante */
  placeholder: null, /* div que marca o slot de destino */
  dk: null,          /* dia sendo reorganizado */
  fromIndex: -1,     /* índice de origem (fixo durante o drag) */
  toIndex: -1,       /* índice de destino atual */
  offsetX: 0,        /* distância do ponto de toque à borda esquerda do card */
  offsetY: 0,        /* distância do ponto de toque à borda superior do card */
  ghostW: 0,         /* largura do ghost */
  scrollEl: null,
  scrollRaf: null,   /* requestAnimationFrame do auto-scroll */
  clientY: 0,        /* última posição Y conhecida do ponteiro */
};

/* ── Entrada/saída do modo de reorganização ── */
function enterReorderMode(dk){
  reorderState.active=true;
  reorderState.dk=dk;
  Object.keys(openBlk).forEach(k=>{if(k.startsWith('sem'+dk))openBlk[k]=false;});
  openDayDetail(dk);
  toast('Segure e arraste para reorganizar');
}

function exitReorderMode(){
  /* Garante que qualquer drag em andamento é cancelado */
  if(_drag.active)_dragCancel();
  reorderState.active=false;
  reorderState.dk=null;
  saveStore();
  if(_lastDayDetail)openDayDetail(_lastDayDetail);
  toast('Ordem salva');
}

/* ═══════════════════════════════════════════════════════════════════
   EXERCISE REORDER ENGINE — drag-and-drop dentro do modal reorderEx
   Mesmo padrão do block reorder, adaptado para exercícios inline no modal.
   Salva imediatamente em blocks ao soltar; modal re-renderiza automaticamente.
   ═══════════════════════════════════════════════════════════════════ */
const _exDrag = {
  active:false, el:null, ghost:null, placeholder:null,
  fromIndex:-1, toIndex:-1, offsetX:0, offsetY:0,
  dk:null, bi:-1, scrollEl:null, scrollRaf:null, clientY:0,
};

function attachExReorderListeners(){
  const list=document.getElementById('ex-reorder-list');
  if(!list)return;
  list.querySelectorAll('.ex-reorder-item').forEach(item=>{
    item.addEventListener('mousedown',_exOnStart,{passive:false});
    item.addEventListener('touchstart',_exOnStart,{passive:false});
  });
}

function _exOnStart(e){
  e.preventDefault();
  const el=e.currentTarget;
  const isTouchEvt=e.type==='touchstart';
  const pt=isTouchEvt?e.touches[0]:e;
  const rect=el.getBoundingClientRect();

  const ph=document.createElement('div');
  ph.className='bc-placeholder';ph.style.height=rect.height+'px';ph.style.borderRadius='var(--r-md)';
  el.parentNode.insertBefore(ph,el.nextSibling);

  const ghost=el.cloneNode(true);
  ghost.style.cssText=`position:fixed;top:0;left:0;z-index:9999;pointer-events:none;will-change:transform;width:${rect.width}px;border-radius:var(--r-md);background:var(--s3);border:1px solid var(--b2);box-shadow:0 12px 32px rgba(0,0,0,0.45);opacity:0.97;transform:translate(${rect.left}px,${rect.top}px)`;
  document.getElementById('app').appendChild(ghost);

  el.style.opacity='0';el.style.pointerEvents='none';

  const m=modal;
  _exDrag.active=true;_exDrag.el=el;_exDrag.ghost=ghost;_exDrag.placeholder=ph;
  _exDrag.fromIndex=parseInt(el.dataset.ei);_exDrag.toIndex=_exDrag.fromIndex;
  _exDrag.offsetX=pt.clientX-rect.left;_exDrag.offsetY=pt.clientY-rect.top;
  _exDrag.dk=m.dk;_exDrag.bi=m.bi;
  _exDrag.scrollEl=document.querySelector('.modal-ov .modal');
  _exDrag.clientY=pt.clientY;

  if(isTouchEvt){
    document.addEventListener('touchmove',_exOnMove,{passive:false});
    document.addEventListener('touchend',_exOnEnd,{passive:false});
    document.addEventListener('touchcancel',_exDragCancel,{passive:false});
  } else {
    document.addEventListener('mousemove',_exOnMove);
    document.addEventListener('mouseup',_exOnEnd);
  }
}

function _exOnMove(e){
  if(!_exDrag.active)return;e.preventDefault();
  const pt=e.type==='touchmove'?e.touches[0]:e;
  const cx=pt.clientX;const cy=pt.clientY;_exDrag.clientY=cy;
  if(_exDrag.ghost){_exDrag.ghost.style.transition='none';_exDrag.ghost.style.transform=`translate(${cx-_exDrag.offsetX}px,${cy-_exDrag.offsetY}px)`;}
  _exCalcDropIndex(cy);
}

function _exOnEnd(e){
  if(!_exDrag.active)return;e.preventDefault();
  _exDrag.active=false;
  document.removeEventListener('touchmove',_exOnMove);document.removeEventListener('touchend',_exOnEnd);
  document.removeEventListener('touchcancel',_exDragCancel);document.removeEventListener('mousemove',_exOnMove);document.removeEventListener('mouseup',_exOnEnd);
  const from=_exDrag.fromIndex;const to=_exDrag.toIndex;
  if(from!==to&&blocks[_exDrag.dk]&&blocks[_exDrag.dk][_exDrag.bi]){
    const arr=blocks[_exDrag.dk][_exDrag.bi].exercises;
    const item=arr.splice(from,1)[0];arr.splice(to,0,item);
    saveStore();
    if(_exDrag.dk===todayKey)resetTodaySession();
  }
  if(_exDrag.ghost){_exDrag.ghost.remove();_exDrag.ghost=null;}
  if(_exDrag.placeholder){_exDrag.placeholder.remove();_exDrag.placeholder=null;}
  /* Re-abre o modal reorderEx para refletir nova ordem */
  openModal({t:'reorderEx',dk:_exDrag.dk,bi:_exDrag.bi});
  setTimeout(()=>attachExReorderListeners(),30);
}

function _exDragCancel(){
  if(!_exDrag.active)return;_exDrag.active=false;
  document.removeEventListener('touchmove',_exOnMove);document.removeEventListener('touchend',_exOnEnd);
  document.removeEventListener('touchcancel',_exDragCancel);document.removeEventListener('mousemove',_exOnMove);document.removeEventListener('mouseup',_exOnEnd);
  if(_exDrag.ghost){_exDrag.ghost.remove();_exDrag.ghost=null;}
  if(_exDrag.placeholder){_exDrag.placeholder.remove();_exDrag.placeholder=null;}
  if(_exDrag.el){_exDrag.el.style.opacity='';_exDrag.el.style.pointerEvents='';}
  openModal({t:'reorderEx',dk:_exDrag.dk,bi:_exDrag.bi});
  setTimeout(()=>attachExReorderListeners(),30);
}

function _exCalcDropIndex(clientY){
  const list=document.getElementById('ex-reorder-list');
  if(!list||!_exDrag.placeholder)return;
  const items=[...list.querySelectorAll('.ex-reorder-item')].filter(el=>el.style.opacity!=='0');
  if(!items.length)return;
  let newTo=_exDrag.fromIndex;let insertBefore=null;let placed=false;
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(clientY<r.top+r.height*0.5){
      newTo=parseInt(items[i].dataset.ei);
      if(newTo>_exDrag.fromIndex)newTo=newTo-1;
      insertBefore=items[i];placed=true;break;
    }
  }
  if(!placed){
    const last=items[items.length-1];
    newTo=parseInt(last.dataset.ei);
    if(newTo<_exDrag.fromIndex)newTo=newTo+1;
    insertBefore=last.nextSibling;
  }
  if(newTo!==_exDrag.toIndex)_exDrag.toIndex=newTo;
  list.insertBefore(_exDrag.placeholder,insertBefore||null);
}


function attachReorderListeners(dk){
  const list=document.getElementById('reorder-list-'+dk);
  if(!list)return;
  list.querySelectorAll('.bc-reorder').forEach(item=>{
    item.addEventListener('mousedown', _onStart, {passive:false});
    item.addEventListener('touchstart', _onStart, {passive:false});
  });
}

/* ── Início do drag ── */
function _onStart(e){
  if(e.target.closest('button'))return; /* não inicia em botões */
  e.preventDefault();

  const el = e.currentTarget;
  const isTouchEvt = e.type === 'touchstart';
  const pt = isTouchEvt ? e.touches[0] : e;
  const rect = el.getBoundingClientRect();

  /* Cria placeholder com mesma altura do card */
  const ph = document.createElement('div');
  ph.className = 'bc-placeholder';
  ph.style.height = rect.height + 'px';
  el.parentNode.insertBefore(ph, el.nextSibling); /* insere após o original */

  /* Cria ghost (clone visual) posicionado via transform */
  const ghost = el.cloneNode(true);
  ghost.className = 'bc bc-drag-ghost';
  ghost.style.width = rect.width + 'px';
  ghost.style.transform = `translate(${rect.left}px, ${rect.top}px)`;
  /* Anima entrada: escala leve para feedback tátil */
  ghost.style.transition = 'transform 0.12s var(--ease-spring), box-shadow 0.12s ease';
  document.getElementById('app').appendChild(ghost);
  requestAnimationFrame(()=>{
    ghost.style.boxShadow = '0 20px 50px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.4)';
    ghost.style.transition = 'box-shadow 0.12s ease'; /* remove transform transition após entrada */
  });

  /* Esconde o original */
  el.classList.add('bc-dragging');

  /* Inicializa estado */
  _drag.active      = true;
  _drag.el          = el;
  _drag.ghost       = ghost;
  _drag.placeholder = ph;
  _drag.dk          = el.dataset.dk;
  _drag.fromIndex   = parseInt(el.dataset.bi);
  _drag.toIndex     = _drag.fromIndex;
  _drag.offsetX     = pt.clientX - rect.left;
  _drag.offsetY     = pt.clientY - rect.top;
  _drag.ghostW      = rect.width;
  _drag.scrollEl    = document.getElementById('content');
  _drag.clientY     = pt.clientY;

  if(isTouchEvt){
    document.addEventListener('touchmove',  _onMove,  {passive:false});
    document.addEventListener('touchend',   _onEnd,   {passive:false});
    document.addEventListener('touchcancel',_dragCancel,{passive:false});
  } else {
    document.addEventListener('mousemove', _onMove);
    document.addEventListener('mouseup',   _onEnd);
  }
}

/* ── Movimento ── */
function _onMove(e){
  if(!_drag.active)return;
  e.preventDefault();

  const isTouchEvt = e.type === 'touchmove';
  const pt = isTouchEvt ? e.touches[0] : e;
  const cx = pt.clientX;
  const cy = pt.clientY;
  _drag.clientY = cy;

  /* Move o ghost usando transform — correto independente de scroll ou max-width */
  if(_drag.ghost){
    _drag.ghost.style.transition = 'none'; /* sem transition durante movimento */
    _drag.ghost.style.transform = `translate(${cx - _drag.offsetX}px, ${cy - _drag.offsetY}px)`;
  }

  /* Auto-scroll */
  _startAutoScroll();

  /* Calcula novo índice de destino olhando os itens visiveis no DOM */
  _calcDropIndex(cy);
}

/* ── Fim do drag ── */
function _onEnd(e){
  if(!_drag.active)return;
  e.preventDefault();

  _drag.active = false;
  _stopAutoScroll();

  /* Remove listeners globais */
  document.removeEventListener('touchmove',   _onMove);
  document.removeEventListener('touchend',    _onEnd);
  document.removeEventListener('touchcancel', _dragCancel);
  document.removeEventListener('mousemove',   _onMove);
  document.removeEventListener('mouseup',     _onEnd);

  /* Aplica a reordenação nos dados (só agora, no drop) */
  const from = _drag.fromIndex;
  const to   = _drag.toIndex;
  if(from !== to && blocks[_drag.dk]){
    const arr = blocks[_drag.dk];
    const item = arr.splice(from, 1)[0];
    arr.splice(to, 0, item);
    saveStore();
  }

  /* Remove ghost e placeholder e re-renderiza a lista */
  if(_drag.ghost){ _drag.ghost.remove(); _drag.ghost=null; }
  if(_drag.placeholder){ _drag.placeholder.remove(); _drag.placeholder=null; }
  if(_drag.el){ _drag.el.classList.remove('bc-dragging'); _drag.el=null; }

  /* Re-renderiza apenas o detail do dia (não full render) */
  if(_lastDayDetail)openDayDetail(_lastDayDetail);
}

/* ── Cancela drag (touchcancel ou saída de emergência) ── */
function _dragCancel(){
  if(!_drag.active)return;
  _drag.active = false;
  _stopAutoScroll();
  document.removeEventListener('touchmove',   _onMove);
  document.removeEventListener('touchend',    _onEnd);
  document.removeEventListener('touchcancel', _dragCancel);
  document.removeEventListener('mousemove',   _onMove);
  document.removeEventListener('mouseup',     _onEnd);
  if(_drag.ghost){ _drag.ghost.remove(); _drag.ghost=null; }
  if(_drag.placeholder){ _drag.placeholder.remove(); _drag.placeholder=null; }
  if(_drag.el){ _drag.el.classList.remove('bc-dragging'); _drag.el=null; }
  /* Cancela sem salvar — ordem original permanece */
  if(_lastDayDetail)openDayDetail(_lastDayDetail);
}

/* ── Calcula onde o placeholder deve ficar e move-o ── */
function _calcDropIndex(clientY){
  const list = document.getElementById('reorder-list-'+_drag.dk);
  if(!list||!_drag.placeholder)return;

  /* Coleta itens reais (exclui o original invisível e o placeholder) */
  const items = [...list.querySelectorAll('.bc-reorder:not(.bc-dragging)')];
  if(!items.length)return;

  let newTo = _drag.fromIndex;
  let insertBefore = null; /* referência DOM de onde inserir o placeholder */

  let placed = false;
  for(let i=0;i<items.length;i++){
    const r = items[i].getBoundingClientRect();
    if(clientY < r.top + r.height * 0.5){
      /* Cursor está na metade superior deste item → placeholder fica antes dele */
      newTo = parseInt(items[i].dataset.bi);
      /* Se o item vem depois do from, ajusta para compensar a remoção */
      if(newTo > _drag.fromIndex) newTo = newTo - 1;
      insertBefore = items[i];
      placed = true;
      break;
    }
  }
  if(!placed){
    /* Cursor abaixo de todos → vai para o final */
    const last = items[items.length-1];
    newTo = parseInt(last.dataset.bi);
    if(newTo < _drag.fromIndex) newTo = newTo + 1;
    /* Insere depois do último */
    insertBefore = last.nextSibling;
  }

  /* Move o placeholder no DOM só se a posição mudou */
  if(newTo !== _drag.toIndex){
    _drag.toIndex = newTo;
  }
  /* Sempre move o placeholder para refletir posição visual correta */
  list.insertBefore(_drag.placeholder, insertBefore || null);
}

/* ── Auto-scroll suave usando rAF ── */
function _startAutoScroll(){
  _stopAutoScroll();
  function _frame(){
    if(!_drag.active)return;
    const ct = _drag.scrollEl;
    if(ct){
      const cr = ct.getBoundingClientRect();
      const zone = 72, speed = 10;
      const cy = _drag.clientY;
      if(cy < cr.top + zone){
        ct.scrollTop -= speed * (1 - (cy - cr.top) / zone);
      } else if(cy > cr.bottom - zone){
        ct.scrollTop += speed * (1 - (cr.bottom - cy) / zone);
      }
    }
    _drag.scrollRaf = requestAnimationFrame(_frame);
  }
  _drag.scrollRaf = requestAnimationFrame(_frame);
}
function _stopAutoScroll(){
  if(_drag.scrollRaf){ cancelAnimationFrame(_drag.scrollRaf); _drag.scrollRaf=null; }
}

/* R5: parâmetro dk removido — nunca foi usado; função sempre usa _lastDayDetail */
function reopenDay(){if(_lastDayDetail)openDayDetail(_lastDayDetail)}

/* ════════════════════════════════════════════════════════════════════════════
   § 11 · JOURNAL — Sistema completo de diário de treino
   ────────────────────────────────────────────────────────────────────────────
   Sistema de diário por bloco/data: o usuário pode registrar texto, fotos e
   áudios para cada bloco em cada dia de treino. Persistido em localStorage
   separado (JOURNAL_STORE) para não inflar o store principal com base64.

   ARQUITETURA DE DADOS:
   journals = { "[dk]-[bi]-[date]": { text, mood, photos[], audios[], updatedAt } }
   Chave determinística: dia (dk) + índice do bloco (bi) + data do registro.
   Cada journal é vinculado a um bloco específico em um dia específico.

   REGRA: loadJournals() e saveJournals() vivem aqui por coesão — o journal é
   uma unidade funcional completa. A inicialização (let journals) foi movida
   para §3 STATE (R8) para garantir ordem de dependência segura independente
   de reorganizações futuras de seções.

   CONTEÚDO:
   · loadJournals()/saveJournals() — persistência (localStorage separado).
   · journalKey()                  — chave determinística dk+bi+date.
   · journalHasEntry()             — verifica se há entrada para um bloco/data.
   · openJournal()/closeJournal()  — abre/fecha o painel de journal.
   · renderJournalScreen()         — HTML completo da tela de journal.
   · journalTextInput()            — auto-resize do textarea.
   · journalSetMood()              — seleciona humor do treino.
   · journalAutoSave()             — salva automaticamente a cada mudança.
   · journalSaveAndClose()         — salva e fecha o journal.
   · journalAddPhotos()            — adiciona fotos (base64) ao journal.
   · journalDelPhoto()/journalDelAudio() — remove mídia do journal.
   · stopRecording()               — para gravação de áudio e processa blob.
   · updateJournalNavDot()         — atualiza indicador de journal na nav.
   · renderJournals()              — HTML da lista de todos os journals.
   · viewJournalEntry()            — abre entrada individual para leitura.
   ════════════════════════════════════════════════════════════════════════════ */

/* Carrega todos os journals */
function loadJournals(){
  try{return JSON.parse(localStorage.getItem(JOURNAL_STORE))||{};}catch{return{};}
}
function saveJournals(j){
  try{localStorage.setItem(JOURNAL_STORE,JSON.stringify(j));}catch(e){
    toast('Erro ao salvar — armazenamento cheio');
  }
}

/* ── Chave do journal ── */
function journalKey(dk,bi,date){return`${dk}-${bi}-${date}`;}

/* ── Verifica se há entry para bloco/data ── */
function journalHasEntry(dk,bi,date){
  const k=journalKey(dk,bi,date);
  const e=journals[k];
  return !!(e&&(e.text||(e.photos&&e.photos.length)||(e.audios&&e.audios.length)));
}

/* ── Estado da tela Journal ── */
let journalState = null; /* { dk, bi, date, key } */
let journalAutoSaveTimer = null;
let recorderState = { active:false, stream:null, recorder:null, chunks:[], timer:null, elapsed:0 };

/* ── Abre tela Journal — via flag journalOpen, renderiza no #content ── */
function openJournal(dk,bi){
  const date = new Date().toLocaleDateString('pt-BR');
  const key = journalKey(dk,bi,date);
  journalState = { dk, bi, date, key };
  journalOpen = true;
  render();
  /* Scroll ao topo */
  const ct = document.getElementById('content');
  if(ct) ct.scrollTo({top:0,behavior:'instant'});
  /* Foca o textarea após animação */
  setTimeout(()=>{
    const ta = document.getElementById('journal-ta');
    if(ta && !journals[key]?.text) ta.focus();
  }, 280);
  updateJournalNavDot();
}

/* ── Fecha tela Journal ── */
function closeJournal(){
  stopRecording(false);
  journalAutoSave(true);
  journalOpen = false;
  journalState = null;
  updateJournalNavDot();
  render();
}

/* ── Renderiza tela Journal dentro do #content ── */
function renderJournalScreen(){
  if(!journalState) return '';
  const {dk, bi, date, key} = journalState;
  const entry = journals[key] || {};
  const block = (blocks[dk]||[])[parseInt(bi)];
  if(!block){ closeJournal(); return ''; }

  const now = new Date();
  const hora = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const diaSem = DAYFULL[now.getDay()];
  const today = now.toLocaleDateString('pt-BR');
  const hasDone = history.some(h=>h.dayKey===dk&&h.date===today&&h.blockLabel===block.label);

  const MOODS = [
    {id:'great', emoji:'😄', label:'Incrível'},
    {id:'good',  emoji:'🙂', label:'Bem'},
    {id:'ok',    emoji:'😐', label:'Ok'},
    {id:'bad',   emoji:'😓', label:'Difícil'},
    {id:'worst', emoji:'💣', label:'Péssimo'},
  ];

  let h = `<div class="journal-hdr">
    <button class="journal-back" onclick="closeJournal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2L4 7l5 5"/></svg>
    </button>
    <div class="journal-hdr-info">
      <div class="journal-hdr-title">${block.label}</div>
      <div class="journal-hdr-sub">${diaSem}, ${date} · ${hora}</div>
    </div>
    <button class="journal-save-btn" onclick="journalSaveAndClose()">Salvar</button>
  </div>`;

  /* Contexto automático */
  h += `<div class="journal-ctx">
    <div class="journal-ctx-item"><div class="journal-ctx-label">Tipo</div><div class="journal-ctx-val">${(BTYPES[block.type]||{l:block.type}).l}</div></div>
    <div class="journal-ctx-item"><div class="journal-ctx-label">Dia</div><div class="journal-ctx-val">${diaSem}</div></div>
    <div class="journal-ctx-item"><div class="journal-ctx-label">Status</div><div class="journal-ctx-val" style="color:${hasDone?'var(--green)':'var(--t2)'}">${hasDone?'✓ Feito':'Não registrado'}</div></div>
  </div>`;

  /* Humor */
  h += `<div class="journal-section">
    <div class="journal-section-label">Como você está</div>
    <div class="journal-mood-row">`;
  MOODS.forEach(m=>{
    const sel = (entry.mood===m.id) ? ' selected' : '';
    h += `<button class="journal-mood-opt${sel}" onclick="journalSetMood('${m.id}')">
      <span class="journal-mood-emoji">${m.emoji}</span>
      <span class="journal-mood-lbl">${m.label}</span>
    </button>`;
  });
  h += `</div></div>`;

  /* Texto */
  h += `<div class="journal-section">
    <div class="journal-section-label">Pensamentos</div>
    <textarea class="journal-textarea" id="journal-ta" placeholder="Como foi esse bloco? O que sentiu? O que mudaria..." oninput="journalTextInput(this)">${entry.text||''}</textarea>
    <div class="journal-autosave" id="journal-autosave">${entry.updatedAt?'Salvo às '+entry.updatedAt:''}</div>
  </div>`;

  /* Fotos */
  h += `<div class="journal-section">
    <div class="journal-section-label">Fotos</div>
    <div class="journal-photos-grid">`;
  (entry.photos||[]).forEach((src,pi)=>{
    h += `<div class="journal-photo-wrap">
      <img src="${src}" onclick="openLightbox('${src}')" loading="lazy">
      <button class="journal-photo-del" onclick="journalDelPhoto(${pi})">✕</button>
    </div>`;
  });
  if((entry.photos||[]).length < 9){
    h += `<button class="journal-add-photo" onclick="document.getElementById('journal-file-input').click()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v8M4 8h8"/></svg>
        Foto
      </button>`;
  }
  h += `</div>
    <input type="file" id="journal-file-input" accept="image/*" multiple style="display:none" onchange="journalAddPhotos(this)">
  </div>`;

  /* Áudio */
  h += `<div class="journal-section">
    <div class="journal-section-label">Áudio</div>
    <div class="journal-audio-ui">`;
  if(!recorderState.active){
    h += `<button class="journal-rec-btn" onclick="startRecording()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="5.5" y="2" width="5" height="8" rx="2.5" stroke-width="1.3"/><path d="M3 9.5a5 5 0 0010 0" stroke-width="1.3"/><path d="M8 14.5v-2.5" stroke-width="1.4"/></svg>
      Gravar áudio
    </button>`;
  } else {
    h += `<div class="journal-rec-timer" id="journal-rec-timer">0:00</div>
    <button class="journal-rec-btn recording" onclick="stopRecording(true)">
      <svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
      Parar gravação
    </button>`;
  }
  (entry.audios||[]).forEach((aud,ai)=>{
    h += `<div class="journal-audio-item">
      <div class="journal-audio-lbl">Áudio ${ai+1}</div>
      <audio controls src="${aud}" style="flex:1;height:32px;min-width:0"></audio>
      <button class="journal-audio-del" onclick="journalDelAudio(${ai})">✕</button>
    </div>`;
  });
  h += `</div></div>`;

  return h;
}

/* ── Input do textarea com autosave ── */
function journalTextInput(el){
  clearTimeout(journalAutoSaveTimer);
  const as = document.getElementById('journal-autosave');
  if(as) { as.textContent = 'salvando...'; as.className='journal-autosave'; }
  journalAutoSaveTimer = setTimeout(()=>journalAutoSave(false), 1200);
}

/* ── Seleciona humor — re-render parcial para evitar perder scroll/texto ── */
function journalSetMood(moodId){
  if(!journalState) return;
  const {key} = journalState;
  /* Preserva texto atual antes do re-render */
  const ta = document.getElementById('journal-ta');
  const entry = journals[key] || {text:'',photos:[],audios:[],meta:{}};
  if(ta) entry.text = ta.value;
  /* UX-05: salvar posição do cursor antes do render().
     render() recria o textarea inteiro, resetando o cursor para o final.
     Restauramos selectionStart/End no setTimeout pós-render. */
  const selStart = ta ? ta.selectionStart : null;
  const selEnd   = ta ? ta.selectionEnd   : null;
  entry.mood = (entry.mood === moodId) ? null : moodId;
  entry.meta = { dk:journalState.dk, bi:journalState.bi, date:journalState.date };
  journals[key] = entry;
  saveJournals(journals);
  /* Re-render preservando posição de scroll e cursor */
  const scrollY = document.getElementById('content')?.scrollTop || 0;
  render();
  setTimeout(()=>{
    const ct=document.getElementById('content');
    if(ct) ct.scrollTo({top:scrollY,behavior:'instant'});
    if(selStart!==null){
      const newTa=document.getElementById('journal-ta');
      if(newTa){ newTa.focus(); newTa.setSelectionRange(selStart,selEnd); }
    }
  },0);
}

/* ── Autosave ── */
function journalAutoSave(silent){
  if(!journalState) return;
  const {key} = journalState;
  const ta = document.getElementById('journal-ta');
  if(!ta) return;

  const entry = journals[key] || {};
  entry.text = ta.value;
  if(!entry.photos) entry.photos = [];
  if(!entry.audios) entry.audios = [];
  entry.meta = { dk: journalState.dk, bi: journalState.bi, date: journalState.date };

  const now = new Date();
  entry.updatedAt = now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  journals[key] = entry;
  saveJournals(journals);

  if(!silent){
    const as = document.getElementById('journal-autosave');
    if(as){as.textContent='Salvo às '+entry.updatedAt;as.className='journal-autosave saved';setTimeout(()=>{if(as)as.className='journal-autosave';},2000);}
  }
  updateJournalNavDot();
}

/* ── Salvar e fechar ── */
function journalSaveAndClose(){
  journalAutoSave(true);
  closeJournal();
  toast('Journal salvo');
}

/* ── Fotos ── */
function journalAddPhotos(input){
  if(!journalState) return;
  const {key} = journalState;
  const files = Array.from(input.files);
  if(!files.length) return;

  const entry = journals[key] || {photos:[],audios:[],text:'',meta:{}};
  if(!entry.photos) entry.photos = [];

  /* Preserva texto atual antes do re-render */
  const ta = document.getElementById('journal-ta');
  if(ta) entry.text = ta.value;

  /* BUG-09: processar fotos sequencialmente em vez de concorrentemente.
     O processamento concorrente causava dois problemas:
     1. A checagem do limite de 9 fotos ocorria antes de qualquer onload → todos
        os FileReaders iniciavam antes de qualquer push, ultrapassando o limite.
     2. Se fotos de tamanhos muito diferentes chegassem fora de ordem, o render()
        podia disparar antes de todas as fotos estarem prontas (pending<=0 prematuro).
     Solução: fila de Promises que processa uma foto por vez. */
  /* P-06: redimensionar imagens antes de salvar no journal.
     Uma foto típica de celular (~2-4MB) como base64 = 2.7-5.3MB de string.
     O localStorage tem limite de ~5MB no iOS Safari (principal alvo do app).
     Solução: canvas resize para max 1024px no lado maior + recompressão JPEG 0.82.
     Resultado típico: 2MB → ~180KB. Adiantamos o limite de quota indefinidamente. */
  function resizeAndEncode(file, callback){
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
      const MAX = 1024;
      let {naturalWidth:w, naturalHeight:h} = img;
      if(w > MAX || h > MAX){
        if(w >= h){ h = Math.round(h * MAX / w); w = MAX; }
        else       { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); callback(null); };
    img.src = objectUrl;
  }

  const queue = files.slice(); /* cópia para não mutar o original */
  function processNext(){
    if(!queue.length){
      journals[key] = entry;
      saveJournals(journals);
      const scrollY = document.getElementById('content')?.scrollTop || 0;
      render();
      setTimeout(()=>{ const ct=document.getElementById('content'); if(ct) ct.scrollTo({top:scrollY,behavior:'instant'}); },0);
      updateJournalNavDot();
      return;
    }
    /* Checa o limite dentro do processamento, não antes de iniciar */
    if(entry.photos.length >= 9){
      queue.length = 0; /* descarta fotos restantes */
      journals[key] = entry;
      saveJournals(journals);
      const scrollY = document.getElementById('content')?.scrollTop || 0;
      render();
      setTimeout(()=>{ const ct=document.getElementById('content'); if(ct) ct.scrollTo({top:scrollY,behavior:'instant'}); },0);
      updateJournalNavDot();
      return;
    }
    const file = queue.shift();
    resizeAndEncode(file, dataUrl=>{
      if(dataUrl) entry.photos.push(dataUrl);
      processNext();
    });
  }
  processNext();
  input.value = '';
}

function journalDelPhoto(pi){
  if(!journalState) return;
  const {key} = journalState;
  if(journals[key]&&journals[key].photos){
    const ta = document.getElementById('journal-ta');
    if(ta && journals[key]) journals[key].text = ta.value;
    journals[key].photos.splice(pi,1);
    saveJournals(journals);
    const scrollY = document.getElementById('content')?.scrollTop || 0;
    render();
    setTimeout(()=>{ const ct=document.getElementById('content'); if(ct) ct.scrollTo({top:scrollY,behavior:'instant'}); },0);
  }
}

/* ── Áudio ── */
async function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Gravação não suportada neste dispositivo');return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const recorder = new MediaRecorder(stream);
    recorderState = { active:true, stream, recorder, chunks:[], timer:null, elapsed:0 };
    recorder.ondataavailable = e=>{ if(e.data.size>0) recorderState.chunks.push(e.data); };
    recorder.start(250);

    /* Timer UI */
    recorderState.timer = setInterval(()=>{
      recorderState.elapsed++;
      const m = Math.floor(recorderState.elapsed/60);
      const s = recorderState.elapsed%60;
      const el = document.getElementById('journal-rec-timer');
      if(el) el.textContent = m+':'+(s<10?'0':'')+s;
      if(recorderState.elapsed >= 300){ stopRecording(true); } /* max 5 min */
    },1000);

    /* Preserva texto e re-render */
    if(journalState){
      const ta = document.getElementById('journal-ta');
      if(ta && journals[journalState.key]) journals[journalState.key].text = ta.value;
    }
    const scrollY = document.getElementById('content')?.scrollTop || 0;
    render();
    setTimeout(()=>{ const ct=document.getElementById('content'); if(ct) ct.scrollTo({top:scrollY,behavior:'instant'}); },0);
  } catch(err){
    toast('Acesso ao microfone negado');
  }
}

function stopRecording(save){
  if(!recorderState.active) return;
  clearInterval(recorderState.timer);

  const { recorder, stream, chunks } = recorderState;
  recorderState.active = false;
  recorderState.timer = null;

  if(recorder && recorder.state !== 'inactive'){
    recorder.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(save && chunks.length > 0 && journalState){
        const blob = new Blob(chunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onload = e=>{
          const {key} = journalState;
          const entry = journals[key] || {photos:[],audios:[],text:'',meta:{}};
          if(!entry.audios) entry.audios = [];
          entry.audios.push(e.target.result);
          journals[key] = entry;
          saveJournals(journals);
          render();
          toast('Áudio salvo');
          updateJournalNavDot();
        };
        reader.readAsDataURL(blob);
      } else {
        render();
      }
    };
    recorder.stop();
  } else {
    stream.getTracks().forEach(t=>t.stop());
    render();
  }

  recorderState = { active:false, stream:null, recorder:null, chunks:[], timer:null, elapsed:0 };
}

function journalDelAudio(ai){
  if(!journalState) return;
  const {key} = journalState;
  if(journals[key]&&journals[key].audios){
    const ta = document.getElementById('journal-ta');
    if(ta && journals[key]) journals[key].text = ta.value;
    journals[key].audios.splice(ai,1);
    saveJournals(journals);
    const scrollY = document.getElementById('content')?.scrollTop || 0;
    render();
    setTimeout(()=>{ const ct=document.getElementById('content'); if(ct) ct.scrollTo({top:scrollY,behavior:'instant'}); },0);
  }
}

/* ── Dot de navegação (ponto azul quando há journals) ── */
function updateJournalNavDot(){
  const dot = document.getElementById('journal-nav-dot');
  if(dot) dot.classList.toggle('visible', Object.keys(journals).length > 0);
}

/* ── Guia Journals — lista de todos os journals ── */
/* ── Estado de expansão dos dias na guia Journal ── */
let openJDays = {};

function renderJournals(){
  updateJournalNavDot();

  const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const WEEKDAY_FULL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

  /* ── Agrupa todas as entries por data ── */
  const byDate = {};
  Object.keys(journals).forEach(k=>{
    const e = journals[k];
    const date = e.meta?.date || '';
    if(!date) return;
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push({ key:k, entry:e });
  });

  /* ── Busca ── */
  const searchVal = (_journalSearch||'').toLowerCase();

  /* ── Ordena datas desc ── */
  function toISO(d){ const p=d.split('/'); return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:''; }
  let dates = Object.keys(byDate).sort((a,b)=>toISO(b).localeCompare(toISO(a)));

  /* Filtra por busca (busca dentro de qualquer bloco do dia) */
  if(searchVal){
    dates = dates.filter(date=>{
      return byDate[date].some(({key,entry})=>{
        const blockLabel = (blocks[entry.meta?.dk]||[])[entry.meta?.bi]?.label||'';
        return (entry.text||'').toLowerCase().includes(searchVal)
          || blockLabel.toLowerCase().includes(searchVal)
          || (entry.meta?.dk||'').toLowerCase().includes(searchVal);
      });
    });
  }

  let h = `<div class="sec">Journals</div>`;

  if(Object.keys(byDate).length > 3 || searchVal){
    h += `<input class="jsearch" type="search" placeholder="Buscar nos journals..." value="${searchVal}" oninput="_journalSearch=this.value;render()" autocomplete="off">`;
  }

  if(!dates.length){
    if(searchVal){
      h += `<div class="jlist-empty"><strong>Sem resultados</strong>Tente outro termo de busca.</div>`;
    } else {
      h += `<div class="jlist-empty"><strong>Nenhum journal ainda</strong>Abra um bloco na guia Hoje e toque em "Escrever no journal".</div>`;
    }
    return h;
  }

  dates.forEach((date, dateIdx)=>{
    const entries = byDate[date];
    /* Só o dia mais recente abre por padrão; os demais iniciam fechados */
    const isOpen = openJDays[date] !== undefined ? openJDays[date] : (dateIdx === 0);

    /* Parse da data */
    const parts = date.split('/');
    const dayNum = parts[0]||'—';
    const monthStr = parts[1] ? monthNames[parseInt(parts[1])-1] : '—';
    const year = parts[2]||'';

    /* Descobre o dia da semana a partir da data */
    let weekdayStr = '';
    try{
      const [d,m,y] = parts.map(Number);
      const dt = new Date(y, m-1, d);
      weekdayStr = WEEKDAY_FULL[dt.getDay()];
    }catch{}

    /* Badges de resumo do dia */
    const totalBlocks = entries.length;
    const hasAnyPhoto = entries.some(({entry})=>(entry.photos||[]).length>0);
    const hasAnyAudio = entries.some(({entry})=>(entry.audios||[]).length>0);

    const chevSvg = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;transition:transform var(--dur-base) var(--ease-spring);${isOpen?'transform:rotate(180deg)':''}"><path d="M3 5L7 9L11 5"/></svg>`;

    h += `<div class="jday-card${isOpen?' open':''}">
      <div class="jday-hdr" onclick="openJDays['${date}']=!openJDays['${date}'];render()">
        <div class="jday-date-col">
          <div class="jday-num">${dayNum}</div>
          <div class="jday-month">${monthStr}</div>
        </div>
        <div class="jday-info">
          <div class="jday-weekday">${weekdayStr}</div>
          <div class="jday-meta">${totalBlocks} bloco${totalBlocks!==1?'s':''} · ${year}${hasAnyPhoto?' · 📷':''}${hasAnyAudio?' · 🎙':''}</div>
        </div>
        <div class="jday-right">
          ${chevSvg}
        </div>
      </div>`;

    if(isOpen){
      h += `<div class="jday-body">`;
      entries.forEach(({key, entry})=>{
        const meta = entry.meta||{};
        const block = (blocks[meta.dk]||[])[parseInt(meta.bi)];
        const blockLabel = block?.label || meta.dk || '—';
        const blockType = block?.type || 'custom';
        const preview = (entry.text||'').trim();
        const hasPhotos = (entry.photos||[]).length > 0;
        const hasAudio = (entry.audios||[]).length > 0;
        const hasMood = !!entry.mood;

        h += `<div class="jblock-row" onclick="viewJournalEntry('${key}')">
          <div class="jblock-icon">${BTYPE_ICONS[blockType]||BTYPE_ICONS.custom}</div>
          <div class="jblock-info">
            <div class="jblock-label">${blockLabel}</div>
            <div class="jblock-preview${!preview?' empty':''}">${preview||'Sem anotações'}</div>
          </div>
          <div class="jblock-badges">
            ${hasMood?'<div class="jblock-dot mood"></div>':''}
            ${hasPhotos?'<div class="jblock-dot photo"></div>':''}
            ${hasAudio?'<div class="jblock-dot audio"></div>':''}
          </div>
        </div>`;
      });
      h += `</div>`;
    }

    h += `</div>`;
  });

  return h;
}

/* ── Abre journal de uma entrada passada ── */
function viewJournalEntry(key){
  const e = journals[key];
  if(!e||!e.meta) return;
  const { dk, bi, date } = e.meta;
  journalState = { dk, bi, date, key };
  journalOpen = true;
  render();
  const ct = document.getElementById('content');
  if(ct) ct.scrollTo({top:0,behavior:'instant'});
}

/* ── Integração com saveLog: o autosave já cobre o fluxo de registro ── */

/* ════════════════════════════════════════════════════════════════════════════
   § 12 · BOOT — Inicialização da aplicação
   ────────────────────────────────────────────────────────────────────────────
   Sequência de boot executada uma única vez no carregamento da página.
   Toda inicialização de estado já ocorreu nas seções §1–§11 (declarações e
   let/const executados na ordem do arquivo). O boot apenas aplica aparência,
   dispara o primeiro render e registra listeners de sistema.

   CONTEÚDO:
   · applyAppearance()       — aplica tema/fonte/radius salvos no localStorage.
   · render()                — primeiro render: monta o DOM inicial do app.
   · updateJournalNavDot()   — sincroniza o indicador de journal na nav.
   · _fixViewportHeight()    — corrige altura do #app no iOS Safari (barra de
                               endereço e teclado causam resize do viewport).
   · Listeners de resize/orientationchange — mantém height correto no iOS.
   ════════════════════════════════════════════════════════════════════════════ */

applyAppearance();
render();
updateJournalNavDot();

/* ── Viewport resize listener — corrige altura no iOS Safari ── */
/* No iOS Safari o viewport muda ao recarregar (barra de endereço, teclado).
   Sem este listener, o #app fica com height errado após o reload. */
function _fixViewportHeight(){
  const h = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;
  document.getElementById('app').style.height = h + 'px';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', _fixViewportHeight);
  window.visualViewport.addEventListener('scroll', _fixViewportHeight);
}
window.addEventListener('resize', _fixViewportHeight);
window.addEventListener('orientationchange', function(){
  setTimeout(_fixViewportHeight, 100); /* pequeno delay para o browser terminar o giro */
});
_fixViewportHeight(); /* executa imediatamente no load */
</script>
