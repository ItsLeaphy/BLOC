// ── Migrações incrementais ─────────────────────────────────────────────────
// Cada entrada corresponde a uma versão (índice 0 = migração para versão 1, etc.)
// Recebe o store inteiro e retorna o store modificado.
// NUNCA apague entradas antigas — apenas adicione novas no final.
const MIGRATIONS = [
  // v0 → v1: garante que todo exercício tem o campo 'time' e 'weight'
  (store) => {
    const days = store.blocks || {};
    Object.values(days).forEach(dayBlocks => {
      (dayBlocks || []).forEach(block => {
        (block.exercises || []).forEach(ex => {
          if (ex.time === undefined) ex.time = 0;
          if (ex.weight === undefined) ex.weight = 0;
          if (!Array.isArray(ex.media)) ex.media = [];
        });
      });
    });
    // garante que todo entry do histórico tem exercícios com campos completos
    (store.history || []).forEach(entry => {
      const exList = Array.isArray(entry.exercises) ? entry.exercises
        : (entry.entries || []).flatMap(b => b.exercises || []);
      exList.forEach(ex => {
        if (ex.time === undefined) ex.time = 0;
        if (ex.weight === undefined) ex.weight = 0;
      });
    });
    return store;
  },
  // v1 → v2: (exemplo futuro) adicione aqui quando precisar
  // (store) => { ... return store; },
];

// ── Leitura e migração ─────────────────────────────────────────────────────
function loadStore() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(STORE)); } catch {}

  // Usuário novo: inicializa com defaults na versão atual
  if (!raw) {
    return {
      version: DATA_VERSION,
      blocks: JSON.parse(JSON.stringify(DEFAULT_BLOCKS)),
      history: [],
      goals: JSON.parse(JSON.stringify(DEFAULT_GOALS)),
      appearance: JSON.parse(JSON.stringify(DEFAULT_APPEARANCE)),
    };
  }

  // Compatibilidade retroativa: dados no formato antigo (múltiplas chaves)
  // Se não tem 'version', vieram das chaves bv2_* antigas — consolida
  if (raw.version === undefined) {
    try {
      const oldBlocks = JSON.parse(localStorage.getItem('bv2_blocks'));
      const oldHistory = JSON.parse(localStorage.getItem('bv2_history'));
      const oldGoals = JSON.parse(localStorage.getItem('bv2_goals'));
      const oldAppearance = JSON.parse(localStorage.getItem('bv2_appearance'));
      raw = {
        version: 0,
        blocks: oldBlocks || JSON.parse(JSON.stringify(DEFAULT_BLOCKS)),
        history: oldHistory || [],
        goals: oldGoals || JSON.parse(JSON.stringify(DEFAULT_GOALS)),
        appearance: oldAppearance || JSON.parse(JSON.stringify(DEFAULT_APPEARANCE)),
      };
    } catch {
      raw = { version: 0, blocks: JSON.parse(JSON.stringify(DEFAULT_BLOCKS)), history: [], goals: JSON.parse(JSON.stringify(DEFAULT_GOALS)), appearance: JSON.parse(JSON.stringify(DEFAULT_APPEARANCE)) };
    }
  }

  // Roda apenas as migrações que faltam
  let v = raw.version || 0;
  while (v < DATA_VERSION) {
    if (MIGRATIONS[v]) raw = MIGRATIONS[v](raw);
    v++;
  }
  raw.version = DATA_VERSION;

  // Salva de volta já migrado
  localStorage.setItem(STORE, JSON.stringify(raw));
  return raw;
}

/* ════════════════════════════════════════════════════════════════════════════
   ARQUITETURA DE ESTADO — BLOC
   Leia antes de qualquer alteração nas variáveis ou funções desta seção.
   ════════════════════════════════════════════════════════════════════════════

   VISÃO GERAL
   ───────────
   O app tem três camadas de estado com papéis distintos e fronteiras rígidas:

     1. TEMPLATE PERMANENTE  →  blocks        (localStorage, persiste entre sessões)
     2. SESSÃO DE HOJE       →  todaySession  (localStorage/dia, cache diário)
     3. HISTÓRICO            →  history       (localStorage, snapshots imutáveis)

   O fluxo de dados é UNIDIRECIONAL e NÃO pode ser invertido:

     blocks[todayKey]
         │
         │  deep clone ao iniciar (ou reidratação de todayCache se mesmo dia)
         ▼
     todaySession  ──────────────────────────────────────────────┐
         │  edições do usuário via updExToday()                   │
         │  persiste via saveTodayCache() (chave por data)        │
         ▼                                                        │
     saveLog()  →  history.unshift(snapshot)                     │
                                                                  │
     blocks[todayKey]  ←──  NUNCA recebe dados de todaySession ──┘

   ════════════════════════════════════════════════════════════════════════════
   VARIÁVEIS DE ESTADO — O QUE PODE E O QUE NÃO PODE SER MUTADO
   ════════════════════════════════════════════════════════════════════════════

   blocks  [TEMPLATE PERMANENTE — MUTAÇÃO CONTROLADA]
   ────────────────────────────────────────────────────────────────────────────
   • Estrutura: { "SEG": [BlockObj, ...], "TER": [...], ... }
   • Persiste em localStorage via saveStore() / sv().
   • Representa a SEMANA PADRÃO do usuário — o plano, não a execução.
   • PODE ser mutado SOMENTE pelas funções da guia Semana/Config:
       updExBase, setBlockColor, setBlockType, setBlockIcon,
       confEditBlock, confAddBlock, confAddEx (quando fromSemana=true),
       addMedia, delMedia, delEx, delBlock, reorderBlocks, moveBlock.
   • NUNCA deve ser mutado por código da guia Hoje.
   • TODA função que muta blocks[todayKey] DEVE chamar
     resetTodaySession() imediatamente após o sv() — sem exceção.
   • A guia Hoje lê todaySession, não blocks[todayKey]. Qualquer
     leitura direta de blocks[todayKey] na guia Hoje é um bug.

   history  [SNAPSHOTS IMUTÁVEIS — APPEND-ONLY]
   ────────────────────────────────────────────────────────────────────────────
   • Estrutura: Array de entradas, mais recente primeiro.
     Cada entrada: { date, dayKey, day, blockLabel, blockType, exercises[] }
     exercises[]: [{ name, sets, reps, weight, time, status? }]
   • Persiste em localStorage via sv().
   • Gerado por saveLog() a partir de todaySession — NUNCA a partir de blocks.
   • Entradas nunca são editadas após inserção (append-only).
   • Limite: 180 entradas (history.slice(0,180)).

   todaySession  [CACHE DIÁRIO DA SESSÃO — PERSISTE POR DATA]
   ────────────────────────────────────────────────────────────────────────────
   • Estrutura: Array de BlockObj — mesma forma que blocks[todayKey].
   • Ao iniciar: reidratado de bloc_today_cache se a data bater com hoje.
     Caso contrário, recriado como deep clone de blocks[todayKey].
   • Persiste via saveTodayCache() — chave separada do store principal.
   • Ao virar o dia, o cache expira automaticamente (comparação de data).
   • É o único objeto que a guia Hoje pode ler e mutar.
   • Mutado por: updExToday(), confAddBlockToday(), confAddEx (Hoje).
   • Quando blocks[todayKey] muda (via guia Semana), resetTodaySession()
     re-sincroniza — mas SÓ se todaySessionDirty === false.

   todaySessionDirty  [FLAG DE PROTEÇÃO]
   ────────────────────────────────────────────────────────────────────────────
   • boolean. Inicia false (sessão nova) ou true (sessão reidratada do cache).
   • Enquanto true, resetTodaySession() é um no-op — protege edições
     em andamento de serem sobrescritas por mudanças no template.

   sessionExtraExercises  [EXERCÍCIOS EXTRAS DA SESSÃO]
   ────────────────────────────────────────────────────────────────────────────
   • Estrutura: { "SEG-0": [ExObj, ...], "SEG-1": [...], ... }
   • Exercícios adicionados por confAddEx() quando fromSemana=false.
     Não entram em blocks — existem só para a sessão.
   • Persistidos via saveTodayCache() junto com todaySession.
   • Removidos de sessionExtraExercises após saveLog() para o bloco.

   sessionExStatus  [STATUS INDIVIDUAL POR EXERCÍCIO]
   ────────────────────────────────────────────────────────────────────────────
   • Estrutura: { "SEG-0-Supino reto": "done" | "skipped" }
   • Persistido via saveTodayCache() — expira ao virar o dia.
   • Lido por renderExRow() (fromSemana=false) para classes visuais.
   • Lido por saveLog() para gravar 'status' no snapshot do histórico.

   ════════════════════════════════════════════════════════════════════════════
   FLUXO COMPLETO — SEMANA → HOJE → HISTÓRICO
   ════════════════════════════════════════════════════════════════════════════

   [GUIA SEMANA]
   O usuário edita blocos e exercícios do plano semanal.
   Funções: updExBase, setBlockColor/Type/Icon, confEditBlock, moveBlock, etc.
   Destino: blocks (template) → localStorage.
   Efeito colateral obrigatório: resetTodaySession() se dk === todayKey.

   [GUIA HOJE]
   renderHoje() lê todaySession (cache diário, não blocks[todayKey]).
   renderBlockCard() recebe objetos de todaySession como parâmetro b.
   renderExRow() com fromSemana=false:
     • Lê valores de e (que vem de todaySession) para exibir nos inputs.
     • onchange dos inputs chama updExToday() → muta todaySession + saveTodayCache.
   O usuário aperta "Registrar bloco" → saveLog(dk, bi).

   [saveLog]  ← CRÍTICO — não alterar a fonte de leitura
   1. Lê todaySession[bi] (NÃO blocks[dk][bi]).
   2. Combina com sessionExtraExercises[dk+'-'+bi].
   3. Monta exArr com valores reais do treino + status de sessionExStatus.
   4. Detecta PRs via isPR().
   5. Insere snapshot em history[0] via history.unshift().
   6. Persiste history + saveTodayCache().
   7. Limpa sessionExtraExercises[dk+'-'+bi].

   [HISTÓRICO]
   history é append-only. Leituras: renderHistorico(), getExHistory(),
   isPR(), hasDone (em renderBlockCard), sumário de volume pós-registro.

   ════════════════════════════════════════════════════════════════════════════
   REGRAS CRÍTICAS — NÃO VIOLAR
   ════════════════════════════════════════════════════════════════════════════

   ❌  Nunca ler blocks[todayKey] dentro de renderHoje() ou renderBlockCard()
       quando chamado com prefix='hoje'. Use todaySession.

   ❌  Nunca chamar sv() de código da guia Hoje para mutar blocks.
       Apenas código da guia Semana/Config pode mutar blocks.

   ❌  Nunca passar blocks[dk][bi] para saveLog(). saveLog() usa todaySession[bi].

   ❌  prefix === 'sem' é a ÚNICA condição que autoriza fromSemana=true em modais.
       prefix === 'hoje' (truthy) NÃO autoriza — esse foi o Bug 3A corrigido.

   ❌  Nunca chamar resetTodaySession() depois de todaySessionDirty=true.
       O flag protege automaticamente, mas não chamar explicitamente é igualmente
       importante.

   ✅  Toda função que chama sv() e toca blocks[todayKey] DEVE chamar
       resetTodaySession() imediatamente após. Sem exceção.

   ✅  Toda função que muta todaySession, sessionExStatus ou sessionExtraExercises
       DEVE chamar saveTodayCache() após a mutação.

   ✅  renderExRow() com fromSemana=false usa updExToday como updFn.
       renderExRow() com fromSemana=true usa updExBase (muta blocks).

   ════════════════════════════════════════════════════════════════════════════ */

function saveStore() {
  const store = { version: DATA_VERSION, blocks, history, goals, appearance };
  localStorage.setItem(STORE, JSON.stringify(store));
}

/* ── saveTodayCache — persiste a sessão atual do dia ──────────────────────────
   Salva todaySession, sessionExStatus e sessionExtraExercises em localStorage
   com a data de hoje como chave de validade.
   Chamada após qualquer mutação de estado da sessão:
   updExToday, toggleExStatus, confAddEx (Hoje), saveLog.
   NÃO faz parte do store principal — chave separada para não inflar o payload.
   ─────────────────────────────────────────────────────────────────────────── */
const TODAY_CACHE_STORE = 'bloc_today_cache';
function saveTodayCache() {
  const today = new Date().toLocaleDateString('pt-BR');
  const cache = {
    date: today,
    session: todaySession,
    exStatus: sessionExStatus,
    extraExercises: sessionExtraExercises,
  };
  try { localStorage.setItem(TODAY_CACHE_STORE, JSON.stringify(cache)); } catch(e) {}
}

/* ── loadTodayCache — reidrata a sessão se a data bater ──────────────────────
   Retorna o cache se a data for hoje, null caso contrário (Opção A: troca de dia).
   ─────────────────────────────────────────────────────────────────────────── */
function loadTodayCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(TODAY_CACHE_STORE));
    if (!raw || !raw.date) return null;
    const today = new Date().toLocaleDateString('pt-BR');
    if (raw.date !== today) return null; /* dia diferente → descarta (Opção A) */
    return raw;
  } catch { return null; }
}

// sv() — wrapper de persistência. Sempre salva o store completo.
// Chamada após toda mutação de blocks, history ou goals.
// NÃO chamar para todaySession — ela nunca vai para localStorage.
const sv = (k, v) => { saveStore(); };
const ld = (k, d) => d; // não usada diretamente mais, mas mantida por compatibilidade

// de verdade em memória. localStorage só é atualizado via sv().
const _store = loadStore();

let history   = _store.history;   // SNAPSHOTS — ver documentação acima
let goals     = _store.goals;
let appearance = _store.appearance;

/* ── Sessão de treino — estado temporário ──────────────────────────────────
   sessionExtraExercises: exercícios adicionados só para o treino de hoje.
   Estrutura: { "SEG-0": [ {name,sets,reps,weight,time,media} ] }
   ─────────────────────────────────────────────────────────────────────────── */

/* ── sessionExtraExercises e sessionExStatus são inicializados abaixo,
   após todaySession, porque dependem do cache carregado. ── */
let sessionExtraExercises = {};

/* ── sessionExStatus — SISTEMA DE STATUS INDIVIDUAL POR EXERCÍCIO ─────────────
   ESTRUTURA: { "SEG-0-Supino reto": "done" | "skipped" }
   Persistido via saveTodayCache() com validade de 1 dia.
   ─────────────────────────────────────────────────────────────────────────── */
let sessionExStatus = {};

/* Retorna a chave de status para um exercício */
function exStatusKey(dk, bi, exName) {
  return `${dk}-${bi}-${exName}`;
}

/* Alterna o status de um exercício. Se clicar no mesmo status ativo, remove-o (toggle).
   Aceita: 'done' | 'skipped' */
function toggleExStatus(dk, bi, exName, newStatus) {
  const k = exStatusKey(dk, bi, exName);
  if (sessionExStatus[k] === newStatus) {
    delete sessionExStatus[k]; /* toggle off */
  } else {
    sessionExStatus[k] = newStatus;
  }
  saveTodayCache(); /* persiste status imediatamente */
  render();
  /* Micro-animação no botão clicado — dispara após render */
  setTimeout(() => {
    const safeName = (dk+bi+exName).replace(/[^a-zA-Z0-9]/g,'_');
    const btnId = `exs-${newStatus.slice(0,4)}-${safeName}`;
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      setTimeout(() => btn.classList.remove('pop'), 400);
    }
  }, 20);
}

/* Atualiza todaySession diretamente, sem tocar blocks nem o store principal.
   Chamada exclusivamente pelos inputs da guia Hoje.
   Persiste via saveTodayCache() para sobreviver ao fechamento do app. */
function updExToday(dk, bi, exName, field, val) {
  const ex = todaySession[bi]?.exercises.find(e => e.name === exName);
  if (ex) {
    ex[field] = parseFloat(val) || 0;
    todaySessionDirty = true;
    saveTodayCache(); /* persiste a sessão imediatamente */
  }
}

/* FASE 2 — Estado dos inputs em memória (evita perda ao re-render) */
const inputState={};
function captureInputs(){
  document.querySelectorAll('.inp-g input').forEach(el=>{
    if(el.id)inputState[el.id]=el.value;
  });
}
function getInputVal(id,fallback){
  return inputState[id]!=null?parseFloat(inputState[id])||fallback:fallback;
}

/* FASE 2 — Stepper: ajusta kg direto sem abrir teclado */
function stepWeight(id,delta){
  const el=document.getElementById(id);
  if(!el)return;
  const cur=parseFloat(el.value)||0;
  const nv=Math.max(0,Math.round((cur+delta)*4)/4);
  el.value=nv;
  el.dispatchEvent(new Event('change'));
  /* feedback visual imediato */
  el.style.transition='color 0.1s';
  el.style.color=delta>0?'var(--green)':'var(--red)';
  setTimeout(()=>{el.style.color='';},300);
}

/* FASE 2 — PR detection: verifica se novo peso bate recorde */
function isPR(exName, newWeight){
  if(!newWeight||newWeight<=0)return false;
  const best=Math.max(0,...history.map(h=>{
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    const found=exList.find(e=>e.name===exName);
    return found?found.weight||0:0;
  }));
  return newWeight>best;
}

const todayI=new Date().getDay();
const todayKey=DAYS[todayI];

/* ── todaySession — reidratação com cache diário ─────────────────────────────
   Se o cache do dia existir (mesma data), restaura a sessão persistida.
   Caso contrário (primeiro acesso do dia ou app novo), clona o template.
   todaySessionDirty começa true quando vem do cache — protege de reset acidental.
   ─────────────────────────────────────────────────────────────────────────── */
const _todayCache = loadTodayCache();
let todaySession;
let todaySessionDirty;
if (_todayCache) {
  todaySession         = _todayCache.session;
  sessionExStatus      = _todayCache.exStatus      || {};
  sessionExtraExercises= _todayCache.extraExercises || {};
  todaySessionDirty    = true; /* sessão restaurada — protege de re-clone */
} else {
  todaySession         = JSON.parse(JSON.stringify(blocks[todayKey] || []));
  todaySessionDirty    = false;
}

/* Re-clona a partir do template quando o template muda E a sessão ainda não
   foi editada pelo usuário. Chamar após qualquer mutação em blocks[todayKey]. */
function resetTodaySession() {
  if (!todaySessionDirty) {
    todaySession = JSON.parse(JSON.stringify(blocks[todayKey] || []));
  }
}

  const root=document.documentElement;
  const t=THEMES[a.theme]||THEMES.dark;
  root.style.setProperty('--bg',t.bg);
  root.style.setProperty('--s1',t.s1);
  root.style.setProperty('--s2',t.s2);
  root.style.setProperty('--s3',t.s3);
  root.style.setProperty('--s4',t.s4);
  root.style.setProperty('--tc',t.tc);
  root.style.setProperty('--t2',t.t2);
  root.style.setProperty('--t3',t.t3);
  root.style.setProperty('--ac',a.accentColor);
  /* Bordas e divisores adaptados ao tema claro/escuro */
  const isLight=t.bg>'#888';
  root.style.setProperty('--b1',isLight?'rgba(0,0,0,0.09)':'rgba(255,255,255,0.06)');
  root.style.setProperty('--b2',isLight?'rgba(0,0,0,0.18)':'rgba(255,255,255,0.10)');
  root.style.setProperty('--t4',isLight?'rgba(0,0,0,0.08)':'#1e1e1e');
  /* t3 já vem do tema, mas garantimos que não some em temas claros */

  /* Marca o app com atributo de tema para overrides CSS (QUICK WIN #5) */

  if(isLight){appEl.setAttribute('data-theme-light','');} else {appEl.removeAttribute('data-theme-light');}
  const f=FONT_OPTIONS.find(x=>x.id===a.font)||FONT_OPTIONS[0];

  document.getElementById('app').style.fontFamily=f.val;
  root.style.setProperty('--radius-global',a.borderRadius+'px');
  root.style.setProperty('--r-lg',a.borderRadius+'px');
  const ct=document.getElementById('content');
  const p=a.compactMode?'12px':'16px';
  ct.style.paddingTop=p;
  ct.style.paddingLeft=p;
  ct.style.paddingRight=p;
  ct.style.paddingBottom='96px';
  /* Ajusta o top do sticky journal-hdr para compensar o padding correto */
  root.style.setProperty('--journal-hdr-top', a.compactMode?'-12px':'-16px');
  const speeds={fast:'0.15s',normal:'0.22s',slow:'0.38s'};
  root.style.setProperty('--anim-speed',speeds[a.animSpeed||'normal']||'0.22s');
  root.style.setProperty('--dur-base',speeds[a.animSpeed||'normal']||'0.22s');
}

function toast(m,variant){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.className='toast'; /* reset classes */
  if(variant)t.classList.add(variant);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show','pr-toast'),2400);
}
function ytId(url){const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function isImg(url){return/\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i.test(url)||url.startsWith('data:image')||/imgur\.com|i\.ibb\.co|imgbb\.com|postimg\.cc|pbs\.twimg\.com|media\.discordapp|cdn\.discordapp|gyazo\.com|prnt\.sc/.test(url)}
function openLink(u){window.open(u,'_blank')}
function looksLikeMedia(url){return isImg(url)||!!ytId(url)} /* compat alias */

/* Retorna o último peso/rep/tempo registrado de um exercício (QUICK WIN #2) */
function getLastRegistered(exName){
  for(let h of history){
    const exList=Array.isArray(h.exercises)?h.exercises:(h.entries||[]).flatMap(b=>b.exercises||[]);
    const found=exList.find(e=>e.name===exName);
    if(found)return found;
  }
  return null;
}

function trend(curr,prev){
  if(prev===0||curr===0)return{cls:'eq',sym:'→',txt:'—'};
  const d=curr-prev,p=Math.round(Math.abs(d/prev)*100);
  if(d>0)return{cls:'up',sym:'↑',txt:'+'+p+'%'};
  if(d<0)return{cls:'dn',sym:'↓',txt:'-'+p+'%'};
  return{cls:'eq',sym:'→',txt:'='};
}

function getExHistory(exName){
  const vals=[];
  history.forEach(h=>{
    if(Array.isArray(h.exercises)){
      h.exercises.forEach(e=>{
        if(e.name===exName&&(e.weight>0||e.reps>0))
          vals.push({date:h.date,w:e.weight||0,r:e.reps||0,t:e.time||0});
      });
    } else if(Array.isArray(h.entries)){
      h.entries.forEach(b=>{
        (b.exercises||[]).forEach(e=>{
          if(e.name===exName&&(e.weight>0||e.reps>0))
            vals.push({date:h.date,w:e.weight||0,r:e.reps||0,t:e.time||0});
        });
      });
    }
  });
  return vals;
}

/* -------- MEDIA -------- */
function saveLog(dk,bi){
  const today=new Date().toLocaleDateString('pt-BR');
  /* MUDANÇA 4 — lê de todaySession, sem fallback em blocks */
  const b=todaySession[bi];
  if(!b)return;
  const prs=[];
  /* Combina exercícios de todaySession com extras da sessão */
  const extraEx=sessionExtraExercises[dk+'-'+bi]||[];
  const allExercises=[...b.exercises,...extraEx];
  const exArr=allExercises.map(e=>{
    /* todaySession já contém os valores editados pelo usuário via updExToday.
       Não há fallback em blocks — o que está aqui é o que o usuário treinou. */
    if(isPR(e.name,e.weight||0))prs.push({name:e.name,weight:e.weight||0});
    /* Captura o status individual do exercício (done/skipped/undefined).
       O status pertence à sessionExStatus (memória de sessão) e é gravado
       no snapshot do histórico para analytics futuros.
       NUNCA altera blocks nem todaySession — é append-only no histórico. */
    const exStatus = sessionExStatus[exStatusKey(dk, bi, e.name)];
    const entry = {name:e.name,sets:e.sets,reps:e.reps||0,weight:e.weight||0,time:e.time||0};
    if (exStatus) entry.status = exStatus; /* só inclui se houver marcação explícita */
    return entry;
  });
  history.unshift({date:today,dayKey:dk,day:DAYFULL[DAYS.indexOf(dk)],blockLabel:b.label,blockType:b.type,exercises:exArr});
  if(history.length>180)history=history.slice(0,180);
  sv('bv2_history',history);
  /* Limpa extras da sessão — todaySession permanece (pode registrar outro bloco hoje) */
  delete sessionExtraExercises[dk+'-'+bi];
  saveTodayCache(); /* persiste estado pós-registro */
  /* Feedback contextual rico */
  const totalVol=exArr.reduce((acc,e)=>acc+(e.sets*(e.weight||0)),0);
  if(prs.length>0){
    const prNames=prs.map(p=>`${p.name} ${p.weight}kg`).join(', ');
    toast(`PR — ${prNames}`,'pr-toast');
  } else if(totalVol>0){
    toast(`${b.label} · ${totalVol}kg`);
  } else {
    toast(`${b.label} registrado`);
  }
  render();
  setTimeout(()=>{
    const dots=document.querySelectorAll('.done-dot');
    dots.forEach(d=>{d.style.animation='none';void d.offsetWidth;d.style.animation='donePulse 0.6s var(--ease-spring)';});
  },60);
}

function updEx(dk,bi,en,field,val){
  const ex=blocks[dk][bi].exercises.find(e=>e.name===en);
  if(ex){ex[field]=parseFloat(val)||0;sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();}
}
function updExBase(dk,bi,en,field,val){
  const ex=blocks[dk][bi].exercises.find(e=>e.name===en);
  if(ex){ex[field]=parseFloat(val)||0;sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();toast('Base atualizada');}
}

function addMedia(dk,bi,ei){
  const inp=document.getElementById('mi-'+dk+bi+ei);
  if(!inp)return;const url=inp.value.trim();if(!url)return;
  if(!blocks[dk][bi].exercises[ei].media)blocks[dk][bi].exercises[ei].media=[];
  blocks[dk][bi].exercises[ei].media.push(url);sv('bv2_blocks',blocks);inp.value='';if(dk===todayKey)resetTodaySession();render();
}
function delMedia(dk,bi,ei,mi){
  blocks[dk][bi].exercises[ei].media.splice(mi,1);sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();render();
}

function renderMediaSection(e,dk,bi,ei){
  const mid='mi-'+dk+bi+ei;
  let h=`<div class="ex-media"><div class="media-title">Mídia</div>`;
  (e.media||[]).forEach((url,mi)=>{
    const ytid=ytId(url);const imgLike=isImg(url);
    const typeLabel=ytid?'YT':imgLike?'IMG':'URL';
    h+=`<div class="media-item"><span class="media-type">${typeLabel}</span>`;
    h+=`<span class="media-url" onclick="openLink('${url}')">${url.length>40?url.slice(0,37)+'...':url}</span>`;
    h+=`<span class="media-del" onclick="delMedia('${dk}',${bi},${ei},${mi})">✕</span></div>`;
    if(ytid){
      h+=`<iframe class="media-yt" src="https://www.youtube.com/embed/${ytid}" allowfullscreen loading="lazy"></iframe>`;
    } else {
      h+=`<div class="media-img-wrap"><img class="media-img" src="${url}" onclick="openLightbox('${url}')" onerror="this.parentElement.style.display='none'" loading="lazy"><div class="img-expand-btn" onclick="openLightbox('${url}')">⤢</div></div>`;
    }
  });
  h+=`<div class="media-inp"><input type="text" id="${mid}" placeholder="URL imagem ou YouTube..."><button class="media-add" onclick="addMedia('${dk}',${bi},${ei})">+ Add</button></div></div>`;
  return h;
}

function blockIcon(b){

  return BTYPE_ICONS[b.type]||BTYPE_ICONS.custom;

/* -------- RENDER EXERCISE ROW -------- */
function renderExRow(e,dk,bi,ei,fromSemana){
  const xkey=(fromSemana?'sem':'')+dk+bi+ei;
  const isOpen=openEx[xkey];
  const hasTime=e.time>0;
  const hist=getExHistory(e.name);
  let trndHtml='';
  if(hist.length>=2){
    const last=hist[0],prev=hist[1];
    const val={c:last.w||last.r||last.t,p:prev.w||prev.r||prev.t};
    const t=trend(val.c,val.p);
    trndHtml=`<span class="trnd ${t.cls}">${t.sym} ${t.txt}</span>`;
  }

  /* ── STATUS INDIVIDUAL (só na guia Hoje, nunca em fromSemana) ──────────────
     Lê o status de sessionExStatus sem tocar blocks ou todaySession.
     O status é aplicado como classe CSS na ex-row para feedback visual imediato.
     Ele também é enviado ao histórico via saveLog() (campo 'status' no snapshot).
  ─────────────────────────────────────────────────────────────────────────── */
  const exStatus = !fromSemana ? (sessionExStatus[exStatusKey(dk, bi, e.name)] || null) : null;
  const safeName = (dk+bi+e.name).replace(/[^a-zA-Z0-9]/g,'_');
  const statusClass = exStatus ? ` status-${exStatus}` : '';

  /* Ícones SVG para os botões de status */
  const checkSvg = `<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6l3 3 5-5"/></svg>`;
  const skipSvg  = `<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8M7 3l3 3-3 3"/></svg>`;

  const statusBtns = !fromSemana ? `<div class="ex-status-btns">
    <button id="exs-done-${safeName}"
      class="ex-status-btn done-btn${exStatus==='done'?' active':''}"
      onclick="event.stopPropagation();toggleExStatus('${dk}',${bi},'${e.name}','done')"
      title="${exStatus==='done'?'Desmarcar como feito':'Marcar como feito'}"
    >${checkSvg}</button>
    <button id="exs-skip-${safeName}"
      class="ex-status-btn skip-btn${exStatus==='skipped'?' active':''}"
      onclick="event.stopPropagation();toggleExStatus('${dk}',${bi},'${e.name}','skipped')"
      title="${exStatus==='skipped'?'Desmarcar como pulado':'Marcar como pulado'}"
    >${skipSvg}</button>
  </div>` : '';

  let exD='';
  if(isOpen){
    const updFn=fromSemana?'updExBase':'updExToday';
    const pfx=fromSemana?'b':'';
    /* MUDANÇA 3 — Guia Hoje: lê direto de e (que vem de todaySession), sem fallback em blocks.
       Guia Semana: lê de e (que vem de blocks), comportamento inalterado. */
    const lastReg=!fromSemana?getLastRegistered(e.name):null;
    const dispSets  =e.sets;
    const dispReps  =e.reps||0;
    const dispTime  =e.time||0;
    const dispWeight=e.weight||0;
    /* Label contextual: se há histórico, mostra comparação de carga */
    let contextHint='';
    if(lastReg&&!fromSemana){
      const prevW=lastReg.weight||0;
      const prevR=lastReg.reps||0;
      const prevT=lastReg.time||0;
      const valStr=prevW>0?`${prevW}kg`:(prevT>0?`${prevT}s`:`${prevR}rep`);
      contextHint=`<div style="padding:5px 16px 8px;font-size:9px;color:var(--t2);letter-spacing:0.4px;display:flex;align-items:center;gap:5px;border-top:0.5px solid var(--t4)"><span style="opacity:0.5;font-size:8px">↑</span>última: ${valStr}</div>`;
    }
    const wId=`w${pfx}-${dk+bi+e.name}`;
    exD+=`<div class="ex-inputs-row">
      <div class="inp-g"><input id="s${pfx}-${dk+bi+e.name}" type="number" value="${dispSets}" min="1" onchange="${updFn}('${dk}',${bi},'${e.name}','sets',this.value)"><div class="inp-lbl">séries</div></div>
      ${hasTime
        ?`<div class="inp-g"><input id="t${pfx}-${dk+bi+e.name}" type="number" value="${dispTime}" min="0" onchange="${updFn}('${dk}',${bi},'${e.name}','time',this.value)"><div class="inp-lbl">seg</div></div>`
        :`<div class="inp-g"><input id="r${pfx}-${dk+bi+e.name}" type="number" value="${dispReps}" min="0" onchange="${updFn}('${dk}',${bi},'${e.name}','reps',this.value)"><div class="inp-lbl">reps</div></div>`}
      <div class="inp-g kg-g">
        <div class="kg-stepper">
          <button class="kg-step" onclick="stepWeight('${wId}',-2.5)" ontouchstart="event.preventDefault();stepWeight('${wId}',-2.5)">−</button>
          <input id="${wId}" type="number" value="${dispWeight}" min="0" step="2.5" onchange="${updFn}('${dk}',${bi},'${e.name}','weight',this.value)">
          <button class="kg-step" onclick="stepWeight('${wId}',2.5)" ontouchstart="event.preventDefault();stepWeight('${wId}',2.5)">+</button>
        </div>
        <div class="inp-lbl">kg</div>
      </div>
    </div>${contextHint}`;
    if(fromSemana){
      exD+=`<div style="padding:8px 16px;font-size:10px;color:var(--t2);border-top:0.5px solid var(--t4);letter-spacing:0.3px">Alterações salvas como padrão</div>`;
    }
    exD+=renderMediaSection(e,dk,bi,ei);
  }
  const toggleFn=fromSemana?`toggleExSem('${xkey}','${dk}')`:`toggleEx('${xkey}')`;
  const chevSvg=`<svg viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return`<div class="ex-row${statusClass}">
    <div class="ex-top" onclick="${toggleFn}">
      <div class="ex-name">${e.name}</div>
      <div class="ex-meta">
        ${trndHtml}
        <span class="ex-tag">${e.sets}×${hasTime?(e.time+'s'):(e.reps+' reps')}</span>
        ${e.weight?`<span class="ex-tag">${e.weight}kg</span>`:''}
        ${statusBtns}
        <div class="ex-expand-btn${isOpen?' open-btn':''}">${chevSvg}</div>
      </div>
    </div>
    ${isOpen?`<div class="ex-detail">${exD}</div>`:''}
  </div>`;
}

/* -------- RENDER BLOCK CARD -------- */
function renderBlockCard(b,dk,bi,prefix){
  const key=(prefix||dk)+bi;
  const isOpen=openBlk[key];
  const today=new Date().toLocaleDateString('pt-BR');
  const hasDone=history.some(h=>h.dayKey===dk&&h.date===today&&h.blockLabel===b.label);
  const colorAttr=b.accentColor?` data-color="${b.accentColor}"`:'';
  const fromSemanaCtx = (prefix === 'sem');
  const addExFn=fromSemanaCtx
    ?`openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:true});setTimeout(()=>reopenDay('${dk}'),10)`
    :`openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:false})`;

  let body='';
  if(isOpen){
    b.exercises.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,ei,prefix==='sem');});
    /* Exercícios extras adicionados só para a sessão de hoje */
    if(prefix !== 'sem'){
      const extraEx=sessionExtraExercises[dk+'-'+bi]||[];
      extraEx.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,b.exercises.length+ei,false);});
    }
    body+=`<button class="add-b" onclick="${addExFn}">
      <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
      exercício
    </button>`;
    /* Sumário inline quando bloco já foi registrado hoje (FASE 2) */
    if(hasDone){
      const lastEntry=history.find(h=>h.dayKey===dk&&h.date===new Date().toLocaleDateString('pt-BR')&&h.blockLabel===b.label);
      if(lastEntry){
        const vol=lastEntry.exercises.reduce((a,e)=>a+(e.sets*(e.weight||0)),0);
        const exCount=lastEntry.exercises.length;
        const volStr=vol>0?` · ${vol}kg`:'';
        body+=`<div class="session-summary">${exCount} ex${volStr}</div>`;
      }
    }
    body+=`<button class="sreg btn-ripple${hasDone?' done':''}" onclick="saveLog('${dk}',${bi})">
      ${hasDone?'✓ Registrado — atualizar':'Registrar bloco'}
    </button>`;
    /* Botão Journal — sempre presente quando bloco está aberto */
    const hasJournal=journalHasEntry(dk,bi,new Date().toLocaleDateString('pt-BR'));
    body+=`<button class="journal-btn${hasJournal?' has-entry':''}" onclick="openJournal('${dk}',${bi})">
      <svg viewBox="0 0 16 16"><path d="M3 13V4.5L7 2l4 2.5V13" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 2v11" stroke-width="1.3"/><path d="M3 8h4M11 8h2" stroke-width="1.2" stroke-linecap="round"/></svg>
      ${hasJournal?'Ver journal de hoje':'Escrever no journal'}
    </button>`;
    /* Botão "Promover para Semana" — só aparece em blocos criados apenas para hoje */
    if(b._sessionOnly){
      body+=`<button class="add-b" style="border-style:solid;color:var(--blue);border-color:rgba(96,165,250,0.25)" onclick="promoteBlockToWeek(${bi})">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V1M2 4l4-4 4 4"/></svg>
        Salvar na Semana também
      </button>`;
    }
  }

  const chevSvg=`<svg viewBox="0 0 14 14"><path d="M3 5L7 9L11 5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  /* Subtítulo contextual: quando done mostra volume do dia */
  let subtitle=`${b.exercises.length} exercício${b.exercises.length!==1?'s':''}`;
  if(hasDone){
    const lastEntry=history.find(h=>h.dayKey===dk&&h.date===new Date().toLocaleDateString('pt-BR')&&h.blockLabel===b.label);
    if(lastEntry){
      const vol=lastEntry.exercises.reduce((a,e)=>a+(e.sets*(e.weight||0)),0);
      subtitle=vol>0?`${vol}kg registrado`:'registrado';
    }
  }

  return`<div class="bc${isOpen?' open':''}${hasDone?' done-block':''}${colorAttr}">
    <div class="bh" onclick="toggleBlk('${key}')">
      <div class="bl-icon">${blockIcon(b)}</div>
      <div class="bh-info">
        <div class="bn">${b.label}</div>
        <div class="bs">${subtitle}</div>
      </div>
      <div class="bh-right">
        ${hasDone?'<div class="done-dot"></div>':''}
        <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
      </div>
    </div>
    ${isOpen?`<div class="bbody">${body}</div>`:''}
  </div>`;
}

/* -------- TOGGLE HELPERS -------- */
function toggleEx(k){openEx[k]=!openEx[k];render()}
function toggleBlk(k){openBlk[k]=!openBlk[k];persistOpenBlk();render()}
function toggleHist(k){openHist[k]=!openHist[k];render()}
function toggleExSem(k,dk){openEx[k]=!openEx[k];if(window._lastDayDetail)openDayDetail(window._lastDayDetail)}
function toggleBlkSem(k,dk){openBlk[k]=!openBlk[k];persistOpenBlk();openDayDetail(dk)}

/* -------- MODAL -------- */
function openModal(m){
  modal=m;render();
  if(m.t==='reorderEx')setTimeout(()=>attachExReorderListeners(),30);
}
function closeModal(){modal=null;render()}

function renderModal(){
  if(!modal)return'';
  const m=modal;

  if(m.t==='addEx'){
    return`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>Novo exercício</h3>
      <input type="text" id="m-en" placeholder="Nome do exercício" autocomplete="off">
      <select id="m-et"><option value="reps">Séries + Reps</option><option value="time">Séries + Tempo</option></select>
      <input type="number" id="m-es" placeholder="Séries" value="3" min="1">
      <input type="number" id="m-ev" placeholder="Reps / Segundos" value="10" min="1">
      <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Cancelar</button><button class="m-ok btn-ripple" onclick="confAddEx()">Adicionar</button></div>
    </div></div>`;
  }

  if(m.t==='addBlockToday'){
    const opts=Object.entries(BTYPES).map(([k,v])=>`<div class="blk-opt" onclick="confAddBlockToday('${m.dk}','${k}')">
      <div class="blk-opt-icon">${BTYPE_ICONS[k]}</div>

    </div>`).join('');

      <h3>Novo bloco — só hoje</h3>
      <div style="font-size:11px;color:var(--t2);margin-bottom:12px;letter-spacing:0.2px;line-height:1.6">O bloco será adicionado apenas à sessão de hoje. Você pode promovê-lo para a Semana depois.</div>
      ${opts}
      <div class="m-btns" style="margin-top:8px"><button class="m-cancel" onclick="closeModal()">Cancelar</button></div>
    </div></div>`;
  }

  if(m.t==='addBlock'){
    const opts=Object.entries(BTYPES).map(([k,v])=>`<div class="blk-opt" onclick="confAddBlock('${m.dk}','${k}')">
      <div class="blk-opt-icon">${BTYPE_ICONS[k]}</div>
      <div><div class="blk-opt-name">${v.l}</div><div class="blk-opt-desc">${v.d}</div></div>
    </div>`).join('');
    return`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>Tipo de bloco</h3>${opts}
      <div class="m-btns" style="margin-top:8px"><button class="m-cancel" onclick="closeModal()">Cancelar</button></div>
    </div></div>`;

    const COLOR_HEX={pink:'#f472b6',blue:'#60a5fa',green:'#4ade80',orange:'#fb923c',purple:'#a78bfa',yellow:'#fbbf24',red:'#f87171',teal:'#2dd4bf'};
    const colorBtns=BLOCK_COLORS.map(c=>
      `<div class="blk-color-dot${b.accentColor===c?' selected':''}" style="background:${c?COLOR_HEX[c]:'#2a2a2a'};${!c?'border:0.5px dashed #444':''}" onclick="setBlockColor('${m.dk}',${m.bi},'${c}')" title="${c||'padrão'}"></div>`
    ).join('');
    // SVG icons para seleção de bloco
    const iconBtns=Object.entries(BTYPE_ICONS).map(([k,svg])=>
      `<div class="blk-icon-opt${b.type===k?' selected':''}" onclick="setBlockType('${m.dk}',${m.bi},'${k}')" title="${BTYPES[k]?.l||k}">${svg}</div>`
    ).join('');
    const hasMultipleEx = b.exercises.length > 1;
    return`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>Editar bloco</h3>
      <input type="text" id="m-bl" value="${b.label}" placeholder="Nome do bloco">
      <textarea id="m-bn" placeholder="Notas (opcional)">${b.notes||''}</textarea>
      <div style="font-size:9px;color:var(--t2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-weight:500">Cor</div>
      <div class="blk-color-row">${colorBtns}</div>
      <div style="font-size:9px;color:var(--t2);letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px;font-weight:500">Ícone</div>

      <div style="font-size:9px;color:var(--t2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-weight:500">Exercícios</div>
      ${b.exercises.map((e,ei)=>`<div class="cfg-row"><div><div class="cfg-row-label">${e.name}</div><div class="cfg-row-sub">${e.sets}× ${e.time>0&&e.reps===0?e.time+'s':e.reps+' reps'}${e.weight?' · '+e.weight+'kg':''}</div></div><button class="cfg-del" onclick="delEx('${m.dk}',${m.bi},${ei})">remover</button></div>`).join('')}
      ${hasMultipleEx?`<button class="reorder-btn" style="width:100%;margin-top:8px" onclick="openModal({t:'reorderEx',dk:'${m.dk}',bi:${m.bi}})">
        <svg viewBox="0 0 16 16" style="stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round"><path d="M2 5h12M2 8h12M2 11h12"/></svg>

      </button>`:''}
      <div class="sep"></div>
      <button class="cfg-del" style="width:100%;margin-bottom:12px;font-family:inherit;padding:10px;border-radius:var(--r-md);text-align:center" onclick="delBlock('${m.dk}',${m.bi})">Excluir bloco</button>
      <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Fechar</button><button class="m-ok btn-ripple" onclick="confEditBlock()">Salvar</button></div>

  if(m.t==='reorderEx'){
    const b=blocks[m.dk][m.bi];
    const gripSvg=`<svg viewBox="0 0 10 16" width="10" height="16"><circle cx="3" cy="3" r="1.4" fill="currentColor"/><circle cx="7" cy="3" r="1.4" fill="currentColor"/><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="7" cy="8" r="1.4" fill="currentColor"/><circle cx="3" cy="13" r="1.4" fill="currentColor"/><circle cx="7" cy="13" r="1.4" fill="currentColor"/></svg>`;
    const items=b.exercises.map((e,ei)=>
      `<div class="ex-reorder-item" data-ei="${ei}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border:0.5px solid var(--b1);border-radius:var(--r-md);margin-bottom:6px;cursor:grab;user-select:none;touch-action:none">
        <div style="color:var(--t3);display:flex;align-items:center;flex-shrink:0">${gripSvg}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:var(--fs-body);color:var(--tc);font-weight:var(--fw-normal)">${e.name}</div>
          <div style="font-size:var(--fs-sub);color:var(--t2);margin-top:2px">${e.sets}× ${e.time>0&&e.reps===0?e.time+'s':e.reps+' reps'}${e.weight?' · '+e.weight+'kg':''}</div>
        </div>
      </div>`
    ).join('');
    return`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>Reorganizar exercícios</h3>
      <div style="font-size:11px;color:var(--t2);margin-bottom:12px;letter-spacing:0.2px">Segure e arraste para reordenar</div>
      <div id="ex-reorder-list">${items}</div>
      <div class="m-btns" style="margin-top:12px"><button class="m-cancel" onclick="openModal({t:'editBlock',dk:'${m.dk}',bi:${m.bi}})">← Voltar</button></div>

  if(m.t==='addGoal'){

      <input type="text" id="m-gs" placeholder="Descrição (opcional)">
      <div class="m-btns"><button class="m-cancel" onclick="closeModal()">Cancelar</button><button class="m-ok btn-ripple" onclick="confAddGoal()">Criar</button></div>

  return'';
}

/* -------- MODAL ACTIONS -------- */
function confAddEx(){
  const n=document.getElementById('m-en').value.trim();if(!n)return;
  const tp=document.getElementById('m-et').value;
  const s=parseInt(document.getElementById('m-es').value)||3;
  const v=parseInt(document.getElementById('m-ev').value)||10;
  const ex={name:n,sets:s,reps:tp==='reps'?v:0,weight:0,media:[]};
  if(tp==='time')ex.time=v;
  /* Se chamado da guia Semana (modal.fromSemana), salva no template.
     Caso contrário, salva apenas na sessão de hoje. */
  if(modal.fromSemana){
    blocks[modal.dk][modal.bi].exercises.push(ex);
    sv('bv2_blocks',blocks);
    if(modal.dk===todayKey)resetTodaySession();
  } else {
    const k=modal.dk+'-'+modal.bi;
    if(!sessionExtraExercises[k])sessionExtraExercises[k]=[];
    sessionExtraExercises[k].push(ex);
    saveTodayCache(); /* persiste exercícios extras da sessão */
  }
  closeModal();
}
function confAddBlock(dk,type){
  const bt=BTYPES[type];
  if(!blocks[dk])blocks[dk]=[];
  blocks[dk].push({type,label:bt.l,notes:'',exercises:[]});
  sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();closeModal();toast('Bloco criado');
}

/* Adiciona bloco SOMENTE à sessão de hoje — não toca blocks/template */
function confAddBlockToday(dk,type){
  const bt=BTYPES[type];
  const newBlock={type,label:bt.l,notes:'',exercises:[],_sessionOnly:true};
  todaySession.push(newBlock);
  todaySessionDirty=true;
  saveTodayCache();
  closeModal();
  toast('Bloco adicionado para hoje');
}

/* Promove um bloco de todaySession para o template da Semana */
function promoteBlockToWeek(bi){
  const b=todaySession[bi];
  if(!b)return;
  const clone=JSON.parse(JSON.stringify(b));
  delete clone._sessionOnly;
  if(!blocks[todayKey])blocks[todayKey]=[];
  blocks[todayKey].push(clone);
  sv('bv2_blocks',blocks);
  /* Marca como promovido na sessão (remove flag) */
  delete todaySession[bi]._sessionOnly;
  saveTodayCache();
  toast('Bloco salvo na Semana');
  render();
}
function confEditBlock(){
  const b=blocks[modal.dk][modal.bi];
  b.label=document.getElementById('m-bl').value.trim()||b.label;
  b.notes=document.getElementById('m-bn').value.trim();
  sv('bv2_blocks',blocks);if(modal.dk===todayKey)resetTodaySession();closeModal();toast('Bloco atualizado');
}
function setBlockColor(dk,bi,color){
  blocks[dk][bi].accentColor=color;sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
  if(window._lastDayDetail)setTimeout(()=>openDayDetail(window._lastDayDetail),0);
}
function setBlockType(dk,bi,type){
  blocks[dk][bi].type=type;sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
}
function setBlockIcon(dk,bi,icon){
  blocks[dk][bi].customIcon=icon;sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();
  modal={t:'editBlock',dk,bi};render();
}

/* -------- LIGHTBOX -------- */
function openLightbox(url){
  const lb=document.createElement('div');lb.className='img-lightbox';
  lb.innerHTML=`<img src="${url}" alt=""><div class="img-lightbox-close" onclick="this.parentElement.remove()">✕</div>`;
  lb.onclick=function(e){if(e.target===lb)lb.remove();};
  document.getElementById('app').appendChild(lb);
}

/* -------- CRUD -------- */
function delEx(dk,bi,ei){blocks[dk][bi].exercises.splice(ei,1);sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();render()}
function delBlock(dk,bi){blocks[dk].splice(bi,1);sv('bv2_blocks',blocks);if(dk===todayKey)resetTodaySession();closeModal();toast('Bloco removido')}

function confAddGoal(){
  const n=document.getElementById('m-gn').value.trim();if(!n)return;
  const s=document.getElementById('m-gs').value.trim();
  goals.push({name:n,progress:0,note:s});sv('bv2_goals',goals);closeModal();
}
function updGoal(i,d){goals[i].progress=Math.max(0,Math.min(100,goals[i].progress+d));sv('bv2_goals',goals);render()}
function delGoal(i){goals.splice(i,1);sv('bv2_goals',goals);render()}

/* -------- NAVIGATION -------- */
function nav(p){
  saveScroll();   /* salva scroll da aba atual antes de trocar */
  /* Sai do modo reorganização ao trocar de aba — previne estado órfão */
  if(reorderState.active){reorderState.active=false;reorderState.dk=null;saveStore();}
  /* Fecha journal se estiver aberto */
  if(journalOpen){stopRecording(false);journalOpen=false;journalState=null;}
  page=p;configOpen=false;
  document.getElementById('gear-btn').classList.remove('active');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const nbEl=document.getElementById('nb-'+p);
  if(nbEl)nbEl.classList.add('active');
  render();
}
function toggleConfig(){
  /* Fecha journal se estiver aberto antes de abrir config */
  if(journalOpen){stopRecording(false);journalOpen=false;journalState=null;}
  configOpen=!configOpen;
  document.getElementById('gear-btn').classList.toggle('active',configOpen);
  render();
}

/* -------- PAGE RENDERS -------- */
function renderHoje(){
  /* MUDANÇA 2 — usa todaySession (clone independente), nunca blocks[todayKey].
     Isso garante que edições na guia Hoje não mutam o template permanente. */
  const db=todaySession;
  let h=`<div class="sec">${DAYFULL[todayI]}</div>`;
  if(!db.length)h+=`<div class="empty"><strong>Sem blocos hoje</strong>Vá em Semana para montar o dia.</div>`;
  db.forEach((b,i)=>h+=renderBlockCard(b,todayKey,i,'hoje'));
  h+=`<button class="add-b" onclick="openModal({t:'addBlockToday',dk:'${todayKey}'})">
    <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
    Novo bloco
  </button>`;
  return h;
}

function renderSemana(){
  let h=`<div class="sec">Semana</div><div class="wk-grid">`;
  DAYS.forEach((d,i)=>{
    const db=blocks[d]||[];const isT=i===todayI;
    const blist=db.length?db.map(b=>`<span class="dc-dot"></span>${b.label}`).join('<br>'):`<span style="color:var(--t3)">—</span>`;
    h+=`<div class="dc${isT?' today':''}" onclick="openDayDetail('${d}')">
      <div class="dc-day">${d}${isT?` <span style="width:4px;height:4px;border-radius:50%;background:var(--ac);display:inline-block;margin-left:2px"></span>`:''}</div>
      <div class="dc-blocks">${blist}</div>
    </div>`;
  });
  h+=`</div><div id="dd"></div>`;
  return h;
}

function openDayDetail(dk){
  const db=blocks[dk]||[];const i=DAYS.indexOf(dk);
  const inReorder=reorderState.active&&reorderState.dk===dk;

  let h=`<div class="sep"></div><div class="sec">${DAYFULL[i]}</div>`;

  /* ── Banner de modo reorganização ── */
  if(inReorder){
    h+=`<div class="reorder-banner">
      <div class="reorder-banner-dot"></div>
      <div class="reorder-banner-label">Arraste os blocos para reorganizar</div>
      <button class="reorder-done-btn" onclick="exitReorderMode()">Concluir</button>
    </div>`;
  }

  /* ── Lista de blocos ── */
  h+=`<div id="reorder-list-${dk}">`;
  db.forEach((b,bi)=>{
    if(inReorder){
      /* Modo reorganização: cada bloco vira um item arrastável com handle */
      h+=renderReorderItem(b,bi,dk);
    } else {
      /* Modo normal: comportamento original preservado */
      const key='sem'+dk+bi;
      const isOpen=openBlk[key];
      const colorAttr=b.accentColor?` data-color="${b.accentColor}"`:'';
      let body='';
      if(isOpen){
        b.exercises.forEach((e,ei)=>{body+=renderExRow(e,dk,bi,ei,true);});
        body+=`<button class="add-b" onclick="openModal({t:'addEx',dk:'${dk}',bi:${bi},fromSemana:true});setTimeout(()=>reopenDay('${dk}'),10)">
          <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
          exercício
        </button>`;
        body+=`<button class="sreg" onclick="openModal({t:'editBlock',dk:'${dk}',bi:${bi}})">Editar bloco</button>`;
      }
      const chevSvg=`<svg viewBox="0 0 14 14"><path d="M3 5L7 9L11 5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      h+=`<div class="bc${isOpen?' open':''}${colorAttr}">
        <div class="bh" onclick="toggleBlkSem('${key}','${dk}')">
          <div class="bl-icon">${blockIcon(b)}</div>
          <div class="bh-info"><div class="bn">${b.label}</div><div class="bs">${b.exercises.length} exercício${b.exercises.length!==1?'s':''}</div></div>
          <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
        </div>
        ${isOpen?`<div class="bbody">${body}</div>`:''}
      </div>`;
    }
  });
  h+=`</div>`;

  /* ── Botões de ação abaixo da lista ── */
  if(!inReorder){
    h+=`<button class="add-b" onclick="openModal({t:'addBlock',dk:'${dk}'})">
      <svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke-width="2" stroke-linecap="round"/></svg>
      Novo bloco em ${dk}
    </button>`;
    /* Botão de reorganizar — só aparece quando há mais de 1 bloco */
    if(db.length>1){
      h+=`<button class="reorder-btn" onclick="enterReorderMode('${dk}')">
        <svg viewBox="0 0 16 16" style="stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round">
          <path d="M2 5h12M2 8h12M2 11h12"/>
        </svg>
        Reorganizar blocos
      </button>`;
    }
  }

  const dd=document.getElementById('dd');
  if(dd){
    dd.innerHTML=h;
    /* Scroll automático ao abrir o detalhe do dia */
    setTimeout(()=>{
      const ct=document.getElementById('content');
      if(ct&&dd)ct.scrollTop=dd.offsetTop-16;
    },80);
    /* Se estiver em modo reorder, ativa os listeners de drag */
    if(inReorder){
      setTimeout(()=>attachReorderListeners(dk),30);
    }
  }
  window._lastDayDetail=dk;
}

/* ── Renderiza um item arrastável no modo reorder ── */
function renderReorderItem(b,bi,dk){
  /* Grip: 6 pontos 2×3, preenchidos (fill), sem stroke */
  const gripSvg=`<svg viewBox="0 0 10 16" width="10" height="16">
    <circle cx="3" cy="3"  r="1.4" fill="currentColor"/>
    <circle cx="7" cy="3"  r="1.4" fill="currentColor"/>
    <circle cx="3" cy="8"  r="1.4" fill="currentColor"/>
    <circle cx="7" cy="8"  r="1.4" fill="currentColor"/>
    <circle cx="3" cy="13" r="1.4" fill="currentColor"/>
    <circle cx="7" cy="13" r="1.4" fill="currentColor"/>
  </svg>`;

  return`<div class="bc bc-reorder" data-bi="${bi}" data-dk="${dk}">
    <div class="bh" style="padding-left:0;cursor:inherit;gap:10px">
      <div class="drag-handle">${gripSvg}</div>
      <div class="bl-icon">${blockIcon(b)}</div>
      <div class="bh-info">
        <div class="bn">${b.label}</div>
        <div class="bs">${b.exercises.length} exercício${b.exercises.length!==1?'s':''}</div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   REORDER ENGINE v2 — Drag-and-drop correto
   
   Estratégia: placeholder (não altera dados durante drag)
   ─────────────────────────────────────────────────────────────────
   BUGS CORRIGIDOS vs v1:
   1. Ghost "solto": usava left/top absolutos que ignoravam scroll e
      max-width do #app. Agora usa transform:translate (coordenadas
      relativas ao viewport, sem dependência de offset pai).
   2. Reordenação bugada: v1 alterava blocks[dk] em tempo real e
      recriava o DOM no meio do drag, perdendo referências. Agora
      usa um placeholder estático no DOM — dados só mudam no drop.
   3. Índice errado: v1 acumulava fromIndex a cada frame. Agora
      fromIndex é fixo (índice inicial), toIndex é calculado puro
      comparando posição do cursor com cada item do DOM.
   4. Conflito scroll/drag no iOS: touch-action:none no CSS +
      preventDefault no touchstart/touchmove resolve o conflito.
   ═══════════════════════════════════════════════════════════════════ */

/* Estado interno — resetado a cada drag */
const _drag = {
  active: false,
  el: null,          /* elemento original (some durante drag) */
  ghost: null,       /* clone visual flutuante */
  placeholder: null, /* div que marca o slot de destino */
  dk: null,          /* dia sendo reorganizado */
  fromIndex: -1,     /* índice de origem (fixo durante o drag) */
  toIndex: -1,       /* índice de destino atual */
  offsetX: 0,        /* distância do ponto de toque à borda esquerda do card */
  offsetY: 0,        /* distância do ponto de toque à borda superior do card */
  ghostW: 0,         /* largura do ghost */
  scrollEl: null,
  scrollRaf: null,   /* requestAnimationFrame do auto-scroll */
  clientY: 0,        /* última posição Y conhecida do ponteiro */
};

/* ── Entrada/saída do modo de reorganização ── */
function enterReorderMode(dk){
  reorderState.active=true;
  reorderState.dk=dk;
  Object.keys(openBlk).forEach(k=>{if(k.startsWith('sem'+dk))openBlk[k]=false;});
  openDayDetail(dk);
  toast('Segure e arraste para reorganizar');
}

function exitReorderMode(){
  /* Garante que qualquer drag em andamento é cancelado */
  if(_drag.active)_dragCancel();
  reorderState.active=false;
  reorderState.dk=null;
  saveStore();
  if(window._lastDayDetail)openDayDetail(window._lastDayDetail);
  toast('Ordem salva');
}

/* ═══════════════════════════════════════════════════════════════════
   EXERCISE REORDER ENGINE — drag-and-drop dentro do modal reorderEx
   Mesmo padrão do block reorder, adaptado para exercícios inline no modal.
   Salva imediatamente em blocks ao soltar; modal re-renderiza automaticamente.
   ═══════════════════════════════════════════════════════════════════ */
const _exDrag = {
  active:false, el:null, ghost:null, placeholder:null,
  fromIndex:-1, toIndex:-1, offsetX:0, offsetY:0,
  dk:null, bi:-1, scrollEl:null, scrollRaf:null, clientY:0,
};

function attachExReorderListeners(){
  const list=document.getElementById('ex-reorder-list');
  if(!list)return;
  list.querySelectorAll('.ex-reorder-item').forEach(item=>{
    item.addEventListener('mousedown',_exOnStart,{passive:false});
    item.addEventListener('touchstart',_exOnStart,{passive:false});
  });
}

function _exOnStart(e){
  e.preventDefault();
  const el=e.currentTarget;
  const isTouchEvt=e.type==='touchstart';
  const pt=isTouchEvt?e.touches[0]:e;
  const rect=el.getBoundingClientRect();

  const ph=document.createElement('div');
  ph.className='bc-placeholder';ph.style.height=rect.height+'px';ph.style.borderRadius='var(--r-md)';
  el.parentNode.insertBefore(ph,el.nextSibling);

  const ghost=el.cloneNode(true);
  ghost.style.cssText=`position:fixed;top:0;left:0;z-index:9999;pointer-events:none;will-change:transform;width:${rect.width}px;border-radius:var(--r-md);background:var(--s3);border:1px solid var(--b2);box-shadow:0 12px 32px rgba(0,0,0,0.45);opacity:0.97;transform:translate(${rect.left}px,${rect.top}px)`;
  document.getElementById('app').appendChild(ghost);

  el.style.opacity='0';el.style.pointerEvents='none';

  const m=modal;
  _exDrag.active=true;_exDrag.el=el;_exDrag.ghost=ghost;_exDrag.placeholder=ph;
  _exDrag.fromIndex=parseInt(el.dataset.ei);_exDrag.toIndex=_exDrag.fromIndex;
  _exDrag.offsetX=pt.clientX-rect.left;_exDrag.offsetY=pt.clientY-rect.top;
  _exDrag.dk=m.dk;_exDrag.bi=m.bi;
  _exDrag.scrollEl=document.querySelector('.modal-ov .modal');
  _exDrag.clientY=pt.clientY;

  if(isTouchEvt){
    document.addEventListener('touchmove',_exOnMove,{passive:false});
    document.addEventListener('touchend',_exOnEnd,{passive:false});
    document.addEventListener('touchcancel',_exDragCancel,{passive:false});
  } else {
    document.addEventListener('mousemove',_exOnMove);
    document.addEventListener('mouseup',_exOnEnd);
  }
}

function _exOnMove(e){
  if(!_exDrag.active)return;e.preventDefault();
  const pt=e.type==='touchmove'?e.touches[0]:e;
  const cx=pt.clientX;const cy=pt.clientY;_exDrag.clientY=cy;
  if(_exDrag.ghost){_exDrag.ghost.style.transition='none';_exDrag.ghost.style.transform=`translate(${cx-_exDrag.offsetX}px,${cy-_exDrag.offsetY}px)`;}
  _exCalcDropIndex(cy);
}

function _exOnEnd(e){
  if(!_exDrag.active)return;e.preventDefault();
  _exDrag.active=false;
  document.removeEventListener('touchmove',_exOnMove);document.removeEventListener('touchend',_exOnEnd);
  document.removeEventListener('touchcancel',_exDragCancel);document.removeEventListener('mousemove',_exOnMove);document.removeEventListener('mouseup',_exOnEnd);
  const from=_exDrag.fromIndex;const to=_exDrag.toIndex;
  if(from!==to&&blocks[_exDrag.dk]&&blocks[_exDrag.dk][_exDrag.bi]){
    const arr=blocks[_exDrag.dk][_exDrag.bi].exercises;
    const item=arr.splice(from,1)[0];arr.splice(to,0,item);
    sv('bv2_blocks',blocks);
    if(_exDrag.dk===todayKey)resetTodaySession();
  }
  if(_exDrag.ghost){_exDrag.ghost.remove();_exDrag.ghost=null;}
  if(_exDrag.placeholder){_exDrag.placeholder.remove();_exDrag.placeholder=null;}
  /* Re-abre o modal reorderEx para refletir nova ordem */
  openModal({t:'reorderEx',dk:_exDrag.dk,bi:_exDrag.bi});
  setTimeout(()=>attachExReorderListeners(),30);
}

function _exDragCancel(){
  if(!_exDrag.active)return;_exDrag.active=false;
  document.removeEventListener('touchmove',_exOnMove);document.removeEventListener('touchend',_exOnEnd);
  document.removeEventListener('touchcancel',_exDragCancel);document.removeEventListener('mousemove',_exOnMove);document.removeEventListener('mouseup',_exOnEnd);
  if(_exDrag.ghost){_exDrag.ghost.remove();_exDrag.ghost=null;}
  if(_exDrag.placeholder){_exDrag.placeholder.remove();_exDrag.placeholder=null;}
  if(_exDrag.el){_exDrag.el.style.opacity='';_exDrag.el.style.pointerEvents='';}
  openModal({t:'reorderEx',dk:_exDrag.dk,bi:_exDrag.bi});
  setTimeout(()=>attachExReorderListeners(),30);
}

function _exCalcDropIndex(clientY){
  const list=document.getElementById('ex-reorder-list');
  if(!list||!_exDrag.placeholder)return;
  const items=[...list.querySelectorAll('.ex-reorder-item')].filter(el=>el.style.opacity!=='0');
  if(!items.length)return;
  let newTo=_exDrag.fromIndex;let insertBefore=null;let placed=false;
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(clientY<r.top+r.height*0.5){
      newTo=parseInt(items[i].dataset.ei);
      if(newTo>_exDrag.fromIndex)newTo=newTo-1;
      insertBefore=items[i];placed=true;break;
    }
  }
  if(!placed){
    const last=items[items.length-1];
    newTo=parseInt(last.dataset.ei);
    if(newTo<_exDrag.fromIndex)newTo=newTo+1;
    insertBefore=last.nextSibling;
  }
  if(newTo!==_exDrag.toIndex)_exDrag.toIndex=newTo;
  list.insertBefore(_exDrag.placeholder,insertBefore||null);
}


function attachReorderListeners(dk){
  const list=document.getElementById('reorder-list-'+dk);
  if(!list)return;
  list.querySelectorAll('.bc-reorder').forEach(item=>{
    item.addEventListener('mousedown', _onStart, {passive:false});
    item.addEventListener('touchstart', _onStart, {passive:false});
  });
}

/* ── Início do drag ── */
function _onStart(e){
  if(e.target.closest('button'))return; /* não inicia em botões */
  e.preventDefault();

  const el = e.currentTarget;
  const isTouchEvt = e.type === 'touchstart';
  const pt = isTouchEvt ? e.touches[0] : e;
  const rect = el.getBoundingClientRect();

  /* Cria placeholder com mesma altura do card */
  const ph = document.createElement('div');
  ph.className = 'bc-placeholder';
  ph.style.height = rect.height + 'px';
  el.parentNode.insertBefore(ph, el.nextSibling); /* insere após o original */

  /* Cria ghost (clone visual) posicionado via transform */
  const ghost = el.cloneNode(true);
  ghost.className = 'bc bc-drag-ghost';
  ghost.style.width = rect.width + 'px';
  ghost.style.transform = `translate(${rect.left}px, ${rect.top}px)`;
  /* Anima entrada: escala leve para feedback tátil */
  ghost.style.transition = 'transform 0.12s var(--ease-spring), box-shadow 0.12s ease';
  document.getElementById('app').appendChild(ghost);
  requestAnimationFrame(()=>{
    ghost.style.boxShadow = '0 20px 50px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.4)';
    ghost.style.transition = 'box-shadow 0.12s ease'; /* remove transform transition após entrada */
  });

  /* Esconde o original */
  el.classList.add('bc-dragging');

  /* Inicializa estado */
  _drag.active      = true;
  _drag.el          = el;
  _drag.ghost       = ghost;
  _drag.placeholder = ph;
  _drag.dk          = el.dataset.dk;
  _drag.fromIndex   = parseInt(el.dataset.bi);
  _drag.toIndex     = _drag.fromIndex;
  _drag.offsetX     = pt.clientX - rect.left;
  _drag.offsetY     = pt.clientY - rect.top;
  _drag.ghostW      = rect.width;
  _drag.scrollEl    = document.getElementById('content');
  _drag.clientY     = pt.clientY;

  if(isTouchEvt){
    document.addEventListener('touchmove',  _onMove,  {passive:false});
    document.addEventListener('touchend',   _onEnd,   {passive:false});
    document.addEventListener('touchcancel',_dragCancel,{passive:false});
  } else {
    document.addEventListener('mousemove', _onMove);
    document.addEventListener('mouseup',   _onEnd);
  }
}

/* ── Movimento ── */
function _onMove(e){
  if(!_drag.active)return;
  e.preventDefault();

  const isTouchEvt = e.type === 'touchmove';
  const pt = isTouchEvt ? e.touches[0] : e;
  const cx = pt.clientX;
  const cy = pt.clientY;
  _drag.clientY = cy;

  /* Move o ghost usando transform — correto independente de scroll ou max-width */
  if(_drag.ghost){
    _drag.ghost.style.transition = 'none'; /* sem transition durante movimento */
    _drag.ghost.style.transform = `translate(${cx - _drag.offsetX}px, ${cy - _drag.offsetY}px)`;
  }

  /* Auto-scroll */
  _startAutoScroll();

  /* Calcula novo índice de destino olhando os itens visiveis no DOM */
  _calcDropIndex(cy);
}

/* ── Fim do drag ── */
function _onEnd(e){
  if(!_drag.active)return;
  e.preventDefault();

  _drag.active = false;
  _stopAutoScroll();

  /* Remove listeners globais */
  document.removeEventListener('touchmove',   _onMove);
  document.removeEventListener('touchend',    _onEnd);
  document.removeEventListener('touchcancel', _dragCancel);
  document.removeEventListener('mousemove',   _onMove);
  document.removeEventListener('mouseup',     _onEnd);

  /* Aplica a reordenação nos dados (só agora, no drop) */
  const from = _drag.fromIndex;
  const to   = _drag.toIndex;
  if(from !== to && blocks[_drag.dk]){
    const arr = blocks[_drag.dk];
    const item = arr.splice(from, 1)[0];
    arr.splice(to, 0, item);
    saveStore();
  }

  /* Remove ghost e placeholder e re-renderiza a lista */
  if(_drag.ghost){ _drag.ghost.remove(); _drag.ghost=null; }
  if(_drag.placeholder){ _drag.placeholder.remove(); _drag.placeholder=null; }
  if(_drag.el){ _drag.el.classList.remove('bc-dragging'); _drag.el=null; }

  /* Re-renderiza apenas o detail do dia (não full render) */
  if(window._lastDayDetail)openDayDetail(window._lastDayDetail);
}

/* ── Cancela drag (touchcancel ou saída de emergência) ── */
function _dragCancel(){
  if(!_drag.active)return;
  _drag.active = false;
  _stopAutoScroll();
  document.removeEventListener('touchmove',   _onMove);
  document.removeEventListener('touchend',    _onEnd);
  document.removeEventListener('touchcancel', _dragCancel);
  document.removeEventListener('mousemove',   _onMove);
  document.removeEventListener('mouseup',     _onEnd);
  if(_drag.ghost){ _drag.ghost.remove(); _drag.ghost=null; }
  if(_drag.placeholder){ _drag.placeholder.remove(); _drag.placeholder=null; }
  if(_drag.el){ _drag.el.classList.remove('bc-dragging'); _drag.el=null; }
  /* Cancela sem salvar — ordem original permanece */
  if(window._lastDayDetail)openDayDetail(window._lastDayDetail);
}

/* ── Calcula onde o placeholder deve ficar e move-o ── */
function _calcDropIndex(clientY){
  const list = document.getElementById('reorder-list-'+_drag.dk);
  if(!list||!_drag.placeholder)return;

  /* Coleta itens reais (exclui o original invisível e o placeholder) */
  const items = [...list.querySelectorAll('.bc-reorder:not(.bc-dragging)')];
  if(!items.length)return;

  let newTo = _drag.fromIndex;
  let insertBefore = null; /* referência DOM de onde inserir o placeholder */

  let placed = false;
  for(let i=0;i<items.length;i++){
    const r = items[i].getBoundingClientRect();
    if(clientY < r.top + r.height * 0.5){
      /* Cursor está na metade superior deste item → placeholder fica antes dele */
      newTo = parseInt(items[i].dataset.bi);
      /* Se o item vem depois do from, ajusta para compensar a remoção */
      if(newTo > _drag.fromIndex) newTo = newTo - 1;
      insertBefore = items[i];
      placed = true;
      break;
    }
  }
  if(!placed){
    /* Cursor abaixo de todos → vai para o final */
    const last = items[items.length-1];
    newTo = parseInt(last.dataset.bi);
    if(newTo < _drag.fromIndex) newTo = newTo + 1;
    /* Insere depois do último */
    insertBefore = last.nextSibling;
  }

  /* Move o placeholder no DOM só se a posição mudou */
  if(newTo !== _drag.toIndex){
    _drag.toIndex = newTo;
  }
  /* Sempre move o placeholder para refletir posição visual correta */
  list.insertBefore(_drag.placeholder, insertBefore || null);
}

/* ── Auto-scroll suave usando rAF ── */
function _startAutoScroll(){
  _stopAutoScroll();
  function _frame(){
    if(!_drag.active)return;
    const ct = _drag.scrollEl;
    if(ct){
      const cr = ct.getBoundingClientRect();
      const zone = 72, speed = 10;
      const cy = _drag.clientY;
      if(cy < cr.top + zone){
        ct.scrollTop -= speed * (1 - (cy - cr.top) / zone);
      } else if(cy > cr.bottom - zone){
        ct.scrollTop += speed * (1 - (cr.bottom - cy) / zone);
      }
    }
    _drag.scrollRaf = requestAnimationFrame(_frame);
  }
  _drag.scrollRaf = requestAnimationFrame(_frame);
}
function _stopAutoScroll(){
  if(_drag.scrollRaf){ cancelAnimationFrame(_drag.scrollRaf); _drag.scrollRaf=null; }
}

function renderHistorico(){
  let h=`<div class="sec">Histórico</div>`;
  if(!history.length)h+=`<div class="empty"><strong>Nenhum treino registrado</strong>Abra um bloco em Hoje e registre.</div>`;
  const byDate={};
  history.forEach((entry,hi)=>{
    if(!byDate[entry.date])byDate[entry.date]={date:entry.date,day:entry.day,entries:[],indices:[]};
    byDate[entry.date].entries.push(entry);byDate[entry.date].indices.push(hi);
  });
  Object.values(byDate).slice(0,20).forEach(group=>{
    const groupKey='g'+group.date.replace(/\//g,'');const isOpen=openHist[groupKey];
    let body='';
    if(isOpen){
      group.entries.forEach(entry=>{
        const blocks_to_render=Array.isArray(entry.exercises)
          ?[{label:entry.blockLabel,type:entry.blockType,exercises:entry.exercises}]
          :(entry.entries||[]);
        blocks_to_render.forEach(blk=>{
          body+=`<div style="margin-top:12px;padding-top:12px;border-top:0.5px solid var(--t4)">
            <div style="font-size:10px;font-weight:500;color:var(--t2);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase">${blk.label||entry.blockLabel||''}</div>`;
          (blk.exercises||[]).forEach(e=>{
            let val;
            if(e.time&&e.time>0&&(!e.reps||e.reps===0)){val=`${e.sets}×${e.time}s`;}
            else if(e.weight&&e.weight>0){val=`${e.sets}×${e.reps} · ${e.weight}kg`;}
            else{val=`${e.sets}×${e.reps}`;}
            /* Renderiza badge de status se o exercício foi marcado como done ou skipped.
               O campo 'status' é gravado pelo saveLog() a partir de sessionExStatus.
               null/undefined = nenhuma marcação explícita (exercício neutro). */
            const statusBadge = e.status === 'done'
              ? `<span class="hist-ex-status done">feito</span>`
              : e.status === 'skipped'
              ? `<span class="hist-ex-status skipped">pulado</span>`
              : '';
            body+=`<div class="h-ex-row"><span class="h-ex-name">${e.name}</span>${statusBadge}<span class="h-ex-val">${val}</span></div>`;
          });
          body+=`</div>`;
        });
      });
    }
    const chevSvg=`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5L7 9L11 5"/></svg>`;
    h+=`<div class="hist-c">
      <div class="hist-h" onclick="openHist['${groupKey}']=!openHist['${groupKey}'];render()">
        <div>
          <div class="hist-day">${group.day}</div>
          <div class="hist-date">${group.date} · ${group.entries.length} bloco${group.entries.length!==1?'s':''}</div>
        </div>
        <div class="bchev${isOpen?' o':''}">${chevSvg}</div>
      </div>
      ${isOpen?`<div class="hist-body">${body}</div>`:''}
    </div>`;
  });

  h+=`<div class="sec" style="margin-top:24px">Evolução</div>`;
  const exMap={};
  history.forEach(en=>{
    const exList=Array.isArray(en.exercises)?en.exercises:(en.entries||[]).flatMap(b=>b.exercises||[]);
    exList.forEach(e=>{
      if(!exMap[e.name])exMap[e.name]=[];
      exMap[e.name].push({w:e.weight||0,r:e.reps||0,t:e.time||0,d:en.date});
    });
  });
  const tracked=Object.entries(exMap).filter(([,v])=>v.length>=2);
  if(!tracked.length){
    h+=`<div class="empty"><strong>Sem dados de evolução</strong>Registre ao menos 2 blocos para ver progresso.</div>`;
  } else {
    tracked.forEach(([name,vals])=>{
      const curr=vals[0];const prev=vals[vals.length>4?vals.length-4:vals.length-1];
      const useW=curr.w>0;
      const cv=useW?curr.w:(curr.r||curr.t);
      const pv=useW?prev.w:(prev.r||prev.t);
      if(!cv&&!pv)return;
      const t=trend(cv,pv);
      h+=`<div class="ind-card">
        <div class="ind-ex">${name}</div>
        <div class="ind-cmp">
          <div class="ind-val"><div class="ind-num" style="color:var(--t2)">${pv}${useW?'kg':curr.t?'s':'rep'}</div><div class="ind-lbl">anterior</div></div>
          <div class="ind-arr ${t.cls}">${t.sym}</div>
          <div class="ind-val"><div class="ind-num">${cv}${useW?'kg':curr.t?'s':'rep'}</div><div class="ind-lbl">recente</div></div>
          <div style="flex:1;text-align:right"><span class="trnd ${t.cls}">${t.txt}</span></div>
        </div>
      </div>`;
    });
  }
  return h;
}

function setTheme(id){

}
function setAccentColor(v){appearance.accentColor=v;sv('bv2_appearance',appearance);applyAppearance()}
function setFont(id){appearance.font=id;sv('bv2_appearance',appearance);applyAppearance();render()}
function setBorderRadius(v){appearance.borderRadius=parseInt(v);sv('bv2_appearance',appearance);applyAppearance();render()}

function setAnimSpeed(v){

/* -------- TEMPLATES DO GITHUB -------- */
function loadTemplate(id, url){
  toast('Buscando template...');
  fetch(url)
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data=>{
      // O JSON é {DIA: [...blocos]} — substitui só os blocks
      if(typeof data!=='object'||Array.isArray(data)) throw new Error('Formato inválido');
      blocks = data;
      saveStore();
      render();
      toast('Template carregado');
    })
    .catch(err=>{
      console.error(err);
      toast('Erro ao buscar template — verifique a conexão');
    });
}

/* -------- DATA -------- */
function exportData(){
  // Exporta o store completo incluindo versão — compatível com importData
  const d=JSON.stringify({version:DATA_VERSION,blocks,history,goals,appearance},null,2);
  const b=new Blob([d],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='bloc-backup-v'+DATA_VERSION+'-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Backup exportado');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      // Monta store temporário para rodar migrações
      let v=data.version||0;
      const tempStore={
        version:v,
        blocks:data.blocks||JSON.parse(JSON.stringify(DEFAULT_BLOCKS)),
        history:data.history||[],
        goals:data.goals||JSON.parse(JSON.stringify(DEFAULT_GOALS)),
        appearance:data.appearance||JSON.parse(JSON.stringify(DEFAULT_APPEARANCE)),
      };
      let s=tempStore;
      while(v<DATA_VERSION){if(MIGRATIONS[v])s=MIGRATIONS[v](s);v++;}
      // Atualiza todas as variáveis globais — incluindo appearance
      blocks=s.blocks;history=s.history;goals=s.goals;appearance=s.appearance;
      saveStore();
      localStorage.removeItem(TODAY_CACHE_STORE); /* reseta cache de sessão */
      applyAppearance();
      toast('Dados importados');render();
    }catch(err){toast('Erro ao importar — arquivo inválido');}
  };
  reader.readAsText(file);input.value='';
}

/* Input de importação persistente — fora do ciclo de render para não ser destruído */
(function(){
  if(document.getElementById('import-file-persistent')) return;
  const inp=document.createElement('input');
  inp.type='file';inp.id='import-file-persistent';inp.accept='.json';
  inp.style.display='none';
  inp.addEventListener('change',function(){importData(this);});
  document.body.appendChild(inp);
})();

/* -------- DANGER ZONE -------- */
function initDangerAction(action){dangerConfirmStep[action]=true;render();setTimeout(()=>{const el=document.getElementById('danger-confirm-'+action);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100)}
function cancelDanger(action){delete dangerConfirmStep[action];render()}
function confirmDanger(action){
  const inp=document.getElementById('danger-input-'+action);if(!inp)return;
  const val=inp.value.trim().toUpperCase();
  if(action==='history'&&val!=='APAGAR'){toast('Digite APAGAR para confirmar');return;}
  if(action==='reset'&&val!=='RESETAR'){toast('Digite RESETAR para confirmar');return;}
  delete dangerConfirmStep[action];
  if(action==='history'){history=[];saveStore();toast('Histórico apagado');render();}
  if(action==='reset'){const emptyStore={version:DATA_VERSION,blocks:{},history:[],goals:[],appearance:JSON.parse(JSON.stringify(DEFAULT_APPEARANCE))};localStorage.setItem(STORE,JSON.stringify(emptyStore));localStorage.removeItem(JOURNAL_STORE);localStorage.removeItem(TODAY_CACHE_STORE);location.reload();}
}

/* -------- MAIN RENDER -------- */
function render(){
  captureInputs();   /* captura estado dos inputs ANTES de destruir o DOM */
  saveScroll();      /* salva posição de scroll por aba */
  let h='';
  if(journalOpen)h=renderJournalScreen();
  else if(configOpen)h=renderConfig();
  else if(page==='hoje')h=renderHoje();
  else if(page==='semana')h=renderSemana();
  else if(page==='historico')h=renderHistorico();
  else if(page==='metas')h=renderMetas();
  else if(page==='journals')h=renderJournals();
  const content=document.getElementById('content');
  content.innerHTML=`<div class="page-anim">${h}</div>`;
  /* Modal vai para #modal-root (fora do scroll container) */
  const modalRoot=document.getElementById('modal-root');
  if(modalRoot)modalRoot.innerHTML=renderModal();
  restoreScroll();   /* restaura scroll depois de inserir o conteúdo */
}

/* ══════════════════════════════════════════════════════════════════
   JOURNAL SYSTEM — Integrado ao BLOC
   
   Arquitetura de dados:
   journals = { "[dk]-[bi]-[date]": { text, photos[], audios[], meta, updatedAt } }
   
   Armazenado em localStorage separado ('bloc_journals') para não
   inflar o store principal — journals podem conter base64 de fotos.
   
   A chave é determinística: dia (dk) + índice do bloco (bi) + data.
   Isso vincula cada journal a um bloco específico em um dia específico.
   ══════════════════════════════════════════════════════════════════ */

const JOURNAL_STORE = 'bloc_journals';

/* Carrega todos os journals */
function loadJournals(){
  try{return JSON.parse(localStorage.getItem(JOURNAL_STORE))||{};}catch{return{};}
}
function saveJournals(j){
  try{localStorage.setItem(JOURNAL_STORE,JSON.stringify(j));}catch(e){
    toast('Erro ao salvar — armazenamento cheio');
  }
}

let journals = loadJournals();

/* ── Chave do journal ── */
function journalKey(dk,bi,date){return`${dk}-${bi}-${date}`;}

/* ── Verifica se há entry para bloco/data ── */
function journalHasEntry(dk,bi,date){
  const k=journalKey(dk,bi,date);
  const e=journals[k];
  return !!(e&&(e.text||(e.photos&&e.photos.length)||(e.audios&&e.audios.length)));
}

/* ── Estado da tela Journal ── */
let journalState = null; /* { dk, bi, date, key } */
let journalAutoSaveTimer = null;
let recorderState = { active:false, stream:null, recorder:null, chunks:[], timer:null, elapsed:0 };

/* ── Abre tela Journal — via flag journalOpen, renderiza no #content ── */
function openJournal(dk,bi){
  const date = new Date().toLocaleDateString('pt-BR');
  const key = journalKey(dk,bi,date);
  journalState = { dk, bi, date, key };
  journalOpen = true;
  render();
  /* Scroll ao topo */
  const ct = document.getElementById('content');
  if(ct) ct.scrollTop = 0;
  /* Foca o textarea após animação */
  setTimeout(()=>{
    const ta = document.getElementById('journal-ta');
    if(ta && !journals[key]?.text) ta.focus();
  }, 280);
  updateJournalNavDot();
}

/* ── Fecha tela Journal ── */
function closeJournal(){
  stopRecording(false);
  journalAutoSave(true);
  journalOpen = false;
  journalState = null;
  updateJournalNavDot();
  render();
}
