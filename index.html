<body>
<style>
/* ============================================================
   BLOC — DESIGN SYSTEM v2.2
   Status: ESTABILIZADO
   ────────────────────────────────────────────────────────────
   Fase 1: Tokens + Tipografia          ✓ completo
   Fase 2: Componentes + Navegação      ✓ completo
   Fase 3: Estados + Microinterações    ✓ aplicado
   Fase 4: Refinamento de identidade    ✓ parcial
   ────────────────────────────────────────────────────────────
   Migration layer: tokens antigos mapeados em :root
   Compatibilidade: --br, --br2, --ac2, --accent-color, --anim
   ============================================================ */

/* --- RESET --- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ============================================================
   § TOKENS — Sistema de design unificado
   ────────────────────────────────────────────────────────────
   HIERARQUIA DE TOKENS:
   
   1. SURFACES     --bg → --s1 → --s2 → --s3 → --s4
      Cada camada é +7-10% de claridade. Nunca pule camadas.
   
   2. BORDAS       --b1 (padrão) / --b2 (hover/ativo)
      Sempre 0.5px solid. Reserve 1px para foco/erro.
   
   3. TEXTO        --tc (primário) → --t2 → --t3 → --t4 (ghost)
      Nunca use cor fora desta escala para texto.
   
   4. ESPACAMENTO  --sp-{2|4|8|12|16|24|32|48}
      Grid de 8pt. Nunca use valores fora desta escala.
   
   5. RADIUS       --r-sm(6) / --r-md(10) / --r-lg(14) / --r-xl(20)
      Cards = --r-lg. Elementos internos = --r-md ou --r-sm.
   
   6. TIPOGRAFIA   --fs-display(22) / title(17) / body(14) / sub(12) / micro(10)
      Peso: --fw-normal(400) / --fw-medium(500). Nada mais.
   
   7. MOTION       --dur-fast(0.12s) / base(0.22s) / slow(0.38s)
      + --ease-out / --ease-spring / --ease-sharp
   ============================================================ */
:root{
  /* Surface layers — 3 camadas, diferença perceptível */
  --bg:   #060606; /* Layer 0: fundação */
  --s1:   #0d0d0d; /* Layer 1: cards, header, nav */
  --s2:   #141414; /* Layer 2: interior de cards abertos */
  --s3:   #1c1c1c; /* Layer 3: inputs, botões secundários */
  --s4:   #242424; /* Layer 4: hover states, foco */

  /* Bordas — apenas 2 valores */
  --b1: rgba(255,255,255,0.06);  /* borda padrão */
  --b2: rgba(255,255,255,0.10);  /* borda hover / ativo */

  /* Texto — escala de 4 níveis */
  --tc: #f0f0f0;  /* primário */
  --t2: #707070;  /* secundário */
  --t3: #303030;  /* terciário / decorativo */
  --t4: #1e1e1e;  /* ghost — linhas divisórias */

  /* Acento — branco por padrão, sobreponível */
  --ac: #ffffff;

  /* Cores semânticas */
  --green: #22c55e;
  --red:   #ef4444;
  --yellow:#f59e0b;
  --blue:  #60a5fa;

  /* Tipografia */
  --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;

  /* Escala tipográfica — 5 stops */
  --fs-display: 22px; /* valores grandes, percentuais */
  --fs-title:   17px; /* títulos de seção, nome de bloco aberto */
  --fs-body:    14px; /* nome de exercício, label de card */
  --fs-sub:     12px; /* metadados, subtítulos */
  --fs-micro:   10px; /* labels de input, badges de seção */

  /* Peso — apenas 2 */
  --fw-normal: 400;
  --fw-medium: 500;

  /* Espaçamento — grid de 8pt */
  --sp-2: 2px;
  --sp-4: 4px;
  --sp-8: 8px;
  --sp-12: 12px;
  --sp-16: 16px;
  --sp-24: 24px;
  --sp-32: 32px;
  --sp-48: 48px;

  /* Border radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-pill: 100px;

  /* Animação — motion preciso */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-sharp: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 0.12s;
  --dur-base: 0.22s;
  --dur-slow: 0.38s;

  /* Overrides via JS */
  --radius-global: 14px;
  --anim-speed: 0.22s;
  --font-family: var(--font);

  /* ─── MIGRATION LAYER — aliases de compatibilidade ───────────
     Tokens do sistema anterior mapeados para os novos.
     Mantidos para garantir que CSS externo ou snippets antigos
     ainda funcionem durante a transição.
     TODO: remover após migração completa (v3).
  ─────────────────────────────────────────────────────────── */
  --br:   var(--b1);   /* old: --br  → --b1 */
  --br2:  var(--b2);   /* old: --br2 → --b2 */
  --ac2:  var(--t2);   /* old: --ac2 → --t2 (secondary text) */
  --accent-color: var(--ac); /* old: --accent-color → --ac */
  --anim: var(--dur-base);   /* old: --anim → --dur-base */
}

/* ============================================================
   § STRUCTURE
   ============================================================ */
html,body{
  height:100%; /* necessário para que #app tenha altura definida e #content possa scrollar */
}

body{
  margin:0;
  background:var(--bg);
  font-family:var(--font-family);
  color:var(--tc);
  -webkit-font-smoothing:antialiased;
}

#app{
  font-family:var(--font-family);
  background:var(--bg);
  color:var(--tc);
  height:100vh;  /* fallback para browsers sem svh */
  height:100svh; /* svh é estável no iOS Safari — não usar dvh (instável no reload) */
  max-width:430px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:clip; /* clip não quebra position:sticky dos filhos, ao contrário de hidden */
}

/* ============================================================
   § HEADER
   ============================================================ */
#hdr{
  padding:max(16px, env(safe-area-inset-top)) var(--sp-16) 12px; /* FIX #4: notch/Dynamic Island */
  background:var(--s1);
  border-bottom:0.5px solid var(--b1);
  border-top:1px solid rgba(255,255,255,0.04); /* detalhe premium: linha de acento no topo */
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--sp-8);
  flex-shrink:0;  /* garante que o header não encolha no flex container */
  z-index:50;
  /* position:sticky removido — não funciona dentro de overflow:clip/hidden;
     o header já fica no topo por ser o primeiro filho do flex column */
}

.logo{
  font-size:12px;
  font-weight:var(--fw-medium);
  letter-spacing:5px;
  color:var(--ac);
  text-transform:uppercase;
  flex-shrink:0;
  line-height:1;
}

.hdr-center{
  display:flex;
  align-items:center;
  gap:var(--sp-8);
  flex:1;
  justify-content:center;
}

.date-pill{
  font-size:var(--fs-micro);
  color:var(--t2);
  letter-spacing:0.5px;
  font-weight:var(--fw-normal);
}

.cfg-gear-btn{
  width:32px;
  height:32px;
  border-radius:var(--r-sm);
  background:transparent;
  border:0.5px solid var(--b1);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background var(--dur-fast) var(--ease-sharp),
             border-color var(--dur-fast) var(--ease-sharp),
             transform var(--dur-base) var(--ease-spring);
  color:var(--t2);
}
.cfg-gear-btn:hover{border-color:var(--b2);color:var(--tc);background:var(--s3)}
.cfg-gear-btn:active{transform:scale(0.93)}
.cfg-gear-btn.active{border-color:var(--b2);color:var(--ac);background:var(--s3);transform:rotate(45deg)}
.cfg-gear-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   § NAVIGATION — Bottom bar
   ============================================================ */
#nav{
  position:fixed;  /* fixed: ancora ao viewport, imune a overflow:hidden e dvh instável */
  bottom:0;
  left:50%;        /* centraliza dentro do max-width do #app */
  transform:translateX(-50%);
  width:100%;
  max-width:430px; /* espelha o max-width do #app */
  background:var(--s1);
  border-top:0.5px solid var(--b1);
  display:flex;
  padding:10px 0 max(14px, env(safe-area-inset-bottom));
  z-index:50;
}

.nb{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  padding:6px 4px;
  border:none;
  background:transparent;
  color:var(--t2); /* t3 → t2: t3 é quase invisível em temas claros */
  font-family:var(--font-family);
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-weight:var(--fw-medium);
  transition:color var(--dur-fast) var(--ease-sharp);
  position:relative;
}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--dur-base) var(--ease-spring)}
.nb.active{color:var(--ac)}
.nb.active svg{transform:scale(1.1)}
.nb:active svg{transform:scale(0.9)}

/* Active indicator — dot acima do ícone */
.nb-dot{
  position:absolute;
  top:2px;
  left:50%;
  transform:translateX(-50%);
  width:3px;
  height:3px;
  border-radius:50%;
  background:var(--ac);
  opacity:0;
  transition:opacity var(--dur-base) var(--ease-sharp);
}
.nb.active .nb-dot{opacity:1}

/* ============================================================
   § CONTENT AREA
   ============================================================ */
#content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch; /* scroll inercial em iOS */
  padding:var(--sp-16);
  padding-bottom:96px; /* compensa nav fixed (~64px) + safe area + folga */
  scroll-behavior:smooth;
  overscroll-behavior:contain;
  min-height:0; /* garante que flex:1 não expande além do container pai */
}
#content::-webkit-scrollbar{width:2px}
#content::-webkit-scrollbar-thumb{background:var(--s3);border-radius:1px}

/* ============================================================
   § SECTION LABELS
   ============================================================ */
.sec{
  font-size:var(--fs-micro);
  font-weight:var(--fw-medium);
  color:var(--t3);
  letter-spacing:1.5px; /* Reduzido de 2.5px: audit rule — tracking máximo de 1.5px em 10px */
  text-transform:uppercase;
  margin:var(--sp-24) 0 var(--sp-12);
  display:flex;
  align-items:center;
  gap:var(--sp-8);
}
.sec:first-child{margin-top:0}
.sec::after{
  content:'';
  flex:1;
  height:0.5px;
  background:var(--t4);
}

/* ============================================================
   § BLOCK CARDS (.bc)
   ============================================================ */
.bc{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  margin-bottom:var(--sp-8);
  overflow:hidden;
  transition:border-color var(--dur-base) var(--ease-sharp);
}
.bc.open{border-color:var(--b2);background:var(--s2)} /* bloco aberto sobe para s2: profundidade percetível */

/* Accent left-border colors */
.bc[data-color="pink"]  {border-left:2px solid rgba(244,114,182,0.6)}
.bc[data-color="blue"]  {border-left:2px solid rgba(96,165,250,0.6)}
.bc[data-color="green"] {border-left:2px solid rgba(74,222,128,0.6)}
.bc[data-color="orange"]{border-left:2px solid rgba(251,146,60,0.6)}
.bc[data-color="purple"]{border-left:2px solid rgba(167,139,250,0.6)}
.bc[data-color="yellow"]{border-left:2px solid rgba(251,191,36,0.6)}
.bc[data-color="red"]   {border-left:2px solid rgba(248,113,113,0.6)}
.bc[data-color="teal"]  {border-left:2px solid rgba(45,212,191,0.6)}

/* Block header */
.bh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px var(--sp-16);
  cursor:pointer;
  user-select:none;
  transition:background var(--dur-fast) var(--ease-sharp);
  gap:var(--sp-12);
}
.bh:active{background:rgba(255,255,255,0.04)}

.bl-icon{
  width:32px;
  height:32px;
  border-radius:var(--r-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--s3);
  border:0.5px solid var(--b1);
  transition:transform var(--dur-base) var(--ease-spring);
  color:var(--t2);
}
.bl-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bc.open .bl-icon{transform:scale(1.05);border-color:var(--b2);color:var(--tc)}
.bc.open .bn{font-size:15px} /* Título do bloco aberto — escala para 15px conforme design system */

.bh-info{flex:1;min-width:0}
.bn{
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
  color:var(--tc);
  letter-spacing:-0.1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bs{
  font-size:var(--fs-sub);
  color:var(--t2);
  margin-top:2px;
  font-weight:var(--fw-normal);
}

.bh-right{display:flex;align-items:center;gap:var(--sp-8);flex-shrink:0}

/* Done indicator — QUICK WIN #6: maior presença visual para conclusão */
.done-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  opacity:0.9;
  box-shadow:0 0 6px rgba(34,197,94,0.4);
}

/* ============================================================
   § EXERCISE STATUS SYSTEM
   ────────────────────────────────────────────────────────────
   Estados visuais individuais por exercício na guia Hoje.
   
   REGRA ARQUITETURAL:
   - Esses estados pertencem SOMENTE a sessionExStatus (memória)
     e ao snapshot do histórico. Nunca tocam blocks (template).
   - "done"    → verde: exercício concluído na sessão atual
   - "skipped" → amarelo/opaco: exercício explicitamente pulado
   - null/ausente → aparência padrão (neutro)
   
   UX: os botões de status ficam no header da ex-row,
   visíveis sem precisar expandir o exercício.
   ============================================================ */

/* Botões de status inline na ex-row */
.ex-status-btns{
  display:flex;
  gap:var(--sp-4);
  align-items:center;
  flex-shrink:0;
}

.ex-status-btn{
  width:22px;
  height:22px;
  border-radius:var(--r-sm);
  border:0.5px solid var(--b1);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background var(--dur-fast) var(--ease-sharp),
             border-color var(--dur-fast) var(--ease-sharp),
             transform var(--dur-base) var(--ease-spring),
             opacity var(--dur-fast) var(--ease-sharp);
  color:var(--t3);
  font-size:11px;
  line-height:1;
}
.ex-status-btn:active{ transform:scale(0.88) }

/* Botão "feito" — ativo quando status === 'done' */
.ex-status-btn.done-btn.active{
  background:rgba(34,197,94,0.15);
  border-color:rgba(34,197,94,0.35);
  color:var(--green);
  box-shadow:0 0 0 1px rgba(34,197,94,0.12);
}
.ex-status-btn.done-btn:not(.active):hover{
  background:rgba(34,197,94,0.07);
  border-color:rgba(34,197,94,0.2);
  color:rgba(34,197,94,0.6);
}

/* Botão "pulado" — ativo quando status === 'skipped' */
.ex-status-btn.skip-btn.active{
  background:rgba(245,158,11,0.15);
  border-color:rgba(245,158,11,0.35);
  color:var(--yellow);
  box-shadow:0 0 0 1px rgba(245,158,11,0.12);
}
.ex-status-btn.skip-btn:not(.active):hover{
  background:rgba(245,158,11,0.07);
  border-color:rgba(245,158,11,0.2);
  color:rgba(245,158,11,0.6);
}

/* ── Estado visual da ex-row inteira ── */

/* "feito": nome em verde suave + leve destaque */
.ex-row.status-done .ex-name{
  color:rgba(34,197,94,0.75);
  text-decoration:line-through;
  text-decoration-color:rgba(34,197,94,0.3);
}
.ex-row.status-done .ex-tag{
  opacity:0.45;
}

/* "pulado": opacidade reduzida + nome amarelado + strikethrough */
.ex-row.status-skipped{
  opacity:0.55;
}
.ex-row.status-skipped .ex-name{
  color:rgba(245,158,11,0.75);
  text-decoration:line-through;
  text-decoration-color:rgba(245,158,11,0.3);
}

/* Badge de status no histórico */
.hist-ex-status{
  font-size:9px;
  font-weight:var(--fw-medium);
  letter-spacing:0.8px;
  text-transform:uppercase;
  padding:1px 5px;
  border-radius:var(--r-sm);
  flex-shrink:0;
}
.hist-ex-status.done{
  background:rgba(34,197,94,0.12);
  color:rgba(34,197,94,0.7);
  border:0.5px solid rgba(34,197,94,0.2);
}
.hist-ex-status.skipped{
  background:rgba(245,158,11,0.12);
  color:rgba(245,158,11,0.65);
  border:0.5px solid rgba(245,158,11,0.2);
}

/* Animação leve ao marcar status */
@keyframes statusPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.28)}
  70%{transform:scale(0.92)}
  100%{transform:scale(1)}
}
.ex-status-btn.pop{
  animation:statusPop var(--dur-base) var(--ease-spring);
}

/* Chevron */
.bchev{
  color:var(--t3);
  display:flex;
  align-items:center;
  transition:transform var(--dur-base) var(--ease-spring);
}
.bchev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bchev.o{transform:rotate(180deg)}

/* Block body */
.bbody{
  border-top:0.5px solid var(--t4);
  padding:0 var(--sp-16) var(--sp-16);
  animation:slideDown var(--dur-base) var(--ease-out);
}

/* ============================================================
   § EXERCISE ROWS
   ============================================================ */
.ex-row{
  padding:var(--sp-12) 0;
  border-bottom:0.5px solid var(--t4);
}
.ex-row:last-of-type{border-bottom:none}

.ex-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--sp-8);
  cursor:pointer;
  transition:opacity var(--dur-fast) var(--ease-sharp);
}
.ex-top:active{opacity:0.7}

.ex-name{
  font-size:var(--fs-body);
  color:var(--tc);
  flex:1;
  font-weight:var(--fw-normal);
}

.ex-meta{display:flex;gap:var(--sp-8);align-items:center}

.ex-tag{
  font-size:11px;
  color:var(--t2);
  background:var(--s3);
  padding:2px var(--sp-8);
  border-radius:var(--r-sm);
  border:0.5px solid var(--b1);
  white-space:nowrap;
  font-weight:var(--fw-normal);
}

.ex-expand-btn{
  width:20px;
  height:20px;
  border-radius:var(--r-sm);
  background:transparent;
  border:0.5px solid var(--b1);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background var(--dur-fast) var(--ease-sharp),
             transform var(--dur-base) var(--ease-spring);
  color:var(--t3);
}
.ex-expand-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex-expand-btn:hover{background:var(--s3);color:var(--tc);border-color:var(--b2)}
.ex-expand-btn.open-btn{transform:rotate(180deg);border-color:var(--b2);background:var(--s3);color:var(--tc)}

/* ── Focus state: exercício expandido tem destaque de borda ── */
.ex-detail{
  margin-top:var(--sp-12);
  background:var(--s2);
  border-radius:var(--r-md);
  border:0.5px solid var(--b1);
  overflow:hidden;
  animation:slideDown var(--dur-fast) var(--ease-out);
  border-left:2px solid var(--b2); /* âncora visual de contexto ativo */
}

.ex-inputs-row{
  display:flex;
  gap:var(--sp-8);
  padding:var(--sp-12) var(--sp-16);
  border-bottom:0.5px solid var(--t4);
}

.inp-g{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--sp-4);
}

.inp-g input{
  width:56px;
  background:var(--s3);
  border:0.5px solid var(--b1);
  border-radius:var(--r-sm);
  padding:7px var(--sp-4);
  font-size:var(--fs-body);
  color:var(--tc);
  text-align:center;
  outline:none;
  font-family:inherit;
  font-weight:var(--fw-medium);
  transition:border-color var(--dur-fast) var(--ease-sharp);
  -moz-appearance:textfield;
}
.inp-g input::-webkit-inner-spin-button,
.inp-g input::-webkit-outer-spin-button{-webkit-appearance:none}
.inp-g input:focus{border-color:var(--b2);background:var(--s4)}

/* ── Stepper de kg (FASE 2) — sem teclado para ajustes comuns ── */
.kg-g{gap:2px}
.kg-stepper{
  display:flex;
  align-items:center;
  gap:2px;
}
.kg-step{
  width:22px;
  height:32px;
  background:var(--s4);
  border:0.5px solid var(--b1);
  border-radius:var(--r-sm);
  color:var(--t2);
  font-size:14px;
  line-height:1;
  cursor:pointer;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast) var(--ease-spring);
  flex-shrink:0;
  -webkit-user-select:none;
  user-select:none;
}
.kg-step:active{background:var(--s3);color:var(--tc);transform:scale(0.9)}
.kg-stepper input{
  width:44px; /* ligeiramente menor para acomodar os steppers */
  flex-shrink:0;
}

.inp-lbl{
  font-size:9px;
  color:var(--t3);
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:var(--fw-medium);
}

/* ============================================================
   § TREND BADGES
   ============================================================ */
.trnd{
  display:inline-flex;
  align-items:center;
  gap:2px;
  font-size:10px;
  padding:2px var(--sp-8);
  border-radius:var(--r-pill);
  font-weight:var(--fw-medium);
  letter-spacing:0.2px;
}
.trnd.up{color:var(--green);background:rgba(34,197,94,.08);border:0.5px solid rgba(34,197,94,.18)}
.trnd.dn{color:var(--red);background:rgba(239,68,68,.08);border:0.5px solid rgba(239,68,68,.18)}
.trnd.eq{color:var(--t2);background:var(--s3);border:0.5px solid var(--b1)}

/* ============================================================
   § REGISTER BUTTON
   QUICK WIN #3: CTA principal tinha cor:var(--t2) — cinza. 
   Invertida para cor primária com fundo sutil. 
   ============================================================ */
.sreg{
  width:100%;
  margin-top:var(--sp-16);
  padding:var(--sp-12);
  background:rgba(255,255,255,0.04);
  border:0.5px solid var(--b2);
  border-radius:var(--r-md);
  color:var(--tc);
  font-size:var(--fs-sub);
  cursor:pointer;
  font-family:inherit;
  font-weight:var(--fw-medium);
  letter-spacing:1px;
  text-transform:uppercase;
  transition:all var(--dur-base) var(--ease-sharp),
             transform var(--dur-fast) var(--ease-spring);
}
.sreg:hover{background:rgba(255,255,255,0.08);color:var(--tc);border-color:var(--b2)}
.sreg:active{transform:scale(0.96)} /* slight haptic */
.sreg.done{
  border-color:rgba(34,197,94,0.35);
  color:var(--green);
  background:rgba(34,197,94,0.06);
}

/* ============================================================
   § ADD BUTTONS
   ============================================================ */
.add-b{
  display:flex;
  align-items:center;
  gap:var(--sp-8);
  background:transparent;
  border:0.5px dashed var(--t4);
  border-radius:var(--r-md);
  padding:10px var(--sp-16);
  cursor:pointer;
  color:var(--t3);
  font-size:var(--fs-sub);
  font-family:inherit;
  width:100%;
  margin-top:var(--sp-8);
  transition:border-color var(--dur-fast) var(--ease-sharp),
             color var(--dur-fast) var(--ease-sharp),
             transform var(--dur-fast) var(--ease-spring);
  font-weight:var(--fw-medium);
  letter-spacing:0.5px;
}
.add-b:hover{border-color:var(--t2);color:var(--t2)}
.add-b:active{transform:scale(0.98)}
.add-b svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ============================================================
   § WEEK GRID
   ============================================================ */
.wk-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--sp-8);
}

.dc{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  padding:var(--sp-12);
  cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease-sharp),
             transform var(--dur-base) var(--ease-spring);
}
.dc:hover{border-color:var(--b2)}
.dc:active{transform:scale(0.97)}
.dc.today{border-color:var(--b2)}

.dc-day{
  font-size:var(--fs-micro);
  font-weight:var(--fw-medium);
  color:var(--t2);
  letter-spacing:2px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:var(--sp-8);
  margin-bottom:var(--sp-8);
}
.dc.today .dc-day{color:var(--tc)}

.dc-dot{
  display:inline-block;
  width:3px;
  height:3px;
  border-radius:50%;
  background:var(--t3);
  margin-right:var(--sp-4);
  vertical-align:middle;
}
.dc.today .dc-dot{background:var(--t2)}

.dc-blocks{
  font-size:var(--fs-sub);
  color:var(--t2); /* t3 (#303030) era imperceptível; t2 (#707070) é legível */
  line-height:1.9;
}

/* ============================================================
   § HISTORY CARDS
   ============================================================ */
.hist-c{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  margin-bottom:var(--sp-8);
  overflow:hidden;
}

.hist-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--sp-12) var(--sp-16);
  cursor:pointer;
  transition:background var(--dur-fast) var(--ease-sharp);
}
.hist-h:active{background:rgba(255,255,255,0.04)}

.hist-date{font-size:11px;color:var(--t2);letter-spacing:0.3px;margin-top:2px}
.hist-day{font-size:var(--fs-body);font-weight:var(--fw-medium);color:var(--tc)}

.hist-body{
  padding:0 var(--sp-16) var(--sp-16);
  border-top:0.5px solid var(--t4);
  animation:slideDown var(--dur-base) var(--ease-out);
}

.h-ex-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--sp-8) 0;
  border-bottom:0.5px solid var(--t4);
  font-size:var(--fs-sub);
}
.h-ex-row:last-child{border-bottom:none}
.h-ex-name{color:var(--t2);flex:1}
.h-ex-val{color:var(--tc);font-weight:var(--fw-medium)}

/* ============================================================
   § PROGRESS / INDICATOR CARDS
   ============================================================ */
.ind-card{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  padding:var(--sp-16);
  margin-bottom:var(--sp-8);
}
.ind-ex{
  font-size:10px; /* Sobrescreve --fs-sub intencionalmente: labels de indicador são sempre 10px */
  font-weight:var(--fw-medium);
  color:var(--t2);
  margin-bottom:var(--sp-12);
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.ind-cmp{display:flex;align-items:center;gap:var(--sp-16)}
.ind-val{text-align:center}
.ind-num{
  font-size:var(--fs-display);
  font-weight:var(--fw-medium);
  color:var(--tc);
  letter-spacing:-0.5px;
  line-height:1;
}
.ind-lbl{
  font-size:9px;
  color:var(--t3);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-top:var(--sp-4);
}
.ind-arr{font-size:18px;color:var(--t3)}
.ind-arr.up{color:var(--green)}
.ind-arr.dn{color:var(--red)}

/* ============================================================
   § GOALS CARDS
   ============================================================ */
.goal-c{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  padding:var(--sp-16);
  margin-bottom:var(--sp-8);
}
.goal-h{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:var(--sp-12);
  gap:var(--sp-8);
}
.goal-n{
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
  color:var(--tc);
}
.goal-pct{
  font-size:var(--fs-display);
  font-weight:var(--fw-medium);
  color:var(--ac);
  letter-spacing:-1px; /* números grandes ficam mais densos com tracking negativo */
  line-height:1;
  flex-shrink:0;
}

.goal-bar-bg{
  background:var(--s3);
  border-radius:var(--r-pill);
  height:5px; /* 3px → 5px: perceptível em mobile sem exagero */
  overflow:hidden;
  margin-bottom:var(--sp-12);
}
.goal-bar-f{
  height:100%;
  background:var(--ac);
  border-radius:var(--r-pill);
  transition:width 0.6s var(--ease-out);
  opacity:0.9;
}

.prog-bar-bg{
  background:var(--s3);
  border-radius:var(--r-pill);
  height:5px;
  overflow:hidden;
  margin-bottom:var(--sp-8);
}
.prog-bar-f{
  height:100%;
  background:var(--ac);
  border-radius:var(--r-pill);
  transition:width 0.6s var(--ease-out);
  opacity:0.9;
}
.prog-vals{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--t3);
}

.goal-btns{display:flex;gap:var(--sp-4)}
.goal-btn{
  flex:1;
  padding:6px;
  background:transparent;
  border:0.5px solid var(--b1);
  border-radius:var(--r-sm);
  color:var(--t2);
  font-size:11px;
  cursor:pointer;
  font-family:inherit;
  font-weight:var(--fw-medium);
  transition:all var(--dur-fast) var(--ease-sharp),
             transform var(--dur-fast) var(--ease-spring);
}
.goal-btn:hover{background:var(--s3);color:var(--tc);border-color:var(--b2)}
.goal-btn:active{transform:scale(0.93)}

/* ============================================================
   § PROGRESS CARDS (generic)
   ============================================================ */
.prog-c{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  padding:var(--sp-16);
  margin-bottom:var(--sp-8);
}
.prog-n{
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
  color:var(--tc);
  margin-bottom:2px;
}
.prog-sub{font-size:var(--fs-sub);color:var(--t2)}

/* ============================================================
   § EMPTY STATES
   ============================================================ */
.empty{
  text-align:center;
  color:var(--t2);
  font-size:var(--fs-sub);
  padding:var(--sp-48) var(--sp-16);
  line-height:2;
  letter-spacing:0.2px;
}
.empty strong{
  display:block;
  font-size:16px; /* ligeiramente maior que --fs-body para dar peso ao estado vazio */
  color:var(--tc);
  font-weight:var(--fw-medium);
  margin-bottom:var(--sp-4);
}

/* ============================================================
   § SEPARATORS
   ============================================================ */
.sep{height:0.5px;background:var(--t4);margin:var(--sp-16) 0}

/* ============================================================
   § MODALS — Bottom Sheet
   ============================================================ */
.modal-ov{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  animation:fadeIn var(--dur-base) var(--ease-sharp);
}

.modal{
  background:var(--s1);
  border:0.5px solid var(--b2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--sp-24) var(--sp-16) max(var(--sp-32), env(safe-area-inset-bottom));
  width:100%;
  max-height:88%;
  overflow-y:auto;
  animation:modalIn var(--dur-slow) var(--ease-spring);
  scrollbar-width:thin;
  scrollbar-color:var(--s3) transparent;
}
.modal::-webkit-scrollbar{width:2px}
.modal::-webkit-scrollbar-track{background:transparent}
.modal::-webkit-scrollbar-thumb{background:var(--s3);border-radius:1px}

/* Modal drag handle */
.modal::before{
  content:'';
  display:block;
  width:36px;
  height:3px;
  border-radius:var(--r-pill);
  background:var(--s4);
  margin:0 auto var(--sp-24);
}

.modal h3{
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
  color:var(--tc);
  margin-bottom:var(--sp-16);
  letter-spacing:-0.1px;
}

.modal input,
.modal select,
.modal textarea{
  width:100%;
  background:var(--s2);
  border:0.5px solid var(--b1);
  border-radius:var(--r-md);
  padding:var(--sp-12);
  font-size:var(--fs-body);
  color:var(--tc);
  outline:none;
  margin-bottom:var(--sp-8);
  font-family:inherit;
  font-weight:var(--fw-normal);
  transition:border-color var(--dur-fast) var(--ease-sharp);
  -webkit-appearance:none;
}
.modal input:focus,
.modal select:focus,
.modal textarea:focus{border-color:var(--b2);background:var(--s3)}
.modal textarea{resize:none;min-height:72px;line-height:1.5}
.modal select option{background:var(--s1)}
.modal input::placeholder{color:var(--t3)}
.modal input::-webkit-input-placeholder{color:var(--t3)}

.m-btns{display:flex;gap:var(--sp-8);margin-top:var(--sp-8)}

.m-ok{
  flex:1;
  padding:12px;
  background:var(--ac);
  border:none;
  border-radius:var(--r-md);
  color:#000;
  cursor:pointer;
  font-family:inherit;
  font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  letter-spacing:0.5px;
  transition:opacity var(--dur-fast),transform var(--dur-fast) var(--ease-spring);
}
.m-ok:hover{opacity:0.88}
.m-ok:active{transform:scale(0.97)}

.m-cancel{
  flex:1;
  padding:12px;
  background:transparent;
  border:0.5px solid var(--b1);
  border-radius:var(--r-md);
  color:var(--t2);
  cursor:pointer;
  font-family:inherit;
  font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  transition:all var(--dur-fast) var(--ease-sharp);
}
.m-cancel:hover{border-color:var(--b2);color:var(--tc)}

/* ============================================================
   § BLOCK TYPE PICKER (modal)
   ============================================================ */
.blk-opt{
  display:flex;
  align-items:center;
  gap:var(--sp-12);
  padding:12px;
  border-radius:var(--r-md);
  cursor:pointer;
  transition:background var(--dur-fast) var(--ease-sharp);
}
.blk-opt:hover{background:var(--s3)}
.blk-opt:active{background:var(--s4)}

.blk-opt-icon{
  width:36px;
  height:36px;
  border-radius:var(--r-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--s3);
  border:0.5px solid var(--b1);
  flex-shrink:0;
  color:var(--t2);
}
.blk-opt-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.blk-opt-name{font-size:var(--fs-body);font-weight:var(--fw-medium);color:var(--tc)}
.blk-opt-desc{font-size:var(--fs-sub);color:var(--t2);margin-top:2px}

/* ============================================================
   § BLOCK CUSTOMIZATION
   ============================================================ */
.blk-color-row{display:flex;gap:var(--sp-8);flex-wrap:wrap;margin-top:var(--sp-8)}
.blk-color-dot{
  width:22px;
  height:22px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
  transition:all var(--dur-base) var(--ease-spring);
}
.blk-color-dot:hover{transform:scale(1.2)}
.blk-color-dot.selected{border-color:var(--ac);transform:scale(1.15)}

.blk-icon-row{display:flex;gap:var(--sp-8);flex-wrap:wrap;margin-top:var(--sp-8)}
.blk-icon-opt{
  width:32px;
  height:32px;
  border-radius:var(--r-sm);
  background:var(--s3);
  border:0.5px solid var(--b1);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all var(--dur-base) var(--ease-spring);
  color:var(--t2);
}
.blk-icon-opt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.blk-icon-opt:hover{border-color:var(--b2);transform:scale(1.1);color:var(--tc)}
.blk-icon-opt.selected{border-color:var(--ac);background:var(--s4);color:var(--ac)}

/* ============================================================
   § CONFIG PANEL
   ============================================================ */
.cfg-tabs{
  display:flex;
  gap:var(--sp-4);
  margin-bottom:var(--sp-16);
  background:var(--s2);
  border-radius:var(--r-md);
  padding:3px;
  border:0.5px solid var(--b1);
}
.cfg-tab{
  flex:1;
  padding:8px 4px;
  background:transparent;
  border:none;
  border-radius:var(--r-sm);
  color:var(--t2);
  font-size:11px;
  letter-spacing:0.3px;
  cursor:pointer;
  font-family:inherit;
  font-weight:var(--fw-medium);
  transition:all var(--dur-base) var(--ease-sharp);
  text-align:center;
}
.cfg-tab.active{background:var(--s3);color:var(--tc);border:0.5px solid var(--b2)}

.cfg-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:0.5px solid var(--t4);
}
.cfg-row:last-child{border-bottom:none}
.cfg-row-label{font-size:var(--fs-body);color:var(--tc)}
.cfg-row-sub{font-size:var(--fs-micro);color:var(--t2);margin-top:2px}

.cfg-del{
  font-size:11px;
  color:var(--red);
  cursor:pointer;
  padding:5px 10px;
  border-radius:var(--r-sm);
  border:0.5px solid rgba(239,68,68,.2);
  background:rgba(239,68,68,.04);
  font-family:inherit;
  transition:all var(--dur-fast) var(--ease-sharp);
  font-weight:var(--fw-medium);
}
.cfg-del:hover{background:rgba(239,68,68,.10)}

/* Appearance settings */
.ap-section{margin-bottom:var(--sp-24)}
.ap-title{
  font-size:var(--fs-micro);
  font-weight:var(--fw-medium);
  color:var(--t3);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:var(--sp-12);
}
.ap-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:0.5px solid var(--t4);
}
.ap-row:last-child{border-bottom:none}
.ap-label{font-size:var(--fs-body);color:var(--tc)}
.ap-sub{font-size:var(--fs-micro);color:var(--t2);margin-top:2px}
.ap-control{display:flex;align-items:center;gap:var(--sp-8)}

.color-swatch-wrap{
  position:relative;
  width:28px;
  height:28px;
  border-radius:var(--r-sm);
  border:0.5px solid var(--b2);
  overflow:hidden;
  cursor:pointer;
}
.color-swatch-wrap input[type=color]{
  width:200%;height:200%;margin:-50%;
  border:none;cursor:pointer;background:none;opacity:0;position:absolute
}

.ap-select{
  background:var(--s3);
  border:0.5px solid var(--b1);
  border-radius:var(--r-sm);
  padding:5px 8px;
  font-size:11px;
  color:var(--tc);
  outline:none;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}
.ap-select option{background:var(--s1)}
.ap-slider{width:90px;accent-color:var(--ac);cursor:pointer}

/* ── Session summary inline — FASE 2 (telemetria pós-registro) ── */
.session-summary{
  margin-top:var(--sp-8);
  padding:6px var(--sp-12);
  background:rgba(34,197,94,0.05);
  border:0.5px solid rgba(34,197,94,0.15);
  border-radius:var(--r-sm);
  font-size:10px;
  color:var(--green);
  letter-spacing:0.8px;
  font-weight:var(--fw-medium);
  text-align:center;
  opacity:0.85;
}
.theme-swatch-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--sp-8);
  margin-bottom:var(--sp-8);
}
.preset-group-label{
  font-size:9px;
  font-weight:var(--fw-medium);
  color:var(--t2);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:var(--sp-12) 0 var(--sp-8);
}
.theme-swatch{
  border:none;
  padding:0;
  cursor:pointer;
  border-radius:var(--r-md);
  overflow:hidden;
  outline:2px solid transparent;
  outline-offset:2px;
  transition:outline-color var(--dur-fast) var(--ease-sharp),
             transform var(--dur-fast) var(--ease-spring);
  background:transparent;
  font-family:inherit;
}
.theme-swatch:active{transform:scale(0.94)}
.theme-swatch-active{outline-color:var(--ac)}
.sw-preview{
  position:relative;
  height:44px;
  overflow:hidden;
}
.sw-bg{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:5px 5px 0;
  gap:3px;
}
.sw-card{
  height:22px;
  flex:1;
  border-radius:3px;
  border:0.5px solid;
  opacity:0.9;
}
.sw-card2{flex:1.4}
.sw-dot{
  position:absolute;
  top:6px;
  right:6px;
  width:7px;
  height:7px;
  border-radius:50%;
}
.sw-name{
  font-size:10px;
  font-weight:500;
  padding:4px 6px;
  text-align:center;
  letter-spacing:0.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
/* Legado — mantido para compatibilidade */
.preset-btn{
  padding:10px 6px;
  border-radius:var(--r-md);
  border:0.5px solid var(--b1);
  background:var(--s2);
  cursor:pointer;
  font-size:11px;
  color:var(--t2);
  font-family:inherit;
  text-align:center;
  transition:all var(--dur-fast) var(--ease-sharp);
  font-weight:var(--fw-medium);
  letter-spacing:0.3px;
}
.preset-btn:hover{border-color:var(--b2);color:var(--tc)}
.preset-btn.active-preset{border-color:var(--ac);color:var(--ac)}

/* ============================================================
   § TOGGLE SWITCH
   ============================================================ */
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{
  position:absolute;cursor:pointer;inset:0;
  background:var(--s3);border-radius:var(--r-pill);
  transition:background var(--dur-base) var(--ease-sharp);
  border:0.5px solid var(--b1);
}
.toggle-slider:before{
  position:absolute;content:"";
  height:16px;width:16px;left:2px;bottom:2px;
  background:var(--t2);border-radius:50%;
  transition:transform var(--dur-base) var(--ease-spring),background var(--dur-base);
}
.toggle input:checked+.toggle-slider{background:rgba(255,255,255,0.12);border-color:var(--b2)}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px);background:var(--ac)}

/* ============================================================
   § DATA BUTTONS
   ============================================================ */
.data-btn{
  width:100%;
  padding:12px var(--sp-16);
  background:transparent;
  border:0.5px solid var(--b1);
  border-radius:var(--r-md);
  color:var(--tc);
  font-size:var(--fs-sub);
  cursor:pointer;
  font-family:inherit;
  font-weight:var(--fw-medium);
  letter-spacing:0.5px;
  margin-bottom:var(--sp-8);
  text-align:left;
  transition:all var(--dur-fast) var(--ease-sharp);
}
.data-btn:hover{background:var(--s3);border-color:var(--b2)}

/* ============================================================
   § DANGER ZONE
   ============================================================ */
.danger-confirm{
  background:rgba(239,68,68,.04);
  border:0.5px solid rgba(239,68,68,.18);
  border-radius:var(--r-md);
  padding:var(--sp-16);
  margin-top:var(--sp-8);
  animation:slideDown var(--dur-base) var(--ease-out);
}
.danger-confirm-title{
  font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  color:var(--red);
  margin-bottom:var(--sp-8);
}
.danger-confirm-msg{
  font-size:var(--fs-sub);
  color:var(--t2);
  margin-bottom:var(--sp-12);
  line-height:1.6;
}
.danger-confirm-input{
  width:100%;
  background:var(--s2);
  border:0.5px solid rgba(239,68,68,.2);
  border-radius:var(--r-sm);
  padding:10px var(--sp-12);
  font-size:var(--fs-body);
  color:var(--tc);
  outline:none;
  font-family:inherit;
  margin-bottom:var(--sp-12);
  letter-spacing:3px;
  text-align:center;
  font-weight:var(--fw-medium);
}
.danger-confirm-input:focus{border-color:rgba(239,68,68,.4)}
.danger-btns{display:flex;gap:var(--sp-8)}
.danger-cancel{
  flex:1;padding:10px;
  background:transparent;border:0.5px solid var(--b1);
  border-radius:var(--r-sm);color:var(--t2);
  cursor:pointer;font-family:inherit;font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  transition:all var(--dur-fast) var(--ease-sharp);
}
.danger-cancel:hover{border-color:var(--b2);color:var(--tc)}
.danger-ok{
  flex:1;padding:10px;
  background:rgba(239,68,68,.12);
  border:0.5px solid rgba(239,68,68,.25);
  border-radius:var(--r-sm);
  color:var(--red);cursor:pointer;
  font-family:inherit;font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  transition:all var(--dur-fast) var(--ease-sharp);
}
.danger-ok:hover{background:rgba(239,68,68,.22)}

/* ============================================================
   § MEDIA
   ============================================================ */
.ex-media{padding:var(--sp-12) var(--sp-16)}
.media-title{
  font-size:9px;color:var(--t3);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:var(--sp-8);font-weight:var(--fw-medium);
}
.media-inp{display:flex;gap:var(--sp-8)}
.media-inp input{
  flex:1;background:var(--s3);border:0.5px solid var(--b1);
  border-radius:var(--r-sm);padding:7px var(--sp-12);
  font-size:11px;color:var(--t2);outline:none;font-family:inherit;
}
.media-inp input:focus{border-color:var(--b2);color:var(--tc)}
.media-inp input::placeholder{color:var(--t3)}
.media-add{
  background:var(--s3);border:0.5px solid var(--b1);
  border-radius:var(--r-sm);padding:7px var(--sp-12);
  font-size:11px;color:var(--t2);cursor:pointer;
  font-family:inherit;white-space:nowrap;
  transition:all var(--dur-fast);font-weight:var(--fw-medium);
}
.media-add:hover{border-color:var(--b2);color:var(--tc)}

.media-item{
  display:flex;align-items:center;gap:var(--sp-8);
  margin-top:var(--sp-8);background:var(--bg);
  border-radius:var(--r-sm);padding:6px var(--sp-12);
  border:0.5px solid var(--b1);
}
.media-type{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;width:28px;flex-shrink:0;font-weight:var(--fw-medium)}
.media-url{font-size:11px;color:var(--blue);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.media-del{font-size:10px;color:var(--t3);cursor:pointer;padding:2px var(--sp-4)}
.media-del:hover{color:var(--red)}
.media-yt{width:100%;border-radius:var(--r-md);margin-top:var(--sp-8);aspect-ratio:16/9;border:none;background:var(--bg)}

.media-img-wrap{position:relative;margin-top:var(--sp-8)}
.media-img{
  width:100%;border-radius:var(--r-md);
  max-height:160px;object-fit:cover;
  border:0.5px solid var(--b1);cursor:zoom-in;
  transition:opacity var(--dur-fast);display:block;
}
.media-img:hover{opacity:0.88}
.img-expand-btn{
  position:absolute;bottom:var(--sp-8);right:var(--sp-8);
  width:26px;height:26px;border-radius:var(--r-sm);
  background:rgba(0,0,0,.6);border:0.5px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.8);font-size:10px;
  transition:all var(--dur-fast);
  backdrop-filter:blur(4px);
}
.img-expand-btn:hover{background:rgba(0,0,0,.82)}

.img-lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-24);animation:fadeIn var(--dur-base) ease;cursor:zoom-out;
}
.img-lightbox img{
  max-width:100%;max-height:90vh;border-radius:var(--r-lg);
  animation:expandImg var(--dur-slow) var(--ease-spring);
}
.img-lightbox-close{
  position:absolute;top:var(--sp-16);right:var(--sp-16);
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.08);
  border:0.5px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.8);font-size:14px;
  transition:all var(--dur-fast);
}
.img-lightbox-close:hover{background:rgba(255,255,255,.15)}

/* ============================================================
   § BADGE — semana "base" label
   ============================================================ */
.ex-base-badge{
  font-size:9px;color:var(--blue);
  background:rgba(96,165,250,.07);
  border:0.5px solid rgba(96,165,250,.18);
  padding:1px 6px;border-radius:var(--r-sm);
  margin-left:var(--sp-4);letter-spacing:0.2px;
  font-weight:var(--fw-medium);
}

/* ============================================================
   § TOAST
   ============================================================ */
.toast{
  position:absolute;
  bottom:86px;left:50%;
  transform:translateX(-50%);
  background:var(--s4); /* s3 → s4: toast deve flutuar acima do conteúdo */
  color:var(--tc);
  padding:8px var(--sp-16);
  border-radius:var(--r-pill);
  font-size:var(--fs-sub);
  z-index:200;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  /* Sem borda: sombra é suficiente para separação visual (Phase 4) */
  letter-spacing:0.3px;
  font-weight:var(--fw-medium);
  transition:opacity var(--dur-base);
  box-shadow:0 4px 24px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.04) inset;
}
.toast.show{opacity:1;animation:toastIn var(--dur-base) var(--ease-spring)}
/* Toast de PR — destaque elegante em verde */
.toast.pr-toast{
  background:rgba(34,197,94,0.14);
  color:var(--green);
  border:0.5px solid rgba(34,197,94,0.28);
  box-shadow:0 4px 24px rgba(34,197,94,.15),0 1px 0 rgba(34,197,94,.08) inset;
}

/* ============================================================
   § HISTORY MEDIA
   ============================================================ */
.hist-media-row{display:flex;gap:var(--sp-8);overflow-x:auto;padding:var(--sp-8) 0;scrollbar-width:none}
.hist-media-row::-webkit-scrollbar{display:none}
.hist-thumb{
  width:64px;height:64px;border-radius:var(--r-md);
  object-fit:cover;border:0.5px solid var(--b1);flex-shrink:0;
  cursor:zoom-in;transition:transform var(--dur-base) var(--ease-spring),opacity var(--dur-fast);
}
.hist-thumb:hover{transform:scale(1.05);opacity:0.9}

/* ============================================================
   § PAGE TRANSITION
   ============================================================ */
.page-anim{animation:pageIn var(--dur-base) var(--ease-out)}

/* ============================================================
   § ANIMATIONS
   ============================================================ */
@keyframes slideDown{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
/* QUICK WIN #4: animações de saída simétricas às de entrada */
@keyframes slideUp{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-6px)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes fadeOut{
  from{opacity:0}
  to{opacity:0}
}
@keyframes modalOut{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(16px) scale(0.99)}
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes popIn{
  from{opacity:0;transform:scale(0.94)}
  to{opacity:1;transform:scale(1)}
}
@keyframes expandImg{
  from{opacity:0;transform:scale(0.92)}
  to{opacity:1;transform:scale(1)}
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(24px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(-50%) translateY(8px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.45}
}
/* QUICK WIN #6: pulse ao registrar bloco */
@keyframes donePulse{
  0%{transform:scale(1);box-shadow:0 0 6px rgba(34,197,94,0.4)}
  40%{transform:scale(2.2);box-shadow:0 0 12px rgba(34,197,94,0.7)}
  100%{transform:scale(1);box-shadow:0 0 6px rgba(34,197,94,0.4)}
}

/* ============================================================
   § REORDER MODE — Sistema de reorganização de blocos
   ============================================================ */

/* Botão "Reorganizar blocos" — combinado com o estilo .add-b existente */
.reorder-btn {
  display: flex;
  align-items: center;
  gap: var(--sp-8);
  background: transparent;
  border: 0.5px solid var(--b1);
  border-radius: var(--r-md);
  padding: 10px var(--sp-16);
  cursor: pointer;
  color: var(--t2);
  font-size: var(--fs-sub);
  font-family: inherit;
  width: 100%;
  margin-top: var(--sp-8);
  transition: border-color var(--dur-fast) var(--ease-sharp),
              color var(--dur-fast) var(--ease-sharp),
              background var(--dur-fast) var(--ease-sharp),
              transform var(--dur-fast) var(--ease-spring);
  font-weight: var(--fw-medium);
  letter-spacing: 0.5px;
}
.reorder-btn:hover { border-color: var(--b2); color: var(--tc); background: var(--s3); }
.reorder-btn:active { transform: scale(0.98); }
.reorder-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Faixa de modo de edição — aparece no topo da lista de blocos */
.reorder-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid var(--b2);
  border-radius: var(--r-md);
  padding: 10px var(--sp-16);
  margin-bottom: var(--sp-8);
  animation: slideDown var(--dur-base) var(--ease-out);
  gap: var(--sp-12);
}
.reorder-banner-label {
  font-size: var(--fs-sub);
  color: var(--t2);
  font-weight: var(--fw-medium);
  letter-spacing: 0.3px;
  flex: 1;
}
.reorder-banner-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ac);
  flex-shrink: 0;
  animation: pulse 1.8s ease-in-out infinite;
}
.reorder-done-btn {
  background: var(--s3);
  border: 0.5px solid var(--b2);
  border-radius: var(--r-sm);
  padding: 6px 14px;
  color: var(--tc);
  font-size: var(--fs-sub);
  font-family: inherit;
  font-weight: var(--fw-medium);
  cursor: pointer;
  transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
.reorder-done-btn:hover { background: var(--s4); }
.reorder-done-btn:active { transform: scale(0.94); }

/* Bloco arrastável em modo reorder */
.bc-reorder {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  transition: opacity var(--dur-base) var(--ease-sharp),
              border-color var(--dur-base) var(--ease-sharp);
  position: relative;
}

/* Handle de drag */
.drag-handle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  flex-shrink: 0;
  cursor: grab;
  color: var(--t3);
  padding: 14px 8px 14px 14px;
  transition: color var(--dur-fast);
  touch-action: none;
}
.drag-handle svg { width: 14px; height: 14px; fill: currentColor; stroke: none; display: block; }
.bc-reorder:hover .drag-handle { color: var(--t2); }

/* Placeholder: espaço vazio onde o bloco vai cair */
.bc-placeholder {
  border: 1.5px dashed var(--b2);
  border-radius: var(--r-lg);
  margin-bottom: var(--sp-8);
  background: rgba(255,255,255,0.02);
  box-sizing: border-box;
}

/* Ghost: clone visual que flutua — usa transform, nao left/top */
.bc-drag-ghost {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 9999;
  pointer-events: none;
  will-change: transform;
  border-radius: var(--r-lg);
  background: var(--s2);
  border: 1px solid var(--b2);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.35);
  opacity: 0.97;
}

/* Item sendo arrastado: invisivel mas ocupa espaco (placeholder substitui visualmente) */
.bc-dragging {
  opacity: 0 !important;
  pointer-events: none;
}

/* ============================================================
   § LIGHT THEME OVERRIDES — QUICK WIN #5
   Corrige inconsistências em temas claros:
   - .sreg precisa de fundo visível em bg claro
   - .trnd badges precisam de contraste adequado
   - .add-b border dashed precisa de visibilidade
   ============================================================ */
[data-theme-light] .sreg{
  background:rgba(0,0,0,0.04);
  border-color:rgba(0,0,0,0.18);
  color:var(--tc);
}
[data-theme-light] .sreg:hover{
  background:rgba(0,0,0,0.08);
}
[data-theme-light] .add-b{
  border-color:rgba(0,0,0,0.18);
  color:var(--t2);
}
[data-theme-light] .trnd.up{
  color:#15803d;
  background:rgba(21,128,61,.10);
  border-color:rgba(21,128,61,.22);
}
[data-theme-light] .trnd.dn{
  color:#b91c1c;
  background:rgba(185,28,28,.08);
  border-color:rgba(185,28,28,.18);
}

/* ============================================================
   § BLOCK COMPLETION STATE — QUICK WIN #6
   Bloco registrado recebe borda verde sutil no header
   ============================================================ */
.bc.done-block{
  border-color:rgba(34,197,94,0.20);
}
.bc.done-block .bh{
  background:rgba(34,197,94,0.025);
}
.btn-ripple{position:relative;overflow:hidden}
.btn-ripple::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
  transform:scale(0);border-radius:inherit;pointer-events:none;
}
.btn-ripple:active::after{
  animation:ripple 0.35s var(--ease-sharp);
}
[data-theme-light] .btn-ripple::after{
  background:radial-gradient(circle, rgba(0,0,0,.07) 0%, transparent 70%);
}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(2.5);opacity:0}}

/* ============================================================
   § JOURNAL SYSTEM
   Integrado ao design system BLOC — mesmos tokens, mesma linguagem
   ============================================================ */

/* ── Botão Journal no bloco ── */
.journal-btn{
  width:100%;
  margin-top:var(--sp-8);
  padding:var(--sp-12);
  background:transparent;
  border:0.5px solid var(--b1);
  border-radius:var(--r-md);
  color:var(--t2);
  font-size:var(--fs-sub);
  cursor:pointer;
  font-family:inherit;
  font-weight:var(--fw-medium);
  letter-spacing:1px;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:var(--sp-8);
  transition:all var(--dur-base) var(--ease-sharp),
             transform var(--dur-fast) var(--ease-spring);
}
.journal-btn:hover{border-color:var(--b2);color:var(--tc);background:rgba(255,255,255,0.03)}
.journal-btn:active{transform:scale(0.97)}
.journal-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.journal-btn.has-entry{
  border-color:rgba(96,165,250,0.28);
  color:var(--blue);
  background:rgba(96,165,250,0.04);
}
.journal-btn.has-entry:hover{background:rgba(96,165,250,0.08)}

/* ── Header da tela Journal — sticky dentro do #content ── */
.journal-hdr{
  position:sticky;
  top:-16px; /* compensa o padding-top padrão do #content */
  background:var(--bg);
  padding:var(--sp-12) var(--sp-16) var(--sp-16);
  margin:-16px -16px var(--sp-16);
  border-bottom:0.5px solid var(--b1);
  display:flex;
  align-items:center;
  gap:var(--sp-12);
  z-index:10;
  /* Compact mode: JS seta padding-top do #content para 12px,
     mas o sticky top precisa de -12px nesse caso. 
     Resolvido via variável injetada pelo applyAppearance. */
  top:var(--journal-hdr-top, -16px);
}
.journal-back{
  width:32px;height:32px;
  border-radius:var(--r-sm);
  background:transparent;
  border:0.5px solid var(--b1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--t2);flex-shrink:0;
  transition:all var(--dur-fast) var(--ease-sharp),transform var(--dur-fast) var(--ease-spring);
}
.journal-back:hover{border-color:var(--b2);color:var(--tc);background:var(--s3)}
.journal-back:active{transform:scale(0.9)}
.journal-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.journal-hdr-info{flex:1;min-width:0}
.journal-hdr-title{font-size:var(--fs-body);font-weight:var(--fw-medium);color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journal-hdr-sub{font-size:var(--fs-sub);color:var(--t2);margin-top:1px}
.journal-save-btn{

  cursor:pointer;flex-shrink:0;
  transition:opacity var(--dur-fast),transform var(--dur-fast) var(--ease-spring);
}
.journal-save-btn:hover{opacity:0.88}
.journal-save-btn:active{transform:scale(0.95)}

/* ── Contexto automático ── */
.journal-ctx{
  background:var(--s1);border:0.5px solid var(--b1);
  border-radius:var(--r-lg);padding:var(--sp-12) var(--sp-16);
  margin-bottom:var(--sp-16);display:flex;gap:var(--sp-16);flex-wrap:wrap;
}

.journal-ctx-label{font-size:9px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;font-weight:var(--fw-medium)}
.journal-ctx-val{font-size:var(--fs-sub);color:var(--t2);font-weight:var(--fw-normal)}

/* ── Seção de texto ── */
.journal-section{margin-bottom:var(--sp-16)}
.journal-section-label{
  font-size:var(--fs-micro);color:var(--t3);letter-spacing:1.5px;
  text-transform:uppercase;font-weight:var(--fw-medium);
  margin-bottom:var(--sp-8);display:flex;align-items:center;gap:var(--sp-8);
}
.journal-section-label::after{content:'';flex:1;height:0.5px;background:var(--t4)}

.journal-textarea{
  width:100%;min-height:140px;
  background:var(--s1);border:0.5px solid var(--b1);
  border-radius:var(--r-lg);padding:var(--sp-16);
  font-size:15px;color:var(--tc);
  font-family:inherit;font-weight:var(--fw-normal);
  line-height:1.65;resize:none;outline:none;
  transition:border-color var(--dur-fast) var(--ease-sharp),background var(--dur-fast);
  -webkit-appearance:none;
  caret-color:var(--ac);
}
.journal-textarea:focus{border-color:var(--b2);background:var(--s2)}
.journal-textarea::placeholder{color:var(--t3);font-style:italic}

/* ── Autosave indicator ── */
.journal-autosave{
  font-size:10px;color:var(--t3);text-align:right;
  margin-top:var(--sp-4);letter-spacing:0.3px;
  transition:color var(--dur-base);min-height:14px;
}
.journal-autosave.saved{color:var(--green);opacity:0.7}

/* ── Seção fotos ── */
.journal-photos-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:var(--sp-8);margin-bottom:var(--sp-8);
}
.journal-photo-wrap{
  position:relative;aspect-ratio:1;
  border-radius:var(--r-md);overflow:hidden;
  border:0.5px solid var(--b1);
  animation:popIn var(--dur-base) var(--ease-spring);
}
.journal-photo-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  cursor:zoom-in;transition:transform var(--dur-base) var(--ease-spring);
}
.journal-photo-wrap img:hover{transform:scale(1.04)}
.journal-photo-del{
  position:absolute;top:4px;right:4px;
  width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,0.72);color:#fff;
  border:none;cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--dur-fast);backdrop-filter:blur(4px);
}
.journal-photo-del:hover{background:rgba(239,68,68,0.85)}
.journal-add-photo{
  aspect-ratio:1;border-radius:var(--r-md);
  border:0.5px dashed var(--t3);
  background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-4);color:var(--t3);font-size:10px;letter-spacing:0.5px;
  transition:all var(--dur-fast) var(--ease-sharp);font-family:inherit;
  font-weight:var(--fw-medium);text-transform:uppercase;
}
.journal-add-photo svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.journal-add-photo:hover{border-color:var(--t2);color:var(--t2)}
.journal-add-photo:active{transform:scale(0.96)}

/* ── Seção áudio ── */
.journal-audio-ui{
  background:var(--s1);border:0.5px solid var(--b1);
  border-radius:var(--r-lg);padding:var(--sp-16);
}
.journal-rec-btn{
  width:100%;padding:var(--sp-12);
  background:transparent;border:0.5px solid var(--b1);
  border-radius:var(--r-md);cursor:pointer;
  font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-medium);
  color:var(--t2);display:flex;align-items:center;justify-content:center;gap:var(--sp-8);
  letter-spacing:0.5px;transition:all var(--dur-base) var(--ease-sharp),transform var(--dur-fast) var(--ease-spring);
}
.journal-rec-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.journal-rec-btn:hover{border-color:var(--b2);color:var(--tc)}
.journal-rec-btn:active{transform:scale(0.97)}
.journal-rec-btn.recording{
  border-color:rgba(239,68,68,0.45);color:var(--red);
  background:rgba(239,68,68,0.06);
  animation:pulse 1.4s ease infinite;
}
.journal-rec-timer{
  text-align:center;font-size:var(--fs-display);font-weight:var(--fw-medium);
  color:var(--red);letter-spacing:-1px;margin:var(--sp-12) 0;
  font-variant-numeric:tabular-nums;
}
.journal-audio-item{
  display:flex;align-items:center;gap:var(--sp-12);
  background:var(--s2);border:0.5px solid var(--b1);
  border-radius:var(--r-md);padding:var(--sp-8) var(--sp-12);
  margin-top:var(--sp-8);animation:slideDown var(--dur-base) var(--ease-out);
}
.journal-audio-item audio{flex:1;height:32px;min-width:0}
.journal-audio-del{
  width:28px;height:28px;border-radius:var(--r-sm);
  background:transparent;border:0.5px solid var(--b1);
  color:var(--t3);cursor:pointer;font-size:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast);
}
.journal-audio-del:hover{border-color:rgba(239,68,68,0.4);color:var(--red);background:rgba(239,68,68,0.06)}
.journal-audio-lbl{font-size:10px;color:var(--t3);letter-spacing:0.4px;white-space:nowrap}

/* ── Modo sem suporte ── */
.journal-no-audio{
  font-size:var(--fs-sub);color:var(--t3);text-align:center;
  padding:var(--sp-16);letter-spacing:0.2px;
}

/* ── Seção humor (mood) ── */
.journal-mood-row{
  display:flex;gap:var(--sp-8);justify-content:space-between;
}
.journal-mood-opt{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:var(--sp-12) var(--sp-4);
  background:var(--s1);border:0.5px solid var(--b1);
  border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  transition:all var(--dur-base) var(--ease-spring);
}
.journal-mood-opt:active{transform:scale(0.93)}
.journal-mood-opt.selected{border-color:var(--b2);background:var(--s3)}
.journal-mood-emoji{font-size:22px;line-height:1}
.journal-mood-lbl{font-size:9px;color:var(--t3);letter-spacing:0.8px;text-transform:uppercase;font-weight:var(--fw-medium)}
.journal-mood-opt.selected .journal-mood-lbl{color:var(--t2)}

/* ── Guia Journals ── */
.jlist-empty{
  text-align:center;color:var(--t2);font-size:var(--fs-sub);
  padding:var(--sp-48) var(--sp-16);line-height:2;letter-spacing:0.2px;
}
.jlist-empty strong{
  display:block;font-size:16px;color:var(--tc);
  font-weight:var(--fw-medium);margin-bottom:var(--sp-4);
}

/* ── Card de dia (agrupa blocos) ── */
.jday-card{
  background:var(--s1);
  border:0.5px solid var(--b1);
  border-radius:var(--r-lg);
  margin-bottom:var(--sp-8);
  overflow:hidden;
  transition:border-color var(--dur-fast) var(--ease-sharp);
}
.jday-card.open{border-color:var(--b2)}

.jday-hdr{
  display:flex;
  align-items:center;
  gap:var(--sp-12);
  padding:var(--sp-12) var(--sp-16);
  cursor:pointer;
  user-select:none;
  transition:background var(--dur-fast) var(--ease-sharp);
}
.jday-hdr:active{background:rgba(255,255,255,0.04)}

.jday-date-col{
  flex-shrink:0;
  text-align:center;
  min-width:36px;
}
.jday-num{
  font-size:22px;
  font-weight:var(--fw-medium);
  color:var(--tc);
  line-height:1;
  letter-spacing:-1px;
}
.jday-month{
  font-size:9px;
  color:var(--t2);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-top:2px;
  font-weight:var(--fw-medium);
}

.jday-info{flex:1;min-width:0}
.jday-weekday{
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
  color:var(--tc);
}
.jday-meta{
  font-size:var(--fs-sub);
  color:var(--t2);
  margin-top:2px;
}

.jday-right{display:flex;align-items:center;gap:var(--sp-8);flex-shrink:0}
.jday-count{
  font-size:var(--fs-micro);
  color:var(--t3);
  letter-spacing:0.5px;
}

/* Lista de blocos dentro do dia */
.jday-body{
  border-top:0.5px solid var(--t4);
  animation:slideDown var(--dur-base) var(--ease-out);
}

.jblock-row{
  display:flex;
  align-items:center;
  gap:var(--sp-12);
  padding:var(--sp-12) var(--sp-16);
  border-bottom:0.5px solid var(--t4);
  cursor:pointer;
  transition:background var(--dur-fast) var(--ease-sharp);
}
.jblock-row:last-child{border-bottom:none}
.jblock-row:active{background:rgba(255,255,255,0.04)}
.jblock-row:hover{background:var(--s2)}

.jblock-icon{
  width:28px;height:28px;
  border-radius:var(--r-sm);
  background:var(--s3);
  border:0.5px solid var(--b1);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--t2);
}
.jblock-icon svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.jblock-info{flex:1;min-width:0}
.jblock-label{
  font-size:var(--fs-sub);
  font-weight:var(--fw-medium);
  color:var(--tc);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.jblock-preview{
  font-size:var(--fs-micro);
  color:var(--t2);
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.jblock-preview.empty{color:var(--t3);font-style:italic}

.jblock-badges{display:flex;gap:3px;flex-shrink:0}
.jblock-dot{
  width:5px;height:5px;border-radius:50%;
  flex-shrink:0;margin-top:1px;
}
.jblock-dot.photo{background:var(--blue)}
.jblock-dot.audio{background:var(--yellow)}
.jblock-dot.mood{background:var(--green)}

/* Search/Filter bar para Journals */
.jsearch{
  background:var(--s1);border:0.5px solid var(--b1);
  border-radius:var(--r-md);padding:10px var(--sp-12);
  font-size:var(--fs-body);color:var(--tc);
  width:100%;outline:none;font-family:inherit;
  transition:border-color var(--dur-fast);margin-bottom:var(--sp-16);
  -webkit-appearance:none;
}
.jsearch:focus{border-color:var(--b2);background:var(--s2)}
.jsearch::placeholder{color:var(--t3)}

/* Journal badge no nav — ponto azul quando há journals */
.nb .journal-dot{

}
